/* ---------------------------------------------------------------- loop */

/**
 * Steps the tier down once when the frame rate is persistently bad.
 * Only armed on "auto" — an explicit choice is an instruction, not a suggestion.
 */
const watchdog = qualityChoice === "auto" && tierName !== "low"
  ? makeFpsWatchdog({
      onDrop: (fps) => {
        const next = tierName === "high" ? "medium" : "low";
        console.info(`[roperaid] ${Math.round(fps)}fps sustained; dropping ${tierName} -> ${next}`);
        applyQuality(next, { auto: true });
      },
    })
  : null;

function frame(now) {
  requestAnimationFrame(frame);
  now = now ?? performance.now();

  // Frame cap. This is the lever that helps a device that is simply out of fill rate: a
  // steady 30 reads as smooth where an unstable 45 reads as stutter, and it halves GPU
  // load. The 1ms slack stops a frame arriving a hair early from being skipped, which
  // would otherwise halve the rate again.
  //
  // The physics step lives inside this gate deliberately. Rapier runs at a fixed 1/60
  // timestep, so stepping it once per RENDERED frame at 30fps makes the race run at half
  // speed. Stepping it twice keeps wall-clock pace with an uncapped run.
  if (Q.targetFps) {
    if (now - lastDraw < 1000 / Q.targetFps - 1) return;
    lastDraw = now;
  }

  watchdog?.tick(now);

  if (phase === "racing") {
    step();
    // Progress updates: send on CHANGE, not on a timer.
    //
    // This used to fire 10x a second regardless, so a stationary player still generated 600
    // messages a minute to every phone. Over a link with real latency that is bandwidth
    // spent on nothing, and it queues behind the input that actually matters. Phones
    // interpolate between updates, so a lower rate looks the same and costs a fraction.
    const now = performance.now();
    if (now - lastBroadcast > PROGRESS_MIN_MS) {
      const progress = {};
      let changed = false;
      for (const id in players) {
        const pct = Math.round((players[id].rb.translation().x / courseLength) * 100);
        progress[id] = pct;
        if (pct !== lastProgress[id]) changed = true;
      }
      // Resend periodically even when unchanged, so a phone that missed one recovers.
      if (changed || now - lastBroadcast > PROGRESS_KEEPALIVE_MS) {
        lastBroadcast = now;
        Object.assign(lastProgress, progress);
        freeconsole.broadcast({ phase: "racing", progress });
      }
    }
  }

  // Camera follows the furthest live player and never retreats - that's what makes
  // "left behind" a genuine threat.
  let lead = 0;
  for (const id in players) {
    const r = players[id];
    if (!r.out) lead = Math.max(lead, r.rb.translation().x);
  }
  cameraX = Math.max(cameraX, cameraX + (lead + viewW * 0.16 - cameraX) * 0.06);
  camera.position.x = cameraX;
  // Look very slightly down and along the course rather than straight down the z axis.
  // Dead-on, perspective has nothing to work with and the scene flattens out again.
  camera.lookAt(cameraX + 6, 1, 0);
  // The camera stays put vertically. Tracking the leader up and down was pushing the
  // anchor band off the top of the screen, which left nothing visible to grapple - the
  // whole play area fits in the 38m view, so there is nothing to follow.
  camera.position.y = 0;

  // Hide buildings outside the visible span. The camera's own z and aspect are passed so
  // each depth row is culled against its own frustum width rather than the play plane's -
  // otherwise the far rows pop into view at the screen edge.
  if (cityView) cityView.update(cameraX, viewW, camera.position.z, camera.aspect);
  cullCourse();

  syncMeshes();
  updateHud();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

let lastBroadcast = 0;
const lastProgress = {};        // last values sent, so unchanged frames send nothing
// 5Hz when something is moving: phones interpolate between updates, so this looks
// identical to 10Hz while halving the traffic.
const PROGRESS_MIN_MS = 200;
// ...and a resend every second regardless, so a dropped update self-heals.
const PROGRESS_KEEPALIVE_MS = 1000;

/* ---------------------------------------------------------------- boot */

// Rapier is WASM, so everything waits on its init.
await RAPIER.init();
world = new RAPIER.World({ x: 0, y: GRAVITY });
world.timestep = 1 / 60;

/**
 * Editor test mode: ?test=1 with a map in the URL hash.
 *
 * Runs the real game against a map being designed, with a keyboard-driven dummy player,
 * so a course can be played before it's exported. Everything else - physics, rendering,
 * elimination - is exactly the live game.
 */
// Scenery first, so the first course is built with buildings rather than an empty skyline.
await Promise.all([loadCityModels(), loadAvatar()]);
assetsReady = true;
// Anyone who connected while the assets were loading is still waiting for a runner.
syncPlayers();
// Announce the active tier once the assets are in. Any controller already up gets it now;
// one that joins later asks for it itself with get-quality when it opens the panel.
broadcastQuality();

const params = new URLSearchParams(location.search);
const isTest = params.get("test") === "1";
let testMap = null;
if (isTest && location.hash.length > 1) {
  try { testMap = JSON.parse(decodeURIComponent(location.hash.slice(1))); }
  catch (err) { console.error("bad test map", err); }
}

if (isTest) {
  startTestMode(testMap);
} else {

  buildCourse(1);
  phase = "lobby";
  document.getElementById("lobbyNote").textContent = "Waiting for players…";
  syncPlayers();
}
requestAnimationFrame(frame);

/**
 * A single local player driven by the keyboard, for testing a map without phones.
 * Space or click holds the grapple, exactly as a controller would.
 */
function startTestMode(map) {
  const runner = makeRunner(0, 0);
  players[0] = runner;
  buildCourse(map || 1);
  document.getElementById("lobby").classList.remove("show");
  buildRail();
  renderRoster();

  // Same countdown the real game uses, so testing exercises the real start sequence.
  phase = "countdown";
  cancelCountdown = runCountdown(() => {
    phase = "racing";
    raceStart = Date.now();
    // Start the physics clock fresh: the gap since the last race is not simulation time.
    physicsDebt = 0;
    lastStepAt = performance.now();
  });

  const setHold = (held) => {
    if (phase !== "racing") return;
    runner.holding = held;
    if (held) attachRope(runner);
    else detachRope(runner);
  };

  window.addEventListener("keydown", (e) => {
    if (e.code === "Space") { e.preventDefault(); setHold(true); }
    if (e.code === "KeyR") restartTest(map);
  });
  window.addEventListener("keyup", (e) => {
    if (e.code === "Space") { e.preventDefault(); setHold(false); }
  });
  window.addEventListener("pointerdown", () => setHold(true));
  window.addEventListener("pointerup", () => setHold(false));

  const tip = document.querySelector(".tip");
  if (tip) tip.textContent = "TEST — hold SPACE or click to grapple · R to restart";
}

function restartTest(map) {
  const runner = players[0];
  if (!runner) return;
  detachRope(runner);
  runner.rb.setTranslation({ x: SPAWN.x, y: SPAWN.y }, true);
  runner.rb.setLinvel({ x: SPAWN_VX, y: SPAWN_VY }, true);
  runner.lean = 0;
  runner.finished = false; runner.out = false; runner.outReason = null;
  runner.mesh.visible = true;
  finishedOrder = [];
  document.getElementById("finish").classList.remove("show");
  buildCourse(map || 1);

  // Count the restart in as well, so R exercises the same start sequence as a real round.
  if (cancelCountdown) { cancelCountdown(); cancelCountdown = null; }
  phase = "countdown";
  cancelCountdown = runCountdown(() => {
    phase = "racing";
    raceStart = Date.now();
    // Start the physics clock fresh: the gap since the last race is not simulation time.
    physicsDebt = 0;
    lastStepAt = performance.now();
  });
}
</script>
</body>
</html>
