<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Nidhogg — Controller</title>
<link rel="stylesheet" href="/console.css" />
<style>
  * { -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { height: 100%; overflow: hidden; }
  body {
    display: flex; flex-direction: column;
    touch-action: none; overscroll-behavior: none;
    padding: max(6px, env(safe-area-inset-top)) 8px max(8px, env(safe-area-inset-bottom));
    gap: 8px;
  }

  .status {
    text-align: center; color: var(--text-dim); font-size: 12px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    min-height: 16px;
  }
  .status .armed {
    font-family: var(--font-mono); font-size: 10px; letter-spacing: .1em;
    text-transform: uppercase; padding: 2px 7px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--text-faint);
  }
  .status .armed.on { color: var(--amber); border-color: var(--amber); }

  /* The pad fills everything left over. Three columns: move, guard, attack. Guard sits in
     the middle where both thumbs can reach it, because changing height is the most frequent
     decision in the game. */
  #pad {
    flex: 1; display: grid; gap: 8px;
    grid-template-columns: 1fr 1.05fr 1fr;
    min-height: 0;
  }
  #pad.locked { opacity: .35; pointer-events: none; }

  .col { display: grid; gap: 8px; min-height: 0; }
  .col.move { grid-template-rows: 1fr; }
  .col.act { grid-template-rows: 1.2fr 1fr; }

  .key {
    border-radius: 14px; border: 1px solid var(--line);
    background: rgba(26,32,56,.55);
    display: grid; place-items: center; text-align: center;
    font-family: var(--font-display); font-weight: 700;
    font-size: clamp(11px, 3.2vw, 16px); letter-spacing: .06em;
    color: var(--text); position: relative; overflow: hidden;
    transition: background .06s, transform .06s, box-shadow .06s;
  }
  .key .sub {
    display: block; font-family: var(--font-mono); font-weight: 400;
    font-size: 9px; letter-spacing: .1em; color: var(--text-faint); margin-top: 3px;
  }
  .key.down { transform: scale(.97); }

  /* Movement: an analog stick that floats to wherever the left thumb lands. The whole column
     is the touch surface, so there is nothing to aim at — the base is drawn under the thumb.
     Angle picks the direction bits, distance past a threshold commits to a run. */
  .stick {
    position: relative; border-radius: 16px;
    border: 1px solid var(--line); background: rgba(10,12,24,.5);
    overflow: hidden; touch-action: none;
  }
  .stick .hint {
    position: absolute; inset: 0; display: grid; place-items: center; gap: 4px;
    font-family: var(--font-mono); font-size: 10px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--text-faint);
    transition: opacity .12s; pointer-events: none; text-align: center; line-height: 1.7;
  }
  .stick.active .hint { opacity: 0; }

  .stick .base, .stick .nub {
    position: absolute; border-radius: 50%; pointer-events: none;
    left: 0; top: 0; opacity: 0;
    transition: opacity .12s;
    will-change: transform;
  }
  .stick.active .base, .stick.active .nub { opacity: 1; }
  .stick .base {
    width: 132px; height: 132px; margin: -66px 0 0 -66px;
    border: 1px solid rgba(53,240,224,.35);
    background: radial-gradient(circle, rgba(53,240,224,.10), transparent 70%);
  }
  .stick .nub {
    width: 62px; height: 62px; margin: -31px 0 0 -31px;
    background: rgba(53,240,224,.22);
    border: 1px solid rgba(53,240,224,.75);
    box-shadow: 0 0 22px rgba(53,240,224,.35);
  }
  /* Running is the state worth reading at a glance, so the nub goes hot rather than louder. */
  .stick.run .nub {
    background: rgba(255,194,71,.26); border-color: var(--amber);
    box-shadow: 0 0 26px rgba(255,194,71,.45);
  }

  .dpad { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  /* Guard strip: three stacked zones. Sliding a thumb up and down the strip changes height
     without lifting, which is what makes fencing possible on glass. */
  .guard { display: grid; grid-template-rows: 1fr 1fr 1fr; gap: 6px; }
  .gkey {
    border-radius: 12px; border: 1px solid var(--line);
    background: rgba(10,12,24,.6);
    display: grid; place-items: center; gap: 2px;
    font-family: var(--font-mono); font-size: 10px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--text-faint);
    transition: background .08s, color .08s, box-shadow .08s, border-color .08s;
  }
  .gkey .bar {
    width: 58%; height: 4px; border-radius: 2px;
    background: var(--text-faint); transition: background .08s, box-shadow .08s;
  }
  .gkey.on {
    background: rgba(255,194,71,.16); border-color: var(--amber); color: var(--amber);
    box-shadow: 0 0 20px rgba(255,194,71,.28);
  }
  .gkey.on .bar { background: var(--amber); box-shadow: 0 0 14px var(--amber); }

  /* Attacks. Stab is the big one; kick and throw share the row below. */
  .key.stab {
    background: linear-gradient(150deg, var(--hot), var(--hot-dim));
    border-color: transparent; box-shadow: var(--bloom-hot);
    font-size: clamp(13px, 4vw, 20px);
  }
  .key.stab.down { filter: brightness(1.2); transform: scale(.97); }
  .small { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  #banner {
    position: fixed; inset: 0; z-index: 20;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; background: rgba(5,6,13,.94); text-align: center; padding: 24px;
  }
  #banner.show { display: flex; }
  #banner .big {
    font-size: clamp(26px, 9vw, 46px); font-weight: 700; line-height: 1.05;
    color: var(--glow); text-shadow: var(--bloom-glow);
  }
  #banner .sub { color: var(--text-dim); font-size: 14px; max-width: 32ch; }
</style>
</head>
<body>

<div class="status">
  <span id="status">Connecting…</span>
  <span class="armed" id="armed">unarmed</span>
</div>

<div id="pad" class="locked">
  <div class="col move">
    <div class="stick" id="stick">
      <div class="hint">Move<br />push far to run<br />up to jump · down to duck</div>
      <div class="base" id="stickBase"></div>
      <div class="nub" id="stickNub"></div>
    </div>
  </div>

  <div class="col guard" id="guard">
    <div class="gkey" data-guard="0"><div class="bar"></div>High</div>
    <div class="gkey on" data-guard="1"><div class="bar"></div>Mid</div>
    <div class="gkey" data-guard="2"><div class="bar"></div>Low</div>
  </div>

  <div class="col act">
    <div class="key stab" data-press="attack">STAB<span class="sub">run to lunge</span></div>
    <div class="small">
      <div class="key" data-press="kick">KICK</div>
      <div class="key" data-press="throw">THROW</div>
    </div>
  </div>
</div>

<div id="banner">
  <div class="big" id="bannerBig">—</div>
  <div class="sub" id="bannerSub"></div>
</div>

<script src="/sdk.js"></script>
<script>
(function () {
  "use strict";

  var freeconsole = new FreeConsole();
  freeconsole.setOrientation("landscape");

  var pad = document.getElementById("pad");
  var statusEl = document.getElementById("status");
  var armedEl = document.getElementById("armed");
  var banner = document.getElementById("banner");

  var guard = 1;
  var over = false;

  /** Held keys are sent on change only — never per frame. */
  var held = { left: false, right: false, down: false, run: false, up: false };

  function sendHold(key, value) {
    if (held[key] === value) return;
    held[key] = value;
    freeconsole.message(FreeConsole.SCREEN, { t: "hold", k: key, v: value });
  }
  function sendPress(key) {
    freeconsole.message(FreeConsole.SCREEN, { t: "press", k: key });
  }
  function sendGuard(g) {
    if (g === guard) return;
    guard = g;
    freeconsole.message(FreeConsole.SCREEN, { t: "guard", g: g });
    var keys = document.querySelectorAll("#guard .gkey");
    for (var i = 0; i < keys.length; i++) {
      keys[i].classList.toggle("on", Number(keys[i].dataset.guard) === g);
    }
    freeconsole.vibrate(6);
  }

  /* ------------------------------------------------------------ analog stick */

  /**
   * A floating stick: the base is placed wherever the thumb first lands inside the left
   * column, so there is no target to hit while looking at the TV. Direction bits come from
   * the angle, so diagonals hold left+up together and the wall climb stays reachable.
   *
   * The screen only understands booleans, so the analog part lives entirely here: distance
   * decides walk vs run, angle decides which bits are set, and only changes go on the wire.
   */
  var stick = document.getElementById("stick");
  var stickBase = document.getElementById("stickBase");
  var stickNub = document.getElementById("stickNub");

  var DEAD = 12;        // px of slack before any direction registers
  var RANGE = 58;       // px at which the nub is fully deflected
  var RUN_AT = 38;      // px past which a horizontal push becomes a run
  var VERT_AT = 0.55;   // |y| share of the vector before up/down engages

  var stickId = null;   // pointerId that owns the stick, or null
  var stickOx = 0, stickOy = 0;
  var jumpLatched = false;

  function placeStick(x, y) {
    stickBase.style.transform = "translate(" + x + "px," + y + "px)";
    stickNub.style.transform = "translate(" + x + "px," + y + "px)";
  }

  function stickStart(e) {
    var r = stick.getBoundingClientRect();
    stickId = e.pointerId;
    stickOx = e.clientX - r.left;
    stickOy = e.clientY - r.top;
    jumpLatched = false;
    stick.classList.add("active");
    placeStick(stickOx, stickOy);
    stickMove(e);
  }

  function stickMove(e) {
    var r = stick.getBoundingClientRect();
    var dx = (e.clientX - r.left) - stickOx;
    var dy = (e.clientY - r.top) - stickOy;
    var dist = Math.sqrt(dx * dx + dy * dy);

    // Clamp the nub to the ring so the visual matches what the sim is being told.
    var vis = dist > RANGE ? RANGE / dist : 1;
    stickNub.style.transform =
      "translate(" + (stickOx + dx * vis) + "px," + (stickOy + dy * vis) + "px)";

    if (dist < DEAD) {
      sendHold("left", false); sendHold("right", false);
      sendHold("up", false); sendHold("down", false);
      sendHold("run", false);
      stick.classList.remove("run");
      jumpLatched = false;
      return;
    }

    var nx = dx / dist, ny = dy / dist;

    // Vertical only claims the stick near the poles, so a shallow diagonal still runs.
    var up = ny < -VERT_AT, down = ny > VERT_AT;
    // Horizontal keeps working on a diagonal, which is how you climb a wall while pressing
    // into it — the sim needs left/right and up held at once.
    var left = nx < -0.35, right = nx > 0.35;

    sendHold("left", left);
    sendHold("right", right);
    sendHold("up", up);
    sendHold("down", down);

    var running = (left || right) && !down && dist >= RUN_AT;
    sendHold("run", running);
    stick.classList.toggle("run", running);

    // Jump is a one-shot, but the stick is a continuous control: latch on the way up and
    // only re-arm once the thumb comes back down, so a held-up stick climbs instead of
    // machine-gunning jumps.
    if (up && !jumpLatched) {
      jumpLatched = true;
      sendPress("jump");
      freeconsole.vibrate(8);
    } else if (!up) {
      jumpLatched = false;
    }
  }

  function stickEnd() {
    stickId = null;
    stick.classList.remove("active", "run");
    jumpLatched = false;
    sendHold("left", false); sendHold("right", false);
    sendHold("up", false); sendHold("down", false);
    sendHold("run", false);
  }

  /**
   * Pointer routing.
   *
   * Every pad key is driven from pointer events on the document rather than per-element
   * listeners, so a thumb that slides off a key releases it, and a thumb that slides onto
   * the guard strip changes height without lifting. Tracking by pointerId keeps two thumbs
   * independent — the whole game is left thumb moving while the right thumb fights.
   */
  var active = Object.create(null);   // pointerId -> element

  function keyAt(x, y) {
    var el = document.elementFromPoint(x, y);
    while (el && el !== document.body) {
      if (el.dataset && (el.dataset.hold || el.dataset.press || el.dataset.guard !== undefined)) return el;
      el = el.parentElement;
    }
    return null;
  }

  function engage(pointerId, el) {
    var prev = active[pointerId];
    if (prev === el) return;

    // Leaving a held key releases it. A press key fires once on entry and does not repeat.
    if (prev && prev.dataset.hold) { sendHold(prev.dataset.hold, false); prev.classList.remove("down"); }
    if (prev) prev.classList.remove("down");

    active[pointerId] = el;
    if (!el) return;

    el.classList.add("down");
    if (el.dataset.hold) {
      sendHold(el.dataset.hold, true);
    } else if (el.dataset.press) {
      sendPress(el.dataset.press);
      freeconsole.vibrate(10);
    } else if (el.dataset.guard !== undefined) {
      sendGuard(Number(el.dataset.guard));
    }
  }

  document.addEventListener("pointerdown", function (e) {
    if (over) { restart(); return; }
    e.preventDefault();
    // The stick claims its pointer for good; it must never fall through to key routing.
    if (stickId === null && !pad.classList.contains("locked") && stick.contains(e.target)) {
      stickStart(e);
      return;
    }
    engage(e.pointerId, keyAt(e.clientX, e.clientY));
  }, { passive: false });

  document.addEventListener("pointermove", function (e) {
    if (e.pointerId === stickId) { e.preventDefault(); stickMove(e); return; }
    if (!(e.pointerId in active)) return;
    e.preventDefault();
    var el = keyAt(e.clientX, e.clientY);
    // Sliding between press-keys must not re-fire them; only holds and guards track a move.
    if (el && el.dataset.press && el !== active[e.pointerId]) return;
    engage(e.pointerId, el);
  }, { passive: false });

  function release(e) {
    if (e.pointerId === stickId) { stickEnd(); return; }
    var el = active[e.pointerId];
    if (el) {
      if (el.dataset.hold) sendHold(el.dataset.hold, false);
      el.classList.remove("down");
    }
    delete active[e.pointerId];
  }
  document.addEventListener("pointerup", release);
  document.addEventListener("pointercancel", release);

  // A backgrounded phone must not leave a key stuck down on the screen.
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) {
      stickEnd();
      for (var k in held) if (held[k]) sendHold(k, false);
      for (var id in active) delete active[id];
      var downs = document.querySelectorAll(".key.down, .gkey.down");
      for (var i = 0; i < downs.length; i++) downs[i].classList.remove("down");
    }
  });

  function restart() {
    over = false;
    banner.classList.remove("show");
    freeconsole.message(FreeConsole.SCREEN, { t: "restart" });
  }

  /* ------------------------------------------------------------------ shell */

  freeconsole.onReady = function () {
    statusEl.textContent = "Waiting for the round…";
  };

  freeconsole.onMessage = function (deviceId, data) {
    // Only the screen is authoritative.
    if (deviceId !== FreeConsole.SCREEN || !data) return;
    var me = freeconsole.getDeviceId();

    if (data.armed && me in data.armed) {
      var isArmed = !!data.armed[me];
      armedEl.textContent = isArmed ? "armed" : "unarmed";
      armedEl.classList.toggle("on", isArmed);
    }

    if (data.phase === "fight") {
      over = false;
      banner.classList.remove("show");
      pad.classList.remove("locked");
      var side = data.sides && data.sides[me];
      statusEl.textContent = side === 0 ? "Push right →" : "← Push left";
    } else if (data.phase === "waiting") {
      pad.classList.add("locked");
      statusEl.textContent = "Waiting for two players…";
    } else if (data.phase === "over") {
      over = true;
      pad.classList.add("locked");
      var won = data.winner === me;
      document.getElementById("bannerBig").textContent = won ? "You reached the goal" : "Defeated";
      document.getElementById("bannerSub").textContent = won
        ? "Nidhogg devours you all the same. Tap to fight again."
        : "Tap to fight again.";
      banner.classList.add("show");
      freeconsole.vibrate(won ? 40 : 12);
    }
  };
})();
</script>
</body>
</html>
