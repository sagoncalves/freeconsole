<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nidhogg — Screen</title>
<link rel="stylesheet" href="/console.css" />
<style>
  html, body { height: 100%; overflow: hidden; }
  body { display: flex; flex-direction: column; }

  /* The canvas is the game. Everything else is a thin band above it. */
  #stage { flex: 1; position: relative; background: #05060d; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* Territory bar: the whole match state in one line. Nine cells, one per screen, filling
     from each player's edge toward the middle as ground is taken. */
  #hud {
    display: flex; align-items: center; gap: 14px;
    padding: 10px 20px; border-bottom: 1px solid var(--line);
    background: rgba(5,6,13,.85);
  }
  .who {
    font-size: clamp(12px, 1.3vw, 17px); font-weight: 700;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 22vw;
  }
  .who .tag {
    font-family: var(--font-mono); font-size: 9px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--text-faint); display: block;
  }
  #territory { flex: 1; display: flex; gap: 3px; height: clamp(14px, 2.2vh, 22px); }
  .cell {
    flex: 1; border-radius: 2px; background: rgba(26,32,56,.75);
    border: 1px solid var(--line); transition: background .18s ease-out, box-shadow .18s;
  }
  .cell.a { background: var(--pa); border-color: var(--pa); box-shadow: 0 0 12px var(--pa); }
  .cell.b { background: var(--pb); border-color: var(--pb); box-shadow: 0 0 12px var(--pb); }
  .cell.active { outline: 1px solid rgba(234,242,255,.55); outline-offset: 1px; }

  #overlay {
    position: absolute; inset: 0; display: flex;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; text-align: center; background: rgba(5,6,13,.9); z-index: 5;
  }
  #overlay.hidden { display: none; }
  #overlay .big {
    font-size: clamp(30px, 6vw, 76px); font-weight: 700; line-height: 1;
    color: var(--glow); text-shadow: var(--bloom-glow);
  }
  #overlay .sub { color: var(--text-dim); font-size: clamp(13px, 1.6vw, 20px); max-width: 60ch; }
  #overlay .ring {
    width: 40px; height: 40px; border-radius: 50%;
    border: 2px solid rgba(53,240,224,.2); border-top-color: var(--glow);
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="hud">
  <div class="who" id="nameA"><span class="tag">Left</span><span id="labelA">—</span></div>
  <div id="territory"></div>
  <div class="who" id="nameB" style="text-align:right"><span class="tag">Right</span><span id="labelB">—</span></div>
</div>

<div id="stage">
  <canvas id="c"></canvas>
  <div id="overlay">
    <div class="ring"></div>
    <div class="sub">Waiting for two players…</div>
  </div>
</div>

<script src="/sdk.js"></script>
<script type="module">
import {
  createMatch, addPlayer, removePlayer, setInput, clearInput, press, setGuard,
  step, restart, assignSides, scheduleRespawns, swordBox,
  BODY_W, BODY_H, GUARD_Y, HIGH, MID, LOW,
} from "/games/nidhogg/sim.js?v=1";
import {
  SCREEN_W, SCREEN_H, GROUND_Y, MIN_SCREEN, MAX_SCREEN, SCREENS,
  screenLeft, buildSolids,
} from "/games/nidhogg/arena.js?v=1";

const freeconsole = new FreeConsole();

/* ------------------------------------------------------------ test harness */

// ?test=1 runs the whole game with no shell behind it: two keyboard fencers, so the sim can
// be reloaded on every edit without re-joining a room. Anything that touches the shell goes
// through safeCall, so a missing one is a no-op rather than a crash.
const TEST = new URLSearchParams(location.search).has("test");

function safeCall(fn, fallback) {
  try { return fn(); } catch (err) { return fallback; }
}
function nameOf(id) {
  return safeCall(() => freeconsole.getNickname(id), "Player " + id) || ("Player " + id);
}
function colorOf(id) {
  return safeCall(() => freeconsole.getPlayerColor(id), "#35f0e0") || "#35f0e0";
}
/** Room-wide clock. Never Date.now() — phones and the TV disagree by seconds. */
function now() {
  return safeCall(() => freeconsole.getServerTime(), Date.now());
}

/* -------------------------------------------------------------------- setup */

const match = createMatch();
const solids = buildSolids();

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const overlay = document.getElementById("overlay");
const territory = document.getElementById("territory");

/** One cell per playable screen, left to right. */
const cells = [];
for (let i = MIN_SCREEN; i <= MAX_SCREEN; i++) {
  const cell = document.createElement("div");
  cell.className = "cell";
  territory.appendChild(cell);
  cells.push(cell);
}

let cssW = 0, cssH = 0, scale = 1, offX = 0, offY = 0;

/** Height of the world band actually drawn, in world units. Set by resize(). */
let viewH = SCREEN_H;

function resize() {
  const rect = canvas.getBoundingClientRect();
  const dpr = Math.min(devicePixelRatio || 1, 2);
  cssW = rect.width;
  cssH = rect.height;
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // Letterbox one screen's worth of world into the canvas. The camera never zooms, so the
  // scale is fixed by the viewport and nothing else.
  //
  // The fit is computed against VIEW_H rather than the full SCREEN_H: everything below the
  // ground line is solid fill, so fitting the whole band wastes a third of a wide display on
  // dirt and leaves the fencers small and high. Framing to just below the floor fills the
  // screen with the part that is actually played on.
  viewH = GROUND_Y + 70;
  scale = Math.min(cssW / SCREEN_W, cssH / viewH);
  offX = (cssW - SCREEN_W * scale) / 2;
  offY = (cssH - viewH * scale) / 2;
}
addEventListener("resize", resize);

/* ------------------------------------------------------------------- roster */

function sideOf(deviceId) {
  const p = match.players.get(deviceId);
  return p ? p.side : 0;
}

function joinPlayer(deviceId) {
  // Already seated: a reconnect or a duplicate onConnect. Keep the seat, but drop anything
  // the old session left held — a stale key is what makes a player refuse to move.
  if (match.players.has(deviceId)) {
    clearInput(match, deviceId);
    return;
  }
  if (match.players.size >= 2) return;   // 1v1 only (spec 33)

  addPlayer(match, deviceId, match.players.size === 0 ? 0 : 1);
  assignSides(match);
  renderHud();
  maybeStart();
  broadcastPhase();
}

function leavePlayer(deviceId) {
  if (!match.players.has(deviceId)) return;
  removePlayer(match, deviceId);
  if (match.players.size < 2 && match.phase === "fight") {
    match.phase = "waiting";
    showOverlay("Waiting for two players…", null);
  }
  assignSides(match);
  renderHud();
  broadcastPhase();
}

function maybeStart() {
  if (match.players.size < 2) {
    showOverlay("Waiting for two players…", null);
    return;
  }
  if (match.phase === "fight") return;
  safeCall(() => freeconsole.setActivePlayers(2));
  restart(match);
  showOverlay(null);
  broadcastPhase();
}

/* ---------------------------------------------------------------- shell wiring */

freeconsole.onReady = function () {
  safeCall(() => freeconsole.setActivePlayers(2));
  for (const id of safeCall(() => freeconsole.getControllerDeviceIds(), []) || []) joinPlayer(id);
  renderHud();
};

freeconsole.onConnect = joinPlayer;
freeconsole.onDisconnect = leavePlayer;

/**
 * Controllers send intent only — held directions, one-shot actions, and a guard height.
 * Nothing here trusts a phone with position or with a kill.
 */
freeconsole.onMessage = function (deviceId, data) {
  if (!data || !match.players.has(deviceId)) return;

  if (data.t === "hold") {
    setInput(match, deviceId, data.k, data.v);
    return;
  }
  if (data.t === "press") {
    press(match, deviceId, data.k);
    return;
  }
  if (data.t === "guard") {
    setGuard(match, deviceId, data.g);
    return;
  }
  if (data.t === "restart" && match.phase === "over") {
    maybeStart();
  }
};

/**
 * Phase and score go out on change, not per frame (spec: never stream). Controllers only need
 * to know whether they are fighting, which side they are, and whether they still hold a sword.
 */
let lastPhaseKey = "";
function broadcastPhase() {
  const ids = [...match.players.keys()].sort((a, b) => a - b);
  const armed = {};
  const dead = {};
  for (const [id, p] of match.players) { armed[id] = p.armed; dead[id] = p.dead; }

  const key = JSON.stringify([match.phase, match.winner, match.screen, armed, dead, ids]);
  if (key === lastPhaseKey) return;
  lastPhaseKey = key;

  safeCall(() => freeconsole.broadcast({
    phase: match.phase,
    winner: match.winner,
    screen: match.screen,
    armed,
    dead,
    sides: Object.fromEntries([...match.players].map(([id, p]) => [id, p.side])),
  }));
}

/* ---------------------------------------------------------------------- hud */

function renderHud() {
  const ids = [...match.players.keys()].sort((a, b) => a - b);
  const a = ids.find((id) => sideOf(id) === 0);
  const b = ids.find((id) => sideOf(id) === 1);

  document.getElementById("labelA").textContent = a === undefined ? "—" : nameOf(a);
  document.getElementById("labelB").textContent = b === undefined ? "—" : nameOf(b);

  const ca = a === undefined ? "#35f0e0" : colorOf(a);
  const cb = b === undefined ? "#ff2e88" : colorOf(b);
  document.documentElement.style.setProperty("--pa", ca);
  document.documentElement.style.setProperty("--pb", cb);
  document.getElementById("labelA").style.color = ca;
  document.getElementById("labelB").style.color = cb;
}

/**
 * The territory bar mirrors the active screen: every cell from the left edge up to the
 * current screen belongs to the left player, and the mirror for the right.
 */
function renderTerritory() {
  const active = match.screen;
  cells.forEach((cell, i) => {
    const index = MIN_SCREEN + i;
    cell.classList.toggle("a", index < active);
    cell.classList.toggle("b", index > active);
    cell.classList.toggle("active", index === active);
  });
}

function showOverlay(big, sub) {
  if (big === null) { overlay.classList.add("hidden"); return; }
  overlay.classList.remove("hidden");
  overlay.innerHTML = sub === null
    ? '<div class="ring"></div><div class="sub">' + big + "</div>"
    : '<div class="big">' + big + '</div><div class="sub">' + (sub || "") + "</div>";
}

/* ------------------------------------------------------------------- effects */

// Short-lived sparks and flashes, drawn in world space and aged out by the frame loop. Purely
// cosmetic — the sim never reads them back.
const fx = [];

function addFx(type, x, y, color) {
  fx.push({ type, x, y, color: color || "#eaf2ff", life: 1 });
}

function drainEvents() {
  for (const e of match.events) {
    if (e.type === "clash" || e.type === "scrape") addFx("spark", e.x, e.y, "#ffc247");
    else if (e.type === "disarm") addFx("burst", e.x + BODY_W / 2, e.y + 20, "#ffc247");
    else if (e.type === "death") addFx("blood", e.x + BODY_W / 2, e.y + BODY_H / 2, "#ff2e88");
    else if (e.type === "divehit" || e.type === "kick" || e.type === "punch") addFx("burst", e.x, e.y, "#eaf2ff");
    else if (e.type === "advance") { flashScreen = 1; renderTerritory(); }
    else if (e.type === "win") {
      const name = nameOf(e.id);
      showOverlay(name + " wins", "Devoured by Nidhogg. Press any button to fight again.");
      safeCall(() => freeconsole.setActivePlayers(0));
    }
    else if (e.type === "start") renderTerritory();
  }
  match.events.length = 0;
}

let flashScreen = 0;

/* ------------------------------------------------------------------- drawing */

/** World -> canvas. The camera x is the left edge of the visible screen. */
function tx(x) { return offX + (x - match.cameraX) * scale; }
function ty(y) { return offY + y * scale; }

function draw() {
  ctx.clearRect(0, 0, cssW, cssH);

  // Backdrop. A cold sky over the active screen, with the letterbox left black so the
  // playfield edge is unambiguous on a TV.
  const g = ctx.createLinearGradient(0, offY, 0, offY + viewH * scale);
  g.addColorStop(0, "#0a0c18");
  g.addColorStop(0.7, "#101425");
  g.addColorStop(1, "#161b30");
  ctx.fillStyle = g;
  ctx.fillRect(offX, offY, SCREEN_W * scale, viewH * scale);

  drawParallax();
  drawSolids();
  drawSwords();
  for (const p of match.players.values()) drawPlayer(p);
  drawFx();
  drawGoalMarkers();

  // A white wash on the frame territory changes hands, so the advance is impossible to miss.
  if (flashScreen > 0) {
    ctx.fillStyle = "rgba(234,242,255," + (flashScreen * 0.22).toFixed(3) + ")";
    ctx.fillRect(offX, offY, SCREEN_W * scale, viewH * scale);
  }
}

/** Distant bands that shift with the camera, so a screen change reads as travel. */
function drawParallax() {
  ctx.save();
  ctx.beginPath();
  ctx.rect(offX, offY, SCREEN_W * scale, viewH * scale);
  ctx.clip();

  // Distant towers, all standing *on* the ground line and rising into the sky. Bands that
  // float at platform height instead read as level geometry the player can land on, which is
  // exactly the wrong cue on a game where every surface matters.
  const depth = [
    { k: 0.12, top: 176, c: "#111830", w: 150, period: 300 },
    { k: 0.26, top: 248, c: "#16203c", w: 108, period: 214 },
  ];
  for (const layer of depth) {
    ctx.fillStyle = layer.c;
    const shift = -(match.cameraX * layer.k) % layer.period;
    for (let x = shift - layer.period; x < SCREEN_W + layer.period; x += layer.period) {
      ctx.fillRect(offX + x * scale, ty(layer.top), layer.w * scale, (GROUND_Y - layer.top) * scale);
    }
  }

  // Horizon haze where the towers meet the floor, so the backdrop settles behind the arena.
  const haze = ctx.createLinearGradient(0, ty(GROUND_Y - 120), 0, ty(GROUND_Y));
  haze.addColorStop(0, "rgba(16,20,37,0)");
  haze.addColorStop(1, "rgba(16,20,37,.85)");
  ctx.fillStyle = haze;
  ctx.fillRect(offX, ty(GROUND_Y - 120), SCREEN_W * scale, 120 * scale);
  ctx.restore();
}

function drawSolids() {
  const left = match.cameraX - 80;
  const right = match.cameraX + SCREEN_W + 80;
  for (const s of solids) {
    if (s.x > right || s.x + s.w < left) continue;

    // Ground fill sits below the floor line and is deliberately dark and inert; raised
    // platforms are lighter, so a ledge you can land on never reads as bulk terrain.
    const isGround = s.y >= GROUND_Y;
    ctx.fillStyle = isGround ? "#0c1020" : "#232c4a";
    ctx.fillRect(tx(s.x), ty(s.y), s.w * scale, s.h * scale);

    // A bright top edge is the only lighting cue, and it makes landable surfaces obvious.
    // It has to out-contrast the backdrop towers, or a ledge you can stand on looks the same
    // as scenery you cannot.
    ctx.fillStyle = "rgba(53,240,224,.55)";
    ctx.fillRect(tx(s.x), ty(s.y), s.w * scale, Math.max(2, 3 * scale));
  }
}

function drawSwords() {
  for (const s of match.swords) {
    ctx.save();
    ctx.translate(tx(s.x), ty(s.y));
    ctx.rotate(s.angle);
    ctx.fillStyle = s.live ? "#ffc247" : "#8492b8";
    if (s.live) { ctx.shadowColor = "#ffc247"; ctx.shadowBlur = 14 * scale; }
    ctx.fillRect(-22 * scale, -2 * scale, 44 * scale, 4 * scale);
    ctx.fillStyle = "#56628a";
    ctx.fillRect(-24 * scale, -5 * scale, 5 * scale, 10 * scale);
    ctx.restore();
  }
}

/**
 * Pose solver.
 *
 * Returns joint positions in world units for one player: a stick figure with a neck, an
 * elbow in each arm and a knee in each leg. It is a pure function of what the sim already
 * decided - state, gait phase, facing, body height, guard - so it holds no state of its own
 * and two screens rendering the same match would draw the same frame.
 *
 * Everything is expressed as a fraction of `p.height`, which is what makes ducking and
 * crawling work without a second set of numbers: the skeleton compresses with the hurtbox
 * it lives inside, so the drawing never disagrees with the box that gets hit.
 */
function poseOf(p) {
  const f = p.facing;
  const h = p.height;
  const cx = p.x + BODY_W / 2;

  // Vertical anchors. The hip rides at 52% of the body, which leaves legs slightly longer
  // than the torso - the proportion that reads as "person" fastest at TV distance.
  const headR = h * 0.16;
  const neckY = p.y + h * 0.20;
  const hipY = p.y + h * 0.52;
  const thigh = (p.y + h - hipY) * 0.52;
  const shin = (p.y + h - hipY) * 0.48;
  const upperArm = h * 0.20;
  const foreArm = h * 0.19;

  // Gait: one leg leads while the other trails, half a cycle apart. Knees only ever bend
  // backwards, which is the detail that stops a walk cycle looking like an insect.
  const g = p.gait;
  const swing = Math.sin(g);
  const swing2 = Math.sin(g + Math.PI);
  const airborne = !p.onGround;
  const st = p.state;

  /**
   * Progress through the current committed action, 0 at the first frame and 1 at the last.
   * `timerMax` is recorded by the sim because the same action runs at different lengths
   * depending on how it was entered, so there is no constant here to divide by.
   */
  const t = p.timerMax > 0 ? Math.min(1, Math.max(0, 1 - p.timer / p.timerMax)) : 0;

  /**
   * Strike curve: snap out, hold near full extension, then withdraw a little more slowly.
   * The fast leading edge is what makes an attack read as a strike rather than a stretch,
   * and the hold is what makes the active frames legible to the person being attacked.
   */
  function strike(out, hold, back) {
    if (t < out) return ease(t / out);
    if (t < hold) return 1;
    return 1 - ease((t - hold) / Math.max(1e-4, back - hold)) * 0.85;
  }
  /** Smoothstep. Cheap, and the only easing this needs. */
  function ease(u) { const c = Math.min(1, Math.max(0, u)); return c * c * (3 - 2 * c); }
  /** Anticipation: dip backwards before committing forwards. */
  function windup(depth, until) { return t < until ? -depth * Math.sin((t / until) * Math.PI) : 0; }

  // Stride amplitude scales with speed so a walk is a shuffle and a run is a stride.
  let amp = Math.min(1, Math.abs(p.vx) / 300);
  let lean = 0;          // torso pitch, radians, positive leans forward
  let crouch = 0;        // extra hip drop as a fraction of thigh length
  let armFwd = 0.55;     // how far the sword arm reaches ahead, 0..1
  let offArm = -0.25;    // trailing arm, negative swings it behind
  let kick = 0;          // 0..1 extension of the kicking leg
  let spin = 0;          // whole-body rotation, radians, for the roll

  if (st === "run") { lean = 0.22; armFwd = 0.5; }
  else if (st === "walk") { lean = 0.10; }
  else if (st === "duck") { crouch = 0.55; lean = 0.30; amp = 0; }
  else if (st === "crawl") { crouch = 0.8; lean = 0.55; amp = Math.min(1, Math.abs(p.vx) / 90) * 0.5; }
  else if (st === "lunge") {
    // The signature move, so it gets the most anticipation: a visible coil, then everything
    // extends at once - front leg, torso and blade - and stays extended for the active frames.
    const e = strike(0.35, 0.75, 1);
    const w = windup(0.5, 0.35);
    lean = 0.15 + e * 0.42 + w * 0.5;
    armFwd = 0.55 + e * 0.9 + w * 0.55;
    offArm = -0.25 - e * 0.5;
    crouch = e * 0.28;
    amp = 0;
  } else if (st === "thrust" || st === "airstab") {
    const e = strike(0.3, 0.62, 1);
    lean = 0.1 + e * 0.16 + windup(0.35, 0.3) * 0.3;
    armFwd = 0.55 + e * 0.68 + windup(0.35, 0.3);
    offArm = -0.25 - e * 0.2;
    amp = 0;
  } else if (st === "punch") {
    const e = strike(0.28, 0.55, 1);
    lean = 0.08 + e * 0.16;
    armFwd = 0.35 + e * 0.85 + windup(0.4, 0.28);
    offArm = -0.2 - e * 0.35;
    amp = 0;
  } else if (st === "kick") {
    // The leg leads and the torso counter-rotates away, which is what sells the weight.
    kick = strike(0.32, 0.6, 1);
    lean = 0.05 - kick * 0.3;
    armFwd = 0.5 - kick * 0.2;
    offArm = -0.2 - kick * 0.3;
    amp = 0;
  } else if (st === "divekick") {
    // Already committed and falling: a quick chamber-and-extend over the first third of the
    // dive, then held out for the rest of the descent. Fast, but it still has to unfold -
    // a leg that is simply already extended reads as a pose, not a kick.
    kick = ease(Math.min(1, t * 3));
    lean = -0.1 - kick * 0.15;
    armFwd = 0.35;
    amp = 0;
  } else if (st === "throw") {
    // The arm is already empty by the time this state exists, so this is pure follow-through.
    const e = strike(0.25, 0.5, 1);
    lean = 0.05 + e * 0.2;
    armFwd = 0.5 + e * 0.85;
    offArm = -0.2 - e * 0.45;
    amp = 0;
  } else if (st === "roll") {
    // A full tuck that rotates once through the roll and lands back upright.
    spin = f * ease(t) * Math.PI * 2;
    crouch = 0.9;
    lean = 0.9;
    armFwd = 0.15;
    offArm = 0.1;
    amp = 0;
  } else if (st === "recover") {
    // Unwind from the strike back to a stance, so recovery is visible as a real pose and
    // not an instant snap - this is the punish window, and it should look like one.
    const u = 1 - ease(t);
    lean = 0.28 * u;
    armFwd = 0.55 + 0.5 * u;
    crouch = 0.18 * u;
    amp = 0;
  } else if (st === "land") {
    // A short absorb on touchdown, which also covers the landing recovery frames.
    crouch = (1 - ease(t)) * 0.4;
    lean = 0.12;
    amp = 0;
  } else if (st === "knockdown") {
    // Fall flat quickly, lie there, then start gathering up as the timer runs out.
    const down = ease(Math.min(1, t * 3.2));
    const rise = t > 0.75 ? ease((t - 0.75) / 0.25) : 0;
    lean = (1.35 * down) * (1 - rise * 0.45);
    crouch = (0.95 * down) * (1 - rise * 0.3);
    armFwd = 0.2;
    offArm = 0.3;
    amp = 0;
  } else if (st === "dead") { lean = 1.35; crouch = 0.95; amp = 0; }
  else if (st === "wallslide" || st === "wallclimb") { lean = -0.1; amp = 0; }

  const hy = hipY + thigh * crouch;
  const hx = cx - f * Math.sin(lean) * (hy - neckY) * 0.25;

  // Shoulders sit at the top of the torso, which pitches with `lean`.
  const torsoLen = hy - neckY;
  const sx = hx + f * Math.sin(lean) * torsoLen;
  const sy = neckY;
  const headX = sx + f * Math.sin(lean) * headR * 0.6;
  const headY = sy - headR * 0.9;

  /** Two-segment limb: place the joint by bending a fixed amount toward `bendDir`. */
  function limb(ox, oy, ang, l1, l2, bend) {
    const jx = ox + Math.sin(ang) * l1;
    const jy = oy + Math.cos(ang) * l1;
    const a2 = ang + bend;
    return { jx, jy, ex: jx + Math.sin(a2) * l2, ey: jy + Math.cos(a2) * l2 };
  }

  // --- legs ---------------------------------------------------------------
  // Angle 0 points straight down; positive swings the foot toward `facing`.
  let legA, legB;
  if (airborne && st !== "wallslide" && st !== "wallclimb") {
    // Tuck the leading knee and trail the other - a jump silhouette, not a stride.
    const tuck = p.vy < 0 ? 0.9 : 0.5;
    legA = limb(hx, hy, f * 0.5, thigh, shin, -f * tuck);
    legB = limb(hx, hy, -f * 0.35, thigh, shin, -f * 0.35);
  } else if (st === "kick" || st === "divekick") {
    // Chambered knee first, then the shin snaps out - a kick that unfolds instead of
    // appearing already extended.
    const chamber = -f * (0.9 - kick * 0.78);
    legA = limb(hx, hy, f * (0.35 + kick * 1.15), thigh, shin, chamber);
    legB = limb(hx, hy, -f * (0.2 + kick * 0.15), thigh, shin, -f * 0.5);
  } else if (st === "lunge") {
    // Front leg drives out along the lunge while the back leg straightens into the push.
    const ext = (armFwd - 0.55) / 0.9;
    legA = limb(hx, hy, f * (0.15 + ext * 0.95), thigh, shin, -f * Math.max(0.08, 0.5 - ext * 0.42));
    legB = limb(hx, hy, -f * (0.15 + ext * 0.5), thigh, shin, -f * 0.12);
  } else {
    const a1 = f * swing * 0.75 * amp;
    const a2 = f * swing2 * 0.75 * amp;
    // The knee bends most as the leg passes under the body and straightens at full stride.
    const k1 = -f * (0.25 + Math.max(0, -swing) * 0.85) * Math.max(amp, 0.18);
    const k2 = -f * (0.25 + Math.max(0, -swing2) * 0.85) * Math.max(amp, 0.18);
    legA = limb(hx, hy, a1 + f * crouch * 0.6, thigh, shin, k1 - f * crouch * 1.3);
    legB = limb(hx, hy, a2 + f * crouch * 0.6, thigh, shin, k2 - f * crouch * 1.3);
  }

  // --- arms ---------------------------------------------------------------
  // The sword arm points at the guard height the sim is actually using, so the drawing and
  // the hitbox agree: the hand ends up where `swordBox` starts the blade.
  const bladeY = p.y + GUARD_Y[p.guard];
  const reachY = bladeY - sy;
  const reachX = f * BODY_W * 0.5 * armFwd + f * upperArm * armFwd;
  const swordAng = Math.atan2(reachX, reachY);
  const armSwing = f * swing2 * 0.5 * amp * (armFwd > 0.9 ? 0 : 1);

  const armMain = limb(sx, sy, swordAng + armSwing * 0.35, upperArm, foreArm,
                       -f * Math.max(0, 0.55 - armFwd * 0.5));
  const armOff = limb(sx, sy, f * (offArm - swing * 0.55 * amp) + Math.PI * 0.02,
                      upperArm, foreArm, f * 0.5);

  const pose = { headX, headY, headR, sx, sy, hx, hy, legA, legB, armMain, armOff };

  // A roll is the one move where the whole body leaves upright, so it is applied as a
  // rotation of the finished skeleton about the body's centre rather than as joint angles.
  if (spin !== 0) rotatePose(pose, cx, p.y + h / 2, spin);
  return pose;
}

/** Rotate every joint in a solved pose about a pivot. Used only by the roll. */
function rotatePose(q, px, py, ang) {
  const cos = Math.cos(ang), sin = Math.sin(ang);
  const rot = (x, y) => {
    const dx = x - px, dy = y - py;
    return [px + dx * cos - dy * sin, py + dx * sin + dy * cos];
  };
  [q.headX, q.headY] = rot(q.headX, q.headY);
  [q.sx, q.sy] = rot(q.sx, q.sy);
  [q.hx, q.hy] = rot(q.hx, q.hy);
  for (const l of [q.legA, q.legB, q.armMain, q.armOff]) {
    [l.jx, l.jy] = rot(l.jx, l.jy);
    [l.ex, l.ey] = rot(l.ex, l.ey);
  }
}

/**
 * Players are flat silhouettes in their platform colour: no shading, no blending, a handful
 * of poses (spec 28). Readability at TV distance beats detail, so the pose changes shape
 * rather than adding lines - the figure is jointed, but it stays a solid single-colour
 * silhouette with no interior detail to squint at.
 */
function drawPlayer(p) {
  const color = colorOf(p.id);
  const x = tx(p.x);

  if (p.dead) {
    // A body on the floor, flat and dim, until the respawn takes it away.
    ctx.fillStyle = "rgba(255,46,136,.45)";
    ctx.fillRect(x - 8 * scale, ty(p.y + p.height - 10), (BODY_W + 16) * scale, 10 * scale);
    return;
  }

  const q = poseOf(p);

  ctx.save();
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.shadowColor = color;
  ctx.shadowBlur = 16 * scale;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  // Limbs are thinner than the torso so the body still reads as the mass that gets hit.
  const limbW = Math.max(2, BODY_W * 0.30 * scale);
  const torsoW = Math.max(3, BODY_W * 0.52 * scale);

  function bone(a, ox, oy) {
    ctx.beginPath();
    ctx.moveTo(tx(ox), ty(oy));
    ctx.lineTo(tx(a.jx), ty(a.jy));
    ctx.lineTo(tx(a.ex), ty(a.ey));
    ctx.stroke();
  }

  // Far-side limbs first, dimmed, so the figure has a front and a back at a glance.
  ctx.globalAlpha = 0.55;
  ctx.lineWidth = limbW;
  bone(q.legB, q.hx, q.hy);
  bone(q.armOff, q.sx, q.sy);
  ctx.globalAlpha = 1;

  // Torso.
  ctx.lineWidth = torsoW;
  ctx.beginPath();
  ctx.moveTo(tx(q.sx), ty(q.sy));
  ctx.lineTo(tx(q.hx), ty(q.hy));
  ctx.stroke();

  // Near-side limbs.
  ctx.lineWidth = limbW;
  bone(q.legA, q.hx, q.hy);
  bone(q.armMain, q.sx, q.sy);

  // Head.
  ctx.beginPath();
  ctx.arc(tx(q.headX), ty(q.headY), q.headR * scale, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Guard indicator: a bar in front of the chest at the sword's height, so the opponent can
  // read the guard even when the blade itself is off-screen behind a body.
  if (p.armed) {
    const s = swordBox(p);
    if (s) {
      ctx.save();
      ctx.fillStyle = "#eaf2ff";
      ctx.shadowColor = "#eaf2ff";
      ctx.shadowBlur = 12 * scale;
      ctx.fillRect(tx(s.x), ty(s.y), s.w * scale, s.h * scale);
      ctx.restore();
    }
  } else {
    // Unarmed: a hollow ring above the head, the one piece of state that changes how you play.
    ctx.strokeStyle = "rgba(234,242,255,.5)";
    ctx.lineWidth = Math.max(1, 2 * scale);
    ctx.beginPath();
    ctx.arc(tx(q.headX), ty(q.headY - q.headR) - 12 * scale, 5 * scale, 0, Math.PI * 2);
    ctx.stroke();
  }
}

function drawFx() {
  for (const f of fx) {
    const a = f.life;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = f.color;
    ctx.shadowColor = f.color;
    ctx.shadowBlur = 18 * scale;
    const r = (f.type === "blood" ? 26 : 12) * (1.3 - a) * scale;
    ctx.beginPath();
    ctx.arc(tx(f.x), ty(f.y), Math.max(1, r), 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

/** The goal line, drawn only when the camera is on the screen that contains it. */
function drawGoalMarkers() {
  if (match.screen === MAX_SCREEN) {
    const x = tx(screenLeft(MAX_SCREEN) + SCREEN_W - 6);
    ctx.fillStyle = "var(--pa)";
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--pa") || "#35f0e0";
    ctx.globalAlpha = 0.5;
    ctx.fillRect(x, offY, 6 * scale, viewH * scale);
    ctx.globalAlpha = 1;
  }
  if (match.screen === MIN_SCREEN) {
    const x = tx(screenLeft(MIN_SCREEN));
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--pb") || "#ff2e88";
    ctx.globalAlpha = 0.5;
    ctx.fillRect(x, offY, 6 * scale, viewH * scale);
    ctx.globalAlpha = 1;
  }
}

/* --------------------------------------------------------------------- loop */

let last = 0;

function frame(ts) {
  requestAnimationFrame(frame);
  if (!last) { last = ts; resize(); }

  // Clamp dt so a backgrounded tab does not teleport anyone through a wall on return.
  const dt = Math.min(0.05, (ts - last) / 1000);
  last = ts;

  step(match, dt, now());
  scheduleRespawns(match, now());
  drainEvents();

  for (const f of fx) f.life -= dt * 2.4;
  for (let i = fx.length - 1; i >= 0; i--) if (fx[i].life <= 0) fx.splice(i, 1);
  if (flashScreen > 0) flashScreen = Math.max(0, flashScreen - dt * 3.5);

  draw();
  broadcastPhase();
}

resize();
requestAnimationFrame(frame);
renderHud();
renderTerritory();

/* --------------------------------------------------------------- test mode */

if (TEST) {
  // Two local fencers. Left: WASD + F attack, G kick, T throw, R roll, 1/2/3 guard.
  // Right: arrows + . attack, / kick, , throw, ; roll, 7/8/9 guard.
  addPlayer(match, 1, 0);
  addPlayer(match, 2, 1);
  renderHud();
  restart(match);
  showOverlay(null);

  // Expose the live match so a driver script can assert on it. Test mode only, so the shipped
  // game keeps nothing on the global.
  window.__match = match;

  const holds = {
    KeyA: [1, "left"], KeyD: [1, "right"], KeyW: [1, "up"], KeyS: [1, "down"],
    ShiftLeft: [1, "run"],
    ArrowLeft: [2, "left"], ArrowRight: [2, "right"], ArrowUp: [2, "up"], ArrowDown: [2, "down"],
    ShiftRight: [2, "run"],
  };
  const presses = {
    KeyW: [1, "jump"], KeyF: [1, "attack"], KeyG: [1, "kick"], KeyT: [1, "throw"], KeyR: [1, "roll"],
    ArrowUp: [2, "jump"], Period: [2, "attack"], Slash: [2, "kick"], Comma: [2, "throw"], Semicolon: [2, "roll"],
  };
  const guards = {
    Digit1: [1, HIGH], Digit2: [1, MID], Digit3: [1, LOW],
    Digit7: [2, HIGH], Digit8: [2, MID], Digit9: [2, LOW],
  };

  addEventListener("keydown", (e) => {
    if (e.repeat) return;
    if (holds[e.code]) { const [id, k] = holds[e.code]; setInput(match, id, k, true); }
    if (presses[e.code]) { const [id, k] = presses[e.code]; press(match, id, k); }
    if (guards[e.code]) { const [id, g] = guards[e.code]; setGuard(match, id, g); }
    if (e.code === "Enter") { restart(match); showOverlay(null); }
    if (holds[e.code] || presses[e.code]) e.preventDefault();
  });
  addEventListener("keyup", (e) => {
    if (holds[e.code]) { const [id, k] = holds[e.code]; setInput(match, id, k, false); }
  });
}
</script>
