<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Neon Pong — Controller</title>
<link rel="stylesheet" href="/console.css" />
<style>
  * { -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { height: 100%; overflow: hidden; }
  /* Every edge is inset, not just the top and bottom. The pad deliberately fills all the
     space left over, so on a notched phone held in landscape — which is how you end up
     holding it the moment the game gets tense — a flat side padding would run the touch
     surface under the notch and the home indicator. The horizontal insets are zero on a
     phone without them, so this costs nothing on ordinary hardware. */
  body {
    display: flex; flex-direction: column;
    touch-action: none; overscroll-behavior: none;
    padding:
      max(6px, env(safe-area-inset-top))
      max(8px, env(safe-area-inset-right))
      max(8px, env(safe-area-inset-bottom))
      max(8px, env(safe-area-inset-left));
    gap: 8px;
  }

  /* The lives pips sit at the right end of this row, which is exactly where the shell pins
     its master-only "♛ Game list" pill (#exitGame in src/pages/play.astro). On the one phone
     that has the pill it covered them, so the row reserves the pill's width. The reservation
     is balanced on the left so the status text stays optically centred rather than being
     shoved off-axis by a gutter only one side has. */
  .status {
    text-align: center; color: var(--text-dim); font-size: 12px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    min-height: 18px;
    padding: 0 var(--exit-gutter, 142px);
  }
  /* Below the pill's own width there is no room to reserve anything: the gutter would eat the
     entire row and clip the seat chip. A narrow phone drops it and lets the pill overlap the
     pips, which is the lesser failure — the lives are also on the TV. */
  @media (max-width: 380px) { .status { padding: 0; } }
  .status .seat {
    font-family: var(--font-mono); font-size: 10px; letter-spacing: .12em;
    text-transform: uppercase; padding: 2px 8px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--text-faint);
  }
  .status .seat.on { color: var(--me, var(--glow)); border-color: var(--me, var(--glow)); }

  /* Lives, mirrored from the screen. The one piece of match state worth carrying on the phone:
     you look down at your thumb far more than you look up at the TV. */
  .lives { display: flex; gap: 5px; }
  .lives .pip {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--me, var(--glow)); box-shadow: 0 0 8px var(--me, var(--glow));
  }
  .lives .pip.spent { background: rgba(120,160,220,.2); box-shadow: none; }

  /* The whole remaining area is the pad. There is nothing to aim at: put a thumb down
     anywhere and slide. Looking at the phone to find a button is looking away from the ball. */
  #pad {
    flex: 1; position: relative; border-radius: 18px;
    border: 1px solid var(--line); background: rgba(10,12,24,.55);
    overflow: hidden; touch-action: none; min-height: 0;
  }
  #pad.locked { opacity: .35; pointer-events: none; }

  /* The rail shows the direction the paddle actually slides, rotated inline by JS to match
     whatever angle the polygon put this player's side at. On an octagon that is often a
     diagonal, and sliding the way the wall runs is only obvious if the control looks like the
     thing it drives. The transition makes a mid-match reshape read as the rail turning. */
  #rail {
    position: absolute; left: 50%; top: 50%;
    width: 74%; height: 10px; margin: -5px 0 0 -37%;
    border-radius: 999px; background: rgba(120,160,220,.12);
    transition: transform .25s ease-out;
  }

  #knob {
    position: absolute; left: 50%; top: 50%;
    width: 74px; height: 74px; margin: -37px 0 0 -37px;
    border-radius: 50%; pointer-events: none;
    background: rgba(53,240,224,.16);
    border: 1px solid var(--me, var(--glow));
    box-shadow: 0 0 26px rgba(53,240,224,.3);
    will-change: transform;
  }
  #knob.hot { background: rgba(53,240,224,.3); }

  #hint {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--text-faint);
    text-align: center; line-height: 1.9; pointer-events: none;
    transition: opacity .15s;
  }
  #pad.active #hint { opacity: 0; }

  /* Fixed to the viewport, so it sits outside the body's padding and has to carry its own
     insets — otherwise the win/lose text centres against the physical screen and can land
     under a notch. The backdrop still covers edge to edge; only the content is inset. */
  #banner {
    position: fixed; inset: 0; z-index: 20;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; background: rgba(5,6,13,.94); text-align: center;
    padding:
      calc(24px + env(safe-area-inset-top))
      calc(24px + env(safe-area-inset-right))
      calc(24px + env(safe-area-inset-bottom))
      calc(24px + env(safe-area-inset-left));
  }
  #banner.show { display: flex; }
  #banner .big {
    font-size: clamp(26px, 9vw, 46px); font-weight: 700; line-height: 1.05;
    color: var(--glow); text-shadow: var(--bloom-glow);
  }
  #banner .sub { color: var(--text-dim); font-size: 14px; max-width: 32ch; }

  /* Graphics settings. Only the master controller gets the gear, because the setting belongs
     to the shared TV rather than to a player — one phone decides what the whole room sees. */
  #gear {
    width: 26px; height: 26px; flex-shrink: 0;
    border-radius: 8px; border: 1px solid var(--line);
    background: rgba(255,255,255,.06); color: var(--text-dim);
    font-size: 13px; line-height: 1; padding: 0;
    display: none; place-items: center;
  }
  #gear.show { display: grid; }
  #gear:active { background: rgba(255,255,255,.14); transform: scale(.93); }

  #settings {
    position: fixed; inset: 0; z-index: 30;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; background: rgba(5,6,13,.96); text-align: center;
    padding:
      calc(20px + env(safe-area-inset-top))
      calc(20px + env(safe-area-inset-right))
      calc(20px + env(safe-area-inset-bottom))
      calc(20px + env(safe-area-inset-left));
  }
  #settings.show { display: flex; }
  #settings h2 { font-size: 17px; }
  #settings .why { font-size: 12px; color: var(--text-faint); max-width: 34ch; line-height: 1.5; }

  /* Stacked rows: this controller is portrait, so three side-by-side cards would be too
     narrow to read the note under each name. */
  .set-list { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 340px; }
  .set-opt {
    border: 1px solid var(--line); border-radius: 14px;
    background: rgba(255,255,255,.05); color: var(--text);
    padding: 11px 14px; text-align: left;
    display: flex; flex-direction: column; gap: 3px;
    transition: border-color .15s, background .15s, transform .1s;
  }
  .set-opt.on { border-color: var(--line-bright); background: rgba(53,240,224,.14); }
  .set-opt:active { transform: scale(.97); }
  .set-name { font-size: 14px; font-weight: 700; }
  .set-note { font-size: 11px; color: var(--text-dim); line-height: 1.3; }
  #setResolved { margin: 0; font-size: 11px; color: var(--text-faint); min-height: 14px; }
</style>
</head>
<body>

<div class="status">
  <span class="seat" id="seat">—</span>
  <span id="status">Connecting…</span>
  <span class="lives" id="lives"></span>
  <button id="gear" aria-label="Graphics settings">⚙</button>
</div>

<div id="pad" class="locked">
  <div id="rail"></div>
  <div id="knob"></div>
  <div id="hint">Slide anywhere<br />to move your paddle</div>
</div>

<div id="banner">
  <div class="big" id="bannerBig">—</div>
  <div class="sub" id="bannerSub"></div>
</div>

<div id="settings">
  <h2>Graphics</h2>
  <p class="why">Lower this if the TV looks choppy. It changes how the game is drawn, never how it plays.</p>
  <div class="set-list" id="setList"></div>
  <p id="setResolved"></p>
  <button class="btn" id="setClose">Done</button>
</div>

<script src="/sdk.js"></script>
<script>
(function () {
  "use strict";

  var freeconsole = new FreeConsole();
  freeconsole.setOrientation("portrait");

  var pad = document.getElementById("pad");
  var rail = document.getElementById("rail");
  var knob = document.getElementById("knob");
  var statusEl = document.getElementById("status");
  var seatEl = document.getElementById("seat");
  var livesEl = document.getElementById("lives");
  var banner = document.getElementById("banner");

  var over = false;
  var mySide = null;      // which side of the polygon this phone defends
  var sideCount = 4;      // how many sides the arena currently has
  var sideWide = true;    // true while the arena is the wide 1-2 player rectangle
  var WALL_HP = 3;

  /**
   * The direction this player's side runs, as seen on the TV.
   *
   * Mirrors the sim's own geometry: a regular `n`-gon with side 0 facing left, flattened
   * vertically when the arena is the wide 1-2 player rectangle. Only the edge direction is
   * needed here — the phone maps a thumb slide onto it — so this is the short version of
   * `sideGeometry` rather than the whole thing.
   *
   * `WIDE_STRETCH` has to match the sim's constant exactly. On the rectangle the top and
   * bottom edges stay horizontal either way, but getting it wrong would still mis-aim the
   * knob and the rail, so it is kept identical rather than approximated.
   */
  var WIDE_STRETCH = 1.5;

  function sideDirection(n, index, wide) {
    var base = Math.PI - Math.PI / n;
    var a0 = base + (index * 2 * Math.PI) / n;
    var a1 = base + ((index + 1) * 2 * Math.PI) / n;
    var ry = wide ? 1 / WIDE_STRETCH : 1;
    var ex = Math.cos(a1) - Math.cos(a0);
    var ey = (Math.sin(a1) - Math.sin(a0)) * ry;
    var len = Math.hypot(ex, ey) || 1;
    return { x: ex / len, y: ey / len };
  }

  function sideLabel(n, index) {
    if (index === null || index === undefined || index < 0) return "—";
    if (n === 4) return ["Left", "Top", "Right", "Bottom"][index] || "Side " + (index + 1);
    return "Side " + (index + 1);
  }

  /* ------------------------------------------------------------ paddle input */

  /**
   * A floating slider: the origin is wherever the thumb lands, and deflection from there is
   * the paddle's velocity. Absolute positioning would be tempting, but the pad and the wall
   * are different lengths and the mapping breaks the moment a thumb starts near an edge.
   *
   * Only the deflection crosses the wire, and only when it changes by enough to matter — the
   * screen integrates it into a position itself.
   */
  var RANGE = 90;        // px of travel for full deflection
  var DEAD = 6;          // px of slack before the paddle moves at all
  var STEP = 0.04;       // smallest change worth a message

  var padId = null;      // pointerId that owns the pad, or null
  var originX = 0, originY = 0;
  var sent = 0;

  /**
   * The thumb axis that drives the paddle, in phone-screen coordinates.
   *
   * On a polygon a side can sit at any angle, so there is no "this seat is horizontal" rule
   * to follow. The honest mapping is to project the thumb's movement onto the direction the
   * player's own side runs *as drawn on the TV*: slide the way the wall goes and the paddle
   * follows. A player on a diagonal side of an octagon therefore slides diagonally, which is
   * exactly what they see in front of them.
   *
   * Falls back to a plain horizontal axis before the first state arrives, so an early touch
   * still does something sensible rather than nothing.
   */
  function axisOf() {
    if (mySide === null || mySide < 0) return { x: 1, y: 0 };
    return sideDirection(sideCount, mySide, sideWide);
  }

  function send(v) {
    // Snap tiny values to zero, so a resting thumb never leaves the paddle creeping.
    if (Math.abs(v) < 0.02) v = 0;
    if (Math.abs(v - sent) < STEP && !(v === 0 && sent !== 0)) return;
    sent = v;
    freeconsole.message(FreeConsole.SCREEN, { t: "move", v: v });
  }

  function padStart(e) {
    var r = pad.getBoundingClientRect();
    padId = e.pointerId;
    originX = e.clientX - r.left;
    originY = e.clientY - r.top;
    pad.classList.add("active");
    placeKnob(originX, originY, r);
    padMove(e);
  }

  function padMove(e) {
    var r = pad.getBoundingClientRect();
    var px = e.clientX - r.left;
    var py = e.clientY - r.top;
    var a = axisOf();

    // Signed distance travelled along the side's own direction. Movement perpendicular to it
    // is ignored, so a thumb that wanders off the line does not jitter the paddle.
    var delta = (px - originX) * a.x + (py - originY) * a.y;

    var mag = Math.abs(delta);
    var v = 0;
    if (mag > DEAD) {
      v = ((mag - DEAD) / (RANGE - DEAD)) * (delta < 0 ? -1 : 1);
      v = Math.max(-1, Math.min(1, v));
    }
    send(v);

    // The knob slides along that same direction, so the control visibly moves the way the
    // wall does rather than under the thumb in a direction that does nothing.
    var clamped = Math.max(-RANGE, Math.min(RANGE, delta));
    placeKnob(originX + a.x * clamped, originY + a.y * clamped, r);

    knob.classList.toggle("hot", Math.abs(v) > 0.85);
  }

  function placeKnob(x, y, r) {
    knob.style.transform = "translate(" + (x - r.width / 2) + "px," + (y - r.height / 2) + "px)";
  }

  function padEnd() {
    padId = null;
    pad.classList.remove("active");
    knob.classList.remove("hot");
    knob.style.transform = "translate(0px,0px)";
    send(0);
  }

  /**
   * Pointer routing lives on the document rather than on the pad, and nothing calls
   * setPointerCapture: on iOS capture retargets pointerup and the paddle sticks at full
   * deflection with the thumb already lifted. Tracking the pointerId by hand is what keeps a
   * release honest.
   */
  document.addEventListener("pointerdown", function (e) {
    if (over) { restart(); return; }
    if (pad.classList.contains("locked")) return;
    if (padId !== null || !pad.contains(e.target)) return;
    e.preventDefault();
    padStart(e);
  }, { passive: false });

  document.addEventListener("pointermove", function (e) {
    if (e.pointerId !== padId) return;
    e.preventDefault();
    padMove(e);
  }, { passive: false });

  function release(e) {
    if (e.pointerId !== padId) return;
    padEnd();
  }
  document.addEventListener("pointerup", release);
  document.addEventListener("pointercancel", release);

  // A backgrounded phone must not leave the paddle sliding into a corner on the TV.
  document.addEventListener("visibilitychange", function () {
    if (document.hidden && padId !== null) padEnd();
  });

  function restart() {
    over = false;
    banner.classList.remove("show");
    freeconsole.message(FreeConsole.SCREEN, { t: "restart" });
  }

  /* ------------------------------------------------------------------- paint */

  /** Damage colours, mirroring the sim so the phone and the wall never disagree. */
  var DAMAGE_COLORS = ["#9dff4f", "#ffc247", "#ff2e88"];

  /**
   * Your wall's health, in the same green/yellow/red the TV uses.
   *
   * This is the one piece of match state worth carrying on the phone: you look down at your
   * thumb far more than you look up at the arena, and "one hit left" is the thing you most
   * need to know without glancing away.
   */
  function renderHealth(hp, isOut) {
    livesEl.innerHTML = "";
    var color = isOut || hp <= 0
      ? null
      : DAMAGE_COLORS[Math.max(0, Math.min(DAMAGE_COLORS.length - 1, WALL_HP - hp))];
    for (var i = 0; i < WALL_HP; i++) {
      var pip = document.createElement("span");
      pip.className = "pip";
      if (i < hp && color) {
        pip.style.background = color;
        pip.style.boxShadow = "0 0 8px " + color;
      } else {
        pip.classList.add("spent");
      }
      livesEl.appendChild(pip);
    }
  }

  /**
   * Take a seat on the polygon.
   *
   * Both the side index and the side count matter: the same index means a different direction
   * on a pentagon than on an octagon, so the arena changing shape under you has to re-aim the
   * control even though your seat number never moved.
   */
  function applySeat(side, count, wide) {
    var n = count || sideCount;
    var w = !!wide;
    if (side === mySide && n === sideCount && w === sideWide) return;
    mySide = side;
    sideCount = n;
    sideWide = w;

    if (side === null || side === undefined || side < 0) {
      seatEl.textContent = "—";
      seatEl.classList.remove("on");
      return;
    }
    seatEl.textContent = sideLabel(n, side);
    seatEl.classList.add("on");

    // Point the rail along the player's own side, so the control on the phone visibly matches
    // the wall on the TV at whatever angle the polygon put it.
    var d = sideDirection(n, side, w);
    rail.style.transform = "rotate(" + Math.atan2(d.y, d.x).toFixed(4) + "rad)";

    // A seat or shape change mid-round would otherwise leave the last deflection applied to a
    // new direction, which sends the paddle off somewhere nobody asked for.
    send(0);
  }

  /* -------------------------------------------------------- graphics settings */

  /**
   * Call an SDK method that may not be ready yet.
   *
   * The settings panel is built from SDK state (who the master is, this device's id) that is
   * unavailable before the shell connects, and a throw there would take the whole controller
   * down — including the paddle, which has nothing to do with graphics.
   */
  function safeCall(fn, fallback) {
    try { return fn(); } catch (err) { return fallback; }
  }

  /**
   * What the screen last told us about its own rendering.
   *
   * The phone holds no opinion about what the tiers are — it renders whatever list the screen
   * sends. One definition of the tiers (quality.js, on the screen), and a phone on a stale
   * cached page cannot offer a setting the screen no longer understands.
   */
  var quality = { choice: null, tier: null, tiers: [] };

  var gearEl = document.getElementById("gear");
  var settingsEl = document.getElementById("settings");
  var setListEl = document.getElementById("setList");
  var setResolvedEl = document.getElementById("setResolved");

  /**
   * Whether this phone is the room's admin.
   *
   * Derived from the SDK rather than stored, so it follows the master controller: if that
   * phone leaves, the next one simply IS the master and its gear appears with no handover.
   */
  function isMaster() {
    var me = safeCall(function () { return freeconsole.getDeviceId(); }, -1);
    var master = safeCall(function () { return freeconsole.getMasterControllerDeviceId(); }, undefined);
    return master !== undefined && me === master;
  }

  function renderSettings() {
    // The gear is only meaningful for the admin, and only once the screen has said what the
    // options are — showing it earlier would open an empty sheet.
    var show = isMaster() && quality.tiers.length > 0;
    gearEl.classList.toggle("show", show);
    if (!show) {
      settingsEl.classList.remove("show");
      return;
    }

    setListEl.replaceChildren();
    quality.tiers.forEach(function (tier) {
      var btn = document.createElement("button");
      btn.className = "set-opt" + (tier.value === quality.choice ? " on" : "");
      var name = document.createElement("span");
      name.className = "set-name";
      name.textContent = tier.label;
      var note = document.createElement("span");
      note.className = "set-note";
      note.textContent = tier.note;
      btn.append(name, note);
      btn.addEventListener("click", function () {
        // Optimistic: light the chosen option now rather than waiting for the round trip, so
        // a tap always feels answered. The screen's reply is authoritative and corrects this
        // if the choice was refused.
        quality.choice = tier.value;
        renderSettings();
        safeCall(function () {
          freeconsole.message(FreeConsole.SCREEN, { t: "set-quality", choice: tier.value });
        });
        safeCall(function () { freeconsole.vibrate(8); });
      });
      setListEl.appendChild(btn);
    });

    // "Auto" alone does not say what the device settled on, and that is exactly what the
    // admin needs to know before deciding to override it.
    setResolvedEl.textContent =
      quality.choice === "auto" && quality.tier ? "Auto selected: " + quality.tier : "";
  }

  gearEl.addEventListener("click", function () {
    settingsEl.classList.add("show");
    // Ask on open rather than trusting what we hold: this phone may have connected after the
    // screen's boot broadcast, or the tier may have changed since.
    safeCall(function () { freeconsole.message(FreeConsole.SCREEN, { t: "get-quality" }); });
  });

  document.getElementById("setClose").addEventListener("click", function () {
    settingsEl.classList.remove("show");
  });

  // Master is derived from who is connected, so it changes without this phone doing
  // anything: the admin leaves, and the next controller inherits the gear.
  freeconsole.onConnect = function () { renderSettings(); };
  freeconsole.onDisconnect = function () {
    renderSettings();
    if (isMaster() && !quality.tiers.length) {
      safeCall(function () { freeconsole.message(FreeConsole.SCREEN, { t: "get-quality" }); });
    }
  };

  /* ------------------------------------------------------------------ shell */

  freeconsole.onReady = function () {
    // Paint the phone in this device's own colour, so the paddle on the TV and the control in
    // your hand are visibly the same player.
    document.body.style.setProperty("--me", freeconsole.getPlayerColor());
    statusEl.textContent = "Waiting for the round…";
    renderHealth(WALL_HP, false);
    renderSettings();
    safeCall(function () { freeconsole.message(FreeConsole.SCREEN, { t: "get-quality" }); });
  };

  /**
   * Back from a screen lock: stop the paddle, whatever either side believes.
   *
   * send() suppresses a value equal to the last one it sent, so calling padEnd() alone can
   * legitimately transmit nothing while the screen is still gliding the paddle on a stale
   * vector. Resetting `sent` to a value no real input produces forces the zero through.
   */
  freeconsole.onReconnect = function () {
    padId = null;
    pad.classList.remove("active");
    knob.classList.remove("hot");
    knob.style.transform = "translate(0px,0px)";
    sent = NaN;                 // any comparison against this is false, so the next send lands
    send(0);
    safeCall(function () { freeconsole.message(FreeConsole.SCREEN, { t: "get-quality" }); });
  };

  freeconsole.onMessage = function (deviceId, data) {
    // Only the screen is authoritative.
    if (deviceId !== FreeConsole.SCREEN || !data) return;
    var me = freeconsole.getDeviceId();

    // The screen's graphics state, which only the master phone can act on.
    if (data.type === "quality") {
      quality = { choice: data.choice, tier: data.tier, tiers: data.tiers || [] };
      renderSettings();
      return;
    }

    if (data.sides && me in data.sides) applySeat(data.sides[me], data.sideCount, data.wide);
    var isOut = !!(data.out && data.out[me]);
    if (data.hp && me in data.hp) renderHealth(data.hp[me], isOut);

    if (data.phase === "rally" || data.phase === "serve") {
      over = false;
      banner.classList.remove("show");
      pad.classList.toggle("locked", isOut);
      if (isOut) {
        statusEl.textContent = "Wall destroyed — watching";
      } else if (data.phase === "serve") {
        statusEl.textContent = "Get ready…";
      } else {
        // The last hit is the one worth warning about, so the status doubles as the alarm.
        var hp = data.hp && me in data.hp ? data.hp[me] : WALL_HP;
        statusEl.textContent = hp <= 1 ? "One hit left!" : "Defend your wall";
      }
    } else if (data.phase === "waiting") {
      pad.classList.add("locked");
      statusEl.textContent = "Waiting for players…";
    } else if (data.phase === "over") {
      over = true;
      pad.classList.add("locked");
      var won = data.winner === me;
      document.getElementById("bannerBig").textContent = won ? "You win" : "Wall destroyed";
      document.getElementById("bannerSub").textContent = "Tap to play again.";
      banner.classList.add("show");
      freeconsole.vibrate(won ? 40 : 12);
    }
  };
})();
</script>
</body>
</html>
