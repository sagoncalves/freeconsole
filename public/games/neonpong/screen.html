<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Neon Pong — Screen</title>
<link rel="stylesheet" href="/console.css" />
<style>
  html, body { height: 100%; overflow: hidden; }
  body { display: flex; flex-direction: column; }

  /* A thin band of scores above the field. Each seat gets a chip in its own player colour,
     so the wall you are defending and the colour you are is the same information. */
  #hud {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 9px 16px; border-bottom: 1px solid var(--line);
    background: rgba(5,6,13,.85); flex-wrap: wrap;
  }
  .chip {
    display: flex; align-items: baseline; gap: 8px;
    padding: 5px 12px; border-radius: 999px;
    border: 1px solid var(--line); background: rgba(10,12,24,.6);
    transition: opacity .2s, border-color .2s, box-shadow .2s;
  }
  .chip .seat {
    font-family: var(--font-mono); font-size: 9px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--text-faint);
  }
  .chip .nick {
    font-weight: 700; font-size: clamp(12px, 1.2vw, 16px);
    max-width: 16vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* Lives are pips rather than a number: at TV distance a shape you can count at a glance
     beats a digit you have to read. */
  .chip .pips { display: flex; gap: 3px; }
  .chip .pip {
    width: 7px; height: 7px; border-radius: 50%;
    background: currentColor; box-shadow: 0 0 8px currentColor;
  }
  .chip .pip.spent { background: rgba(120,160,220,.18); box-shadow: none; }
  .chip.out { opacity: .32; }
  .chip.out .nick { text-decoration: line-through; }

  #stage { flex: 1; position: relative; background: #05060d; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  #overlay {
    position: absolute; inset: 0; display: flex;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; text-align: center; background: rgba(5,6,13,.88); z-index: 5;
  }
  #overlay.hidden { display: none; }
  #overlay .big {
    font-size: clamp(30px, 6vw, 76px); font-weight: 700; line-height: 1;
    color: var(--glow); text-shadow: var(--bloom-glow);
  }
  #overlay .sub { color: var(--text-dim); font-size: clamp(13px, 1.6vw, 20px); max-width: 60ch; }
  #overlay .ring {
    width: 40px; height: 40px; border-radius: 50%;
    border: 2px solid rgba(53,240,224,.2); border-top-color: var(--glow);
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="hud"></div>

<div id="stage">
  <canvas id="c"></canvas>
  <div id="overlay">
    <div class="ring"></div>
    <div class="sub">Waiting for players…</div>
  </div>
</div>

<script src="/sdk.js"></script>
<script type="module">
import {
  createMatch, addPlayer, removePlayer, setInput, clearInput,
  step, restart, assignSeats, queueServe, paddleBox,
  FIELD, BALL_R, PADDLE_LEN, PADDLE_THICK, WALLS, SEAT_ORDER, LIVES_START,
} from "/games/neonpong/sim.js?v=1";

const freeconsole = new FreeConsole();

/* ------------------------------------------------------------ test harness */

// ?test=1 runs the whole game with no shell behind it: four keyboard paddles, so the sim can
// be reloaded on every edit without re-joining a room. Anything touching the shell goes
// through safeCall, so a missing one is a no-op rather than a crash.
const TEST = new URLSearchParams(location.search).has("test");

function safeCall(fn, fallback) {
  try { return fn(); } catch (err) { return fallback; }
}
function nameOf(id) {
  return safeCall(() => freeconsole.getNickname(id), "Player " + id) || ("Player " + id);
}
function colorOf(id) {
  return safeCall(() => freeconsole.getPlayerColor(id), "#35f0e0") || "#35f0e0";
}

/* -------------------------------------------------------------------- setup */

const match = createMatch(Date.now() & 0xffff);

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const overlay = document.getElementById("overlay");
const hud = document.getElementById("hud");

let cssW = 0, cssH = 0, scale = 1, offX = 0, offY = 0;

function resize() {
  const rect = canvas.getBoundingClientRect();
  const dpr = Math.min(devicePixelRatio || 1, 2);
  cssW = rect.width;
  cssH = rect.height;
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // The field is square and the display is not, so it is letterboxed with a small margin.
  // The margin matters: paddles sit inside the wall, and a field flush with the canvas edge
  // puts the bottom paddle under the bezel of a badly-overscanned TV.
  const margin = 0.94;
  scale = (Math.min(cssW, cssH) / FIELD) * margin;
  offX = (cssW - FIELD * scale) / 2;
  offY = (cssH - FIELD * scale) / 2;
}
addEventListener("resize", resize);

/** World -> canvas. */
function tx(x) { return offX + x * scale; }
function ty(y) { return offY + y * scale; }

/* ------------------------------------------------------------------- roster */

function joinPlayer(deviceId) {
  // Already seated: a reconnect or a duplicate onConnect. Keep the seat, but drop the stick —
  // a stale deflection is what makes a paddle drift into a corner on its own.
  if (match.players.has(deviceId)) {
    clearInput(match, deviceId);
    return;
  }
  if (match.players.size >= SEAT_ORDER.length) return;   // four walls, four seats

  addPlayer(match, deviceId);
  assignSeats(match);
  renderHud();
  maybeStart();
  broadcastState();
}

function leavePlayer(deviceId) {
  if (!match.players.has(deviceId)) return;
  removePlayer(match, deviceId);
  assignSeats(match);

  if (match.players.size === 0) {
    match.phase = "waiting";
    showOverlay("Waiting for players…", null);
  } else if (match.phase === "rally" || match.phase === "serve") {
    // The wall they were defending is now open, so the ball would sail through a gap that
    // nobody owns. Re-serving is the only honest way to continue.
    queueServe(match);
  }
  renderHud();
  broadcastState();
}

function maybeStart() {
  if (match.players.size < 1) {
    showOverlay("Waiting for players…", null);
    return;
  }
  if (match.phase === "rally" || match.phase === "serve") return;
  safeCall(() => freeconsole.setActivePlayers(SEAT_ORDER.length));
  restart(match);
  showOverlay(null);
  broadcastState();
}

/* ---------------------------------------------------------------- shell wiring */

freeconsole.onReady = function () {
  safeCall(() => freeconsole.setActivePlayers(SEAT_ORDER.length));
  for (const id of safeCall(() => freeconsole.getControllerDeviceIds(), []) || []) joinPlayer(id);
  renderHud();
};

freeconsole.onConnect = joinPlayer;
freeconsole.onDisconnect = leavePlayer;

/**
 * Controllers send paddle intent only. Nothing here trusts a phone with a paddle position,
 * a bounce, or a point.
 */
freeconsole.onMessage = function (deviceId, data) {
  if (!data || !match.players.has(deviceId)) return;

  if (data.t === "move") {
    setInput(match, deviceId, data.v);
    return;
  }
  if (data.t === "restart" && match.phase === "over") {
    maybeStart();
  }
};

/**
 * Phase, seats and lives go out on change, not per frame (never stream). A controller only
 * needs to know which wall it is defending, which way its paddle slides, and whether the
 * round is live.
 */
let lastStateKey = "";
function broadcastState() {
  const walls = {};
  const lives = {};
  const out = {};
  for (const [id, p] of match.players) { walls[id] = p.wall; lives[id] = p.lives; out[id] = p.out; }

  const key = JSON.stringify([match.phase, match.winner, walls, lives, out]);
  if (key === lastStateKey) return;
  lastStateKey = key;

  safeCall(() => freeconsole.broadcast({
    phase: match.phase,
    winner: match.winner,
    walls,
    lives,
    out,
  }));
}

/* ---------------------------------------------------------------------- hud */

function renderHud() {
  hud.innerHTML = "";
  const ids = [...match.players.keys()].sort((a, b) => a - b);
  if (ids.length === 0) {
    hud.innerHTML = '<span class="faint" style="font-family:var(--font-mono);font-size:11px;'
      + 'letter-spacing:.14em;text-transform:uppercase">No players yet</span>';
    return;
  }

  for (const id of ids) {
    const p = match.players.get(id);
    const color = colorOf(id);

    const chip = document.createElement("div");
    chip.className = "chip" + (p.out ? " out" : "");
    chip.style.color = color;
    chip.style.borderColor = p.out ? "var(--line)" : color;

    const seat = document.createElement("span");
    seat.className = "seat";
    seat.textContent = WALLS[p.wall].label;

    const nick = document.createElement("span");
    nick.className = "nick";
    nick.textContent = nameOf(id);
    nick.style.color = color;

    const pips = document.createElement("span");
    pips.className = "pips";
    for (let i = 0; i < LIVES_START; i++) {
      const pip = document.createElement("span");
      pip.className = "pip" + (i < p.lives ? "" : " spent");
      pips.appendChild(pip);
    }

    chip.append(seat, nick, pips);
    hud.appendChild(chip);
  }
}

function showOverlay(big, sub) {
  if (big === null) { overlay.classList.add("hidden"); return; }
  overlay.classList.remove("hidden");
  overlay.innerHTML = sub === null
    ? '<div class="ring"></div><div class="sub">' + big + "</div>"
    : '<div class="big">' + big + '</div><div class="sub">' + (sub || "") + "</div>";
}

/* ------------------------------------------------------------------- effects */

// Short-lived rings and flashes, drawn in world space and aged out by the frame loop. Purely
// cosmetic — the sim never reads them back.
const fx = [];
/** Per-wall flash, 0..1, so a conceded goal lights up the wall it went through. */
const wallFlash = { 0: 0, 1: 0, 2: 0, 3: 0 };

/** The ball's recent positions, for a motion trail. Cosmetic, capped, oldest first. */
const trail = [];
const TRAIL_MAX = 14;

function drainEvents() {
  for (const e of match.events) {
    if (e.type === "paddle") {
      fx.push({ x: e.x, y: e.y, life: 1, color: colorOf(e.id), r: 26 });
    } else if (e.type === "goal") {
      wallFlash[e.wall] = 1;
      fx.push({ x: e.x, y: e.y, life: 1, color: "#ff2e88", r: 60 });
      renderHud();
    } else if (e.type === "eliminated") {
      renderHud();
    } else if (e.type === "serve") {
      trail.length = 0;
    } else if (e.type === "win") {
      const label = e.id === null ? "Game over" : nameOf(e.id) + " wins";
      showOverlay(label, "Tap your phone to play again.");
      safeCall(() => freeconsole.setActivePlayers(0));
      renderHud();
    } else if (e.type === "start") {
      renderHud();
    }
  }
  match.events.length = 0;
}

/* ------------------------------------------------------------------- drawing */

function draw() {
  ctx.clearRect(0, 0, cssW, cssH);

  drawField();
  drawWalls();
  for (const p of match.players.values()) drawPaddle(p);
  drawTrail();
  drawBall();
  drawFx();
  drawServeCountdown();
}

/** The court: a dark plate, a grid, and a centre mark. */
function drawField() {
  const g = ctx.createRadialGradient(
    tx(FIELD / 2), ty(FIELD / 2), 0,
    tx(FIELD / 2), ty(FIELD / 2), FIELD * 0.62 * scale
  );
  g.addColorStop(0, "#101425");
  g.addColorStop(1, "#070912");
  ctx.fillStyle = g;
  ctx.fillRect(tx(0), ty(0), FIELD * scale, FIELD * scale);

  // A faint grid gives the ball's speed something to read against; without it a fast ball on
  // a flat plate looks like it is barely moving.
  ctx.strokeStyle = "rgba(120,160,220,.07)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 1; i < 10; i++) {
    const at = (FIELD / 10) * i;
    ctx.moveTo(tx(at), ty(0)); ctx.lineTo(tx(at), ty(FIELD));
    ctx.moveTo(tx(0), ty(at)); ctx.lineTo(tx(FIELD), ty(at));
  }
  ctx.stroke();

  ctx.strokeStyle = "rgba(53,240,224,.12)";
  ctx.lineWidth = Math.max(1, 2 * scale);
  ctx.beginPath();
  ctx.arc(tx(FIELD / 2), ty(FIELD / 2), 70 * scale, 0, Math.PI * 2);
  ctx.stroke();
}

/**
 * The four walls.
 *
 * A defended wall is drawn in its player's colour and an open one stays dim, so it is obvious
 * at a glance which edges are live goals and which are just bouncy sides.
 */
function drawWalls() {
  for (const wall of SEAT_ORDER) {
    const w = WALLS[wall];
    const keeper = [...match.players.values()].find((p) => p.wall === wall && !p.out);
    const flash = wallFlash[wall];

    let color = "rgba(120,160,220,.22)";
    if (keeper) color = colorOf(keeper.id);
    else if ([...match.players.values()].some((p) => p.wall === wall)) color = "rgba(255,46,136,.35)";

    const thick = Math.max(2, 5 * scale);
    ctx.save();
    ctx.fillStyle = color;
    ctx.globalAlpha = keeper ? 0.55 : 1;
    if (keeper) { ctx.shadowColor = color; ctx.shadowBlur = 18 * scale; }

    if (w.axis === "x") {
      const y = w.normal > 0 ? ty(0) : ty(FIELD) - thick;
      ctx.fillRect(tx(0), y, FIELD * scale, thick);
    } else {
      const x = w.normal > 0 ? tx(0) : tx(FIELD) - thick;
      ctx.fillRect(x, ty(0), thick, FIELD * scale);
    }

    // The goal flash washes inward from the wall that was beaten, so a conceded point is
    // impossible to miss even if you were watching the other side of the table.
    if (flash > 0) {
      const depth = FIELD * 0.28 * scale;
      let gx0, gy0, gx1, gy1;
      if (w.axis === "x") {
        gy0 = w.normal > 0 ? ty(0) : ty(FIELD);
        gy1 = gy0 + w.normal * depth;
        gx0 = gx1 = tx(0);
      } else {
        gx0 = w.normal > 0 ? tx(0) : tx(FIELD);
        gx1 = gx0 + w.normal * depth;
        gy0 = gy1 = ty(0);
      }
      const grad = ctx.createLinearGradient(gx0, gy0, gx1, gy1);
      grad.addColorStop(0, "rgba(255,46,136," + (flash * 0.4).toFixed(3) + ")");
      grad.addColorStop(1, "rgba(255,46,136,0)");
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
      ctx.fillStyle = grad;
      if (w.axis === "x") {
        ctx.fillRect(tx(0), Math.min(gy0, gy1), FIELD * scale, depth);
      } else {
        ctx.fillRect(Math.min(gx0, gx1), ty(0), depth, FIELD * scale);
      }
    }
    ctx.restore();
  }
}

function drawPaddle(p) {
  const box = paddleBox(p);
  const color = colorOf(p.id);

  ctx.save();
  if (p.out) {
    // An eliminated player's paddle stays on the table as a dim ghost, so the seat is still
    // legible — but it no longer stops anything, and it must not look like it does.
    ctx.globalAlpha = 0.18;
    ctx.fillStyle = "#56628a";
  } else {
    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 22 * scale;
  }
  roundRect(tx(box.x), ty(box.y), box.w * scale, box.h * scale, Math.min(box.w, box.h) * 0.5 * scale);
  ctx.fill();
  ctx.restore();
}

function roundRect(x, y, w, h, r) {
  const rad = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + rad, y);
  ctx.arcTo(x + w, y, x + w, y + h, rad);
  ctx.arcTo(x + w, y + h, x, y + h, rad);
  ctx.arcTo(x, y + h, x, y, rad);
  ctx.arcTo(x, y, x + w, y, rad);
  ctx.closePath();
}

function drawTrail() {
  for (let i = 0; i < trail.length; i++) {
    const t = trail[i];
    const a = (i + 1) / trail.length;
    ctx.save();
    ctx.globalAlpha = a * 0.35;
    ctx.fillStyle = "#eaf2ff";
    ctx.beginPath();
    ctx.arc(tx(t.x), ty(t.y), BALL_R * scale * a * 0.9, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function drawBall() {
  const b = match.ball;
  ctx.save();
  ctx.fillStyle = "#eaf2ff";
  ctx.shadowColor = "#35f0e0";
  ctx.shadowBlur = 30 * scale;
  ctx.beginPath();
  ctx.arc(tx(b.x), ty(b.y), BALL_R * scale, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawFx() {
  for (const f of fx) {
    ctx.save();
    ctx.globalAlpha = f.life;
    ctx.strokeStyle = f.color;
    ctx.shadowColor = f.color;
    ctx.shadowBlur = 16 * scale;
    ctx.lineWidth = Math.max(1, 3 * scale * f.life);
    ctx.beginPath();
    ctx.arc(tx(f.x), ty(f.y), f.r * (1.4 - f.life) * scale, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }
}

/** The countdown between points, drawn on the field rather than in an overlay. */
function drawServeCountdown() {
  if (match.phase !== "serve") return;
  const n = Math.max(1, Math.ceil(match.serveIn));
  ctx.save();
  ctx.globalAlpha = 0.75;
  ctx.fillStyle = "#35f0e0";
  ctx.shadowColor = "#35f0e0";
  ctx.shadowBlur = 26 * scale;
  ctx.font = "700 " + Math.round(120 * scale) + "px " +
    getComputedStyle(document.body).getPropertyValue("--font-display");
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(String(n), tx(FIELD / 2), ty(FIELD / 2));
  ctx.restore();
}

/* --------------------------------------------------------------------- loop */

let last = 0;

function frame(ts) {
  requestAnimationFrame(frame);
  if (!last) { last = ts; resize(); }

  // Clamp dt so a backgrounded tab does not teleport the ball through a paddle on return.
  const dt = Math.min(0.05, (ts - last) / 1000);
  last = ts;

  step(match, dt);
  drainEvents();

  if (match.phase === "rally") {
    trail.push({ x: match.ball.x, y: match.ball.y });
    if (trail.length > TRAIL_MAX) trail.shift();
  }

  for (const f of fx) f.life -= dt * 2.2;
  for (let i = fx.length - 1; i >= 0; i--) if (fx[i].life <= 0) fx.splice(i, 1);
  for (const k in wallFlash) if (wallFlash[k] > 0) wallFlash[k] = Math.max(0, wallFlash[k] - dt * 1.8);

  draw();
  broadcastState();
}

resize();
requestAnimationFrame(frame);
renderHud();

/* --------------------------------------------------------------- test mode */

if (TEST) {
  // Four local paddles. Bottom: A/D. Top: J/L. Left: W/S. Right: I/K. Enter restarts.
  for (let i = 1; i <= 4; i++) addPlayer(match, i);
  assignSeats(match);
  renderHud();
  restart(match);
  showOverlay(null);

  // Expose the live match so a driver script can assert on it. Test mode only, so the shipped
  // game keeps nothing on the global.
  window.__match = match;

  // Seats are assigned in SEAT_ORDER, so device 1 is bottom, 2 top, 3 left, 4 right.
  const keys = {
    KeyA: [1, -1], KeyD: [1, 1],
    KeyJ: [2, -1], KeyL: [2, 1],
    KeyW: [3, -1], KeyS: [3, 1],
    KeyI: [4, -1], KeyK: [4, 1],
  };
  const down = new Set();

  function applyKeys() {
    const sum = {};
    for (const code of down) {
      const k = keys[code];
      if (k) sum[k[0]] = (sum[k[0]] || 0) + k[1];
    }
    for (let id = 1; id <= 4; id++) setInput(match, id, Math.max(-1, Math.min(1, sum[id] || 0)));
  }

  addEventListener("keydown", (e) => {
    if (e.code === "Enter") { restart(match); showOverlay(null); return; }
    if (!keys[e.code]) return;
    e.preventDefault();
    down.add(e.code);
    applyKeys();
  });
  addEventListener("keyup", (e) => {
    if (!keys[e.code]) return;
    down.delete(e.code);
    applyKeys();
  });
}
</script>
</body>
</html>
