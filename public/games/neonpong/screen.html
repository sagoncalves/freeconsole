<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Neon Pong — Screen</title>
<link rel="stylesheet" href="/console.css" />
<style>
  html, body { height: 100%; overflow: hidden; }
  body { display: flex; flex-direction: column; }

  /* A thin band of players above the field. Each chip carries the player's colour and a
     three-segment health bar in the same green/yellow/red the wall itself uses, so the HUD
     and the arena never tell different stories.

     Everything here is sized in vmin rather than px because the primary display is a TV
     across a room, not a monitor at arm's length. A 9px label is legible on a laptop and
     invisible from a sofa; scaling with the viewport means the same layout reads at both
     distances, and the clamps stop it growing absurd on a very large or very small screen.

     The band is also kept shallow on purpose — it is a status strip, not a scoreboard, and
     every pixel it takes is a pixel the arena loses. */
  #hud {
    display: flex; align-items: center; justify-content: center;
    gap: clamp(10px, 1.1vmin, 20px);
    padding: clamp(9px, 1vmin, 18px) clamp(16px, 2vmin, 34px);
    border-bottom: 1px solid var(--line);
    background: rgba(5,6,13,.85); flex-wrap: wrap;
  }
  .chip {
    display: flex; align-items: center; gap: clamp(8px, .9vmin, 16px);
    padding: clamp(5px, .6vmin, 11px) clamp(12px, 1.3vmin, 24px);
    border-radius: 999px;
    border: 1px solid var(--line); background: rgba(10,12,24,.6);
    transition: opacity .2s, border-color .2s;
  }
  .chip .seat {
    font-family: var(--font-mono); font-size: clamp(9px, 1.05vmin, 19px);
    letter-spacing: .14em; text-transform: uppercase; color: var(--text-faint);
  }
  .chip .nick {
    font-weight: 700; font-size: clamp(13px, 1.85vmin, 34px);
    max-width: 16vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* Health as segments rather than a number: at TV distance a shape you can count beats a
     digit you have to read, and the colour carries the urgency on its own. */
  .chip .hp { display: flex; gap: clamp(3px, .35vmin, 6px); }
  .chip .seg {
    width: clamp(14px, 1.7vmin, 32px); height: clamp(6px, .75vmin, 14px);
    border-radius: 2px; background: rgba(120,160,220,.18);
  }
  .chip.out { opacity: .32; }
  .chip.out .nick { text-decoration: line-through; }

  #stage { flex: 1; position: relative; background: #05060d; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  #overlay {
    position: absolute; inset: 0; display: flex;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; text-align: center; background: rgba(5,6,13,.88); z-index: 5;
  }
  #overlay.hidden { display: none; }
  #overlay .big {
    font-size: clamp(34px, 7vmin, 110px); font-weight: 700; line-height: 1;
    color: var(--glow); text-shadow: var(--bloom-glow);
  }
  /* The subtitle carries the only instruction the room ever gets ("tap your phone"), so it is
     sized to be readable from a sofa rather than treated as fine print. */
  #overlay .sub {
    color: var(--text-dim); font-size: clamp(15px, 2.4vmin, 38px); max-width: 46ch;
    padding: 0 6vmin;
  }
  #overlay .ring {
    width: 40px; height: 40px; border-radius: 50%;
    border: 2px solid rgba(53,240,224,.2); border-top-color: var(--glow);
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="hud"></div>

<div id="stage">
  <canvas id="c"></canvas>
  <div id="overlay">
    <div class="ring"></div>
    <div class="sub">Waiting for players…</div>
  </div>
</div>

<script src="/sdk.js"></script>
<script type="module">
import {
  createMatch, addPlayer, removePlayer, setInput, clearInput,
  step, restart, assignSeats, queueServe,
  paddleAt, paddleQuad, sideGeometry, verticesFor, defenderOf, damageColor, sideLabel,
  FIELD, CENTER, RADIUS, BALL_R, PADDLE_THICK, WALL_HP, MAX_PLAYERS,
} from "/games/neonpong/sim.js?v=2";
import {
  TIERS, QUALITY_CHOICES, DEFAULT_QUALITY, resolveTier, makeFpsWatchdog,
} from "/games/neonpong/quality.js?v=1";

const freeconsole = new FreeConsole();

/* ------------------------------------------------------------ test harness */

// ?test=N runs the whole game with no shell behind it: N local keyboard paddles, so the sim
// can be reloaded on every edit without re-joining a room. Anything touching the shell goes
// through safeCall, so a missing one is a no-op rather than a crash.
const params = new URLSearchParams(location.search);
const TEST = params.has("test");
const TEST_N = Math.max(1, Math.min(MAX_PLAYERS, Number(params.get("test")) || 4));

function safeCall(fn, fallback) {
  try { return fn(); } catch (err) { return fallback; }
}
function nameOf(id) {
  return safeCall(() => freeconsole.getNickname(id), "Player " + id) || ("Player " + id);
}
function colorOf(id) {
  return safeCall(() => freeconsole.getPlayerColor(id), "#35f0e0") || "#35f0e0";
}

/* -------------------------------------------------------------------- setup */

const match = createMatch(Date.now() & 0xffff);

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const overlay = document.getElementById("overlay");
const hud = document.getElementById("hud");

let cssW = 0, cssH = 0, scale = 1, offX = 0, offY = 0;

/** The arena shape the current letterbox was fitted to, so the loop can spot a change. */
let fittedSides = -1, fittedWide = null;

/* ------------------------------------------------------------------- quality */

/**
 * The rendering tier.
 *
 * `Q` is the active config from quality.js and every expensive path reads it. The admin's
 * choice ("auto" or a tier name) is what gets stored, not the resolved tier — "low" and "auto
 * that happened to pick low" are different intentions, and only the first should survive the
 * device changing.
 */
const QUALITY_KEY = "neonpong.quality";

function loadQualityChoice() {
  try {
    const stored = localStorage.getItem(QUALITY_KEY);
    if (stored && QUALITY_CHOICES.includes(stored)) return stored;
  } catch (err) { /* private mode, or storage disabled */ }
  return DEFAULT_QUALITY;
}

function saveQualityChoice(choice) {
  try { localStorage.setItem(QUALITY_KEY, choice); } catch (err) { /* not fatal */ }
}

let qualityChoice = loadQualityChoice();
let { name: tierName, config: Q } = resolveTier(qualityChoice);

/**
 * Blur radius for one class of object, scaled to the display and the current tier.
 *
 * `part` names the class ("walls", "paddles", "ball", "fx") so a tier can keep the glow on the
 * one ball and drop it from the eight paddles. Returns 0 when this tier does not blur that
 * part, and every caller checks for that rather than setting `shadowBlur = 0` blindly:
 * assigning a shadow colour costs something even at radius zero, so the cheap path skips the
 * shadow setup entirely.
 */
function blur(px, part) {
  if (Q.glow <= 0) return 0;
  if (part && Q.glowParts && !Q.glowParts[part]) return 0;
  return px * scale * Q.glow;
}

/**
 * The arena's bounding box in world units, for the letterbox fit.
 *
 * Read from the vertices rather than assumed, so a shape change — a wide 2-player rectangle
 * becoming a triangle as a third player joins — is picked up automatically.
 */
function arenaBounds() {
  const verts = verticesFor(match.sides, match.wide);
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const v of verts) {
    if (v.x < minX) minX = v.x;
    if (v.x > maxX) maxX = v.x;
    if (v.y < minY) minY = v.y;
    if (v.y > maxY) maxY = v.y;
  }
  return { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
}

function resize() {
  const rect = canvas.getBoundingClientRect();
  // Backing-store size is the one cost that scales with nothing but pixels, so the cap comes
  // from the tier. A 4K set reports dpr 1 with a huge css size and is already filling 8M
  // pixels a frame; letting dpr double that again buys detail nobody can resolve from a sofa.
  const dpr = Math.min(devicePixelRatio || 1, Q.maxPixelRatio);
  cssW = rect.width;
  cssH = rect.height;
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // The arena is letterboxed into the canvas with a margin for TV overscan.
  //
  // Many TVs still crop the outermost few percent of the signal, and some do it differently
  // per edge. The polygon's vertices sit exactly on the circumcircle, so a field fitted flush
  // to the canvas loses its corners on any set that overscans — and on this game the corners
  // are where the walls meet, which is the part players are aiming at. Reserving a title-safe
  // border costs a little size on a correctly-calibrated monitor and saves the playfield on a
  // television, which is the display this game is actually for.
  //
  // The fit is against the arena's real bounding box, not the FIELD square. The 1-2 player
  // court is a wide rectangle: fitting it as though it were square would letterbox it to the
  // shorter axis and leave a third of a widescreen TV empty above and below it. Measuring the
  // actual shape means every arena — rectangle or polygon — fills as much of the display as
  // its own proportions allow.
  const margin = 0.88;
  const box = arenaBounds();
  scale = Math.min(cssW / box.w, cssH / box.h) * margin;
  offX = (cssW - box.w * scale) / 2 - box.x * scale;
  offY = (cssH - box.h * scale) / 2 - box.y * scale;
  fittedSides = match.sides;
  fittedWide = match.wide;
  // The backdrop ramp is in canvas coordinates, so it has to be rebuilt whenever the fit
  // changes — otherwise it keeps the old layout's centre and radius.
  buildArenaFill();
}
addEventListener("resize", resize);

/** World -> canvas. */
function tx(x) { return offX + x * scale; }
function ty(y) { return offY + y * scale; }

/* ------------------------------------------------------------------- roster */

function joinPlayer(deviceId) {
  // Already seated: a reconnect or a duplicate onConnect. Keep the seat, but drop the stick —
  // a stale deflection is what makes a paddle drift into a corner on its own.
  if (match.players.has(deviceId)) {
    clearInput(match, deviceId);
    return;
  }
  if (match.players.size >= MAX_PLAYERS) return;

  addPlayer(match, deviceId);
  renderHud();
  maybeStart();
  broadcastState();
}

function leavePlayer(deviceId) {
  if (!match.players.has(deviceId)) return;
  removePlayer(match, deviceId);

  if (match.players.size === 0) {
    match.phase = "waiting";
    showOverlay("Waiting for players…", null);
  } else if (match.phase === "rally" || match.phase === "serve") {
    // The polygon just changed shape under the ball, so it is very likely outside the new
    // arena or inside a wall. Re-serving is the only honest way to continue.
    queueServe(match);
  }
  renderHud();
  broadcastState();
}

function maybeStart() {
  if (match.players.size < 1) {
    showOverlay("Waiting for players…", null);
    return;
  }
  if (match.phase === "rally" || match.phase === "serve") return;
  safeCall(() => freeconsole.setActivePlayers(MAX_PLAYERS));
  restart(match);
  showOverlay(null);
  broadcastState();
}

/* ---------------------------------------------------------------- shell wiring */

freeconsole.onReady = function () {
  safeCall(() => freeconsole.setActivePlayers(MAX_PLAYERS));
  for (const id of safeCall(() => freeconsole.getControllerDeviceIds(), []) || []) joinPlayer(id);
  renderHud();
};

// A joining or leaving phone can change who the master is, and the new master needs the tier
// list before it can draw the settings sheet.
freeconsole.onConnect = function (deviceId) {
  joinPlayer(deviceId);
  broadcastQuality();
};
freeconsole.onDisconnect = function (deviceId) {
  leavePlayer(deviceId);
  broadcastQuality();
};

/**
 * Controllers send paddle intent only. Nothing here trusts a phone with a paddle position,
 * a bounce, or a hit.
 */
freeconsole.onMessage = function (deviceId, data) {
  if (!data) return;

  // Graphics settings are handled before the roster check: the master may be a phone that
  // has no seat yet, and the setting belongs to the shared screen rather than to a player.
  if (data.t === "get-quality") {
    broadcastQuality();
    return;
  }
  if (data.t === "set-quality") {
    // Restricted to the master because this is a room-wide setting on a shared display, not
    // a per-player preference — otherwise any of the eight could drop the TV to Low mid-match
    // for everyone. Master is derived (lowest-numbered controller), so it survives that phone
    // leaving with no handover.
    const master = safeCall(() => freeconsole.getMasterControllerDeviceId());
    if (Number(deviceId) !== master) return;
    if (!QUALITY_CHOICES.includes(data.choice)) return;
    // An explicit choice retires the watchdog: the admin has spoken, and a later automatic
    // step-down would silently contradict them.
    watchdog?.stop();
    applyQuality(data.choice);
    if (data.choice === "auto") armWatchdog();
    return;
  }

  if (!match.players.has(deviceId)) return;

  if (data.t === "move") {
    setInput(match, deviceId, data.v);
    return;
  }
  if (data.t === "restart" && match.phase === "over") {
    maybeStart();
  }
};

/**
 * Phase, seats and health go out on change, not per frame (never stream). A controller needs
 * to know which side it defends, how many sides the arena has right now — that decides which
 * way its paddle slides on screen — and how much wall it has left.
 */
let lastStateKey = "";
function broadcastState() {
  const sides = {};
  const hp = {};
  const out = {};
  for (const [id, p] of match.players) { sides[id] = p.side; hp[id] = p.hp; out[id] = p.out; }

  const key = JSON.stringify([match.phase, match.winner, match.sides, match.wide, sides, hp, out]);
  if (key === lastStateKey) return;
  lastStateKey = key;

  safeCall(() => freeconsole.broadcast({
    phase: match.phase,
    winner: match.winner,
    sideCount: match.sides,
    // The controller re-derives its own edge direction, so it needs the arena's shape as well
    // as its seat: the same side index points a different way on a rectangle than a square.
    wide: match.wide,
    sides,
    hp,
    out,
  }));
}

/* ---------------------------------------------------------------------- hud */

function renderHud() {
  hud.innerHTML = "";
  const ids = [...match.players.keys()].sort((a, b) => a - b);
  if (ids.length === 0) {
    hud.innerHTML = '<span class="faint" style="font-family:var(--font-mono);font-size:11px;'
      + 'letter-spacing:.14em;text-transform:uppercase">No players yet</span>';
    return;
  }

  for (const id of ids) {
    const p = match.players.get(id);
    const color = colorOf(id);

    const chip = document.createElement("div");
    chip.className = "chip" + (p.out ? " out" : "");
    chip.style.borderColor = p.out ? "var(--line)" : color;

    const seat = document.createElement("span");
    seat.className = "seat";
    seat.textContent = p.out ? "Out" : sideLabel(match.sides, p.side);

    const nick = document.createElement("span");
    nick.className = "nick";
    nick.textContent = nameOf(id);
    nick.style.color = color;

    // Segments drain right to left and take the wall's own damage colour, so a player's HUD
    // entry and their wall on the field always agree.
    const bar = document.createElement("span");
    bar.className = "hp";
    const dmg = damageColor(p.hp);
    for (let i = 0; i < WALL_HP; i++) {
      const seg = document.createElement("span");
      seg.className = "seg";
      if (i < p.hp && dmg) {
        seg.style.background = dmg;
        seg.style.boxShadow = "0 0 8px " + dmg;
      }
      bar.appendChild(seg);
    }

    chip.append(seat, nick, bar);
    hud.appendChild(chip);
  }
}

function showOverlay(big, sub) {
  if (big === null) { overlay.classList.add("hidden"); return; }
  overlay.classList.remove("hidden");
  overlay.innerHTML = sub === null
    ? '<div class="ring"></div><div class="sub">' + big + "</div>"
    : '<div class="big">' + big + '</div><div class="sub">' + (sub || "") + "</div>";
}

/* ------------------------------------------------------------------- effects */

// Short-lived rings and shards, drawn in world space and aged out by the frame loop. Purely
// cosmetic — the sim never reads them back.
const fx = [];
/** Per-side flash keyed by side index, so a hit lights up the wall that took it. */
let sideFlash = {};

/** The ball's recent positions, for a motion trail. Cosmetic, capped, oldest first. */
const trail = [];

/**
 * Drain the sim's event log into effects.
 *
 * Every spawn here is gated on the tier, so a disabled effect costs nothing at all rather
 * than being created and then skipped at draw time. Effects that carry *information* — the
 * ring marking a hit, the wall wash naming who took it — survive at every tier; only the
 * purely decorative ones (shards, trail) are dropped.
 */
function drainEvents() {
  for (const e of match.events) {
    if (e.type === "paddle") {
      if (Q.rings) fx.push({ kind: "ring", x: e.x, y: e.y, life: 1, color: colorOf(e.id), r: 26 });
    } else if (e.type === "hit") {
      sideFlash[e.side] = 1;
      const c = damageColor(e.hp) || "#ff2e88";
      if (Q.rings) fx.push({ kind: "ring", x: e.x, y: e.y, life: 1, color: c, r: 54 });
      renderHud();
    } else if (e.type === "destroyed") {
      // A burst of shards along the dead wall, so the side visibly breaks rather than
      // silently vanishing on the next frame.
      const g = sideGeometry(match.sides, e.side, match.wide);
      for (let i = 0; i < Q.shards; i++) {
        const f = Q.shards > 1 ? i / (Q.shards - 1) : 0.5;
        fx.push({
          kind: "shard", life: 1,
          x: g.a.x + g.dx * (g.len * f),
          y: g.a.y + g.dy * (g.len * f),
          vx: g.nx * (60 + Math.random() * 220) + g.dx * (Math.random() - 0.5) * 160,
          vy: g.ny * (60 + Math.random() * 220) + g.dy * (Math.random() - 0.5) * 160,
          color: "#ff2e88",
        });
      }
      renderHud();
    } else if (e.type === "reshape") {
      sideFlash = {};
      renderHud();
    } else if (e.type === "serve" || e.type === "escape" || e.type === "stalemate") {
      trail.length = 0;
    } else if (e.type === "win") {
      const label = e.id === null ? "Game over" : nameOf(e.id) + " wins";
      showOverlay(label, "Tap your phone to play again.");
      safeCall(() => freeconsole.setActivePlayers(0));
      renderHud();
    } else if (e.type === "start") {
      renderHud();
    }
  }
  match.events.length = 0;
}

/* ------------------------------------------------------------------- drawing */

function draw() {
  ctx.clearRect(0, 0, cssW, cssH);

  drawArena();
  drawWalls();
  for (const p of match.players.values()) if (!p.out) drawPaddle(p);
  drawTrail();
  if (match.phase === "rally") drawBall();
  drawFx();
  drawServeCountdown();
}

/**
 * The arena backdrop gradient, built once per layout rather than per frame.
 *
 * `createRadialGradient` allocates and rasterises a colour ramp every time it is called, and
 * this one covers the whole playfield. It only depends on the letterbox, so it is rebuilt in
 * resize() and reused for every frame in between. Null on tiers with gradients off.
 */
let arenaFill = null;

function buildArenaFill() {
  if (!Q.gradients) { arenaFill = null; return; }
  const g = ctx.createRadialGradient(
    tx(CENTER), ty(CENTER), 0,
    tx(CENTER), ty(CENTER), RADIUS * scale
  );
  g.addColorStop(0, "#101425");
  g.addColorStop(1, "#070912");
  arenaFill = g;
}

/** The court interior: a dark plate clipped to the polygon, plus a centre mark. */
function drawArena() {
  const n = match.sides;
  const verts = verticesFor(n, match.wide);

  ctx.save();
  ctx.beginPath();
  ctx.moveTo(tx(verts[0].x), ty(verts[0].y));
  for (let i = 1; i < n; i++) ctx.lineTo(tx(verts[i].x), ty(verts[i].y));
  ctx.closePath();
  ctx.clip();

  // A flat fill on Low. The gradient is a backdrop nobody looks at directly, and filling a
  // 4K canvas from a colour ramp every frame is the second-largest cost in this renderer.
  ctx.fillStyle = arenaFill || "#0b0f1c";
  ctx.fillRect(tx(0), ty(0), FIELD * scale, FIELD * scale);

  // Concentric rings give the ball's speed something to read against; without them a fast
  // ball on a flat plate looks like it is barely moving.
  if (Q.grid) {
    ctx.strokeStyle = "rgba(120,160,220,.07)";
    ctx.lineWidth = 1;
    for (let i = 1; i <= 4; i++) {
      ctx.beginPath();
      ctx.arc(tx(CENTER), ty(CENTER), (RADIUS / 5) * i * scale, 0, Math.PI * 2);
      ctx.stroke();
    }
  }
  ctx.restore();

  ctx.strokeStyle = "rgba(53,240,224,.12)";
  ctx.lineWidth = Math.max(1, 2 * scale);
  ctx.beginPath();
  ctx.arc(tx(CENTER), ty(CENTER), 60 * scale, 0, Math.PI * 2);
  ctx.stroke();
}

/**
 * The polygon's sides.
 *
 * A defended side is drawn in its damage colour — green, yellow, then red — which is the
 * single most important read on the field: it tells every player who is nearly out. An
 * unclaimed side stays dim, so it is obvious which edges are live targets and which are just
 * bouncy scenery.
 */
function drawWalls() {
  const n = match.sides;
  for (let i = 0; i < n; i++) {
    const g = sideGeometry(n, i, match.wide);
    const keeper = defenderOf(match, i);
    const flash = sideFlash[i] || 0;

    const color = keeper ? damageColor(keeper.hp) : "rgba(120,160,220,.20)";
    if (!color) continue;   // destroyed: a real gap, drawn as nothing at all

    ctx.save();
    ctx.strokeStyle = color;
    // A slightly heavier line when there is no glow to thicken it, so a wall still reads as
    // solid neon on Low rather than as a hairline.
    ctx.lineWidth = Math.max(2, (Q.glow > 0 ? 6 : 8) * scale);
    ctx.lineCap = "round";
    const wallBlur = keeper ? blur(14 + flash * 26, "walls") : 0;
    if (wallBlur > 0) { ctx.shadowColor = color; ctx.shadowBlur = wallBlur; }
    ctx.beginPath();
    ctx.moveTo(tx(g.a.x), ty(g.a.y));
    ctx.lineTo(tx(g.b.x), ty(g.b.y));
    ctx.stroke();

    // The hit flash washes inward from the wall that took it, so damage is impossible to miss
    // even if you were watching the other side of the arena.
    if (flash > 0 && Q.wallFlash) {
      const depth = RADIUS * 0.3;
      // On a gradient-free tier the wash is a single flat translucent fill. It still reads as
      // "this wall was just hit" — which is the information it exists to carry — without
      // building a colour ramp per damaged wall per frame.
      let wash;
      if (Q.gradients) {
        wash = ctx.createLinearGradient(
          tx(g.mx), ty(g.my),
          tx(g.mx + g.nx * depth), ty(g.my + g.ny * depth)
        );
        wash.addColorStop(0, "rgba(255,46,136," + (flash * 0.34).toFixed(3) + ")");
        wash.addColorStop(1, "rgba(255,46,136,0)");
      } else {
        wash = "rgba(255,46,136," + (flash * 0.20).toFixed(3) + ")";
      }
      ctx.shadowBlur = 0;
      ctx.fillStyle = wash;
      ctx.beginPath();
      ctx.moveTo(tx(g.a.x), ty(g.a.y));
      ctx.lineTo(tx(g.b.x), ty(g.b.y));
      ctx.lineTo(tx(g.b.x + g.nx * depth), ty(g.b.y + g.ny * depth));
      ctx.lineTo(tx(g.a.x + g.nx * depth), ty(g.a.y + g.ny * depth));
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }
}

function drawPaddle(p) {
  const quad = paddleQuad(match, p);
  const color = colorOf(p.id);
  const b = blur(22, "paddles");

  ctx.save();
  ctx.fillStyle = color;
  if (b > 0) { ctx.shadowColor = color; ctx.shadowBlur = b; }
  ctx.beginPath();
  ctx.moveTo(tx(quad[0].x), ty(quad[0].y));
  for (let i = 1; i < quad.length; i++) ctx.lineTo(tx(quad[i].x), ty(quad[i].y));
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

/**
 * The ball's motion trail.
 *
 * Skipped entirely on Low. This is the most overdrawn region of the screen — a stack of
 * translucent arcs redrawn every frame directly on top of each other — and at the top tier
 * each one also carried its own blur. `Q.trail` caps how many samples are kept, so the cost
 * is bounded at the source rather than here.
 */
function drawTrail() {
  if (!trail.length) return;
  ctx.save();
  ctx.fillStyle = "#eaf2ff";
  if (Q.trailGlow) { ctx.shadowColor = "#35f0e0"; ctx.shadowBlur = blur(12, "ball"); }
  for (let i = 0; i < trail.length; i++) {
    const t = trail[i];
    const a = (i + 1) / trail.length;
    ctx.globalAlpha = a * 0.35;
    ctx.beginPath();
    ctx.arc(tx(t.x), ty(t.y), BALL_R * scale * a * 0.9, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawBall() {
  const ball = match.ball;
  const b = blur(30, "ball");
  ctx.save();
  ctx.fillStyle = "#eaf2ff";
  if (b > 0) { ctx.shadowColor = "#35f0e0"; ctx.shadowBlur = b; }
  ctx.beginPath();
  // A touch larger without its glow, so the ball stays as findable on a TV as it is with the
  // bloom around it. This is the one object every player is tracking.
  ctx.arc(tx(ball.x), ty(ball.y), BALL_R * scale * (b > 0 ? 1 : 1.15), 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawFx() {
  if (!fx.length) return;
  for (const f of fx) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, f.life);
    if (f.kind === "shard") {
      const b = blur(14, "fx");
      ctx.fillStyle = f.color;
      if (b > 0) { ctx.shadowColor = f.color; ctx.shadowBlur = b; }
      ctx.beginPath();
      ctx.arc(tx(f.x), ty(f.y), Math.max(1, 5 * f.life * scale), 0, Math.PI * 2);
      ctx.fill();
    } else {
      const b = blur(16, "fx");
      ctx.strokeStyle = f.color;
      if (b > 0) { ctx.shadowColor = f.color; ctx.shadowBlur = b; }
      ctx.lineWidth = Math.max(1, 3 * scale * f.life);
      ctx.beginPath();
      ctx.arc(tx(f.x), ty(f.y), f.r * (1.4 - f.life) * scale, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
  }
}

/** The countdown between points, drawn on the field rather than in an overlay. */
function drawServeCountdown() {
  if (match.phase !== "serve") return;
  const n = Math.max(1, Math.ceil(match.serveIn));
  ctx.save();
  ctx.globalAlpha = 0.75;
  ctx.fillStyle = "#35f0e0";
  ctx.shadowColor = "#35f0e0";
  ctx.shadowBlur = blur(26, "ball");
  ctx.font = "700 " + Math.round(120 * scale) + "px " +
    getComputedStyle(document.body).getPropertyValue("--font-display");
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(String(n), tx(CENTER), ty(CENTER));
  ctx.restore();
}

/* --------------------------------------------------------------------- loop */

let last = 0;

/* ------------------------------------------------------------ quality control */

/**
 * Switch tier.
 *
 * @param {string} choice   "auto" or a tier name
 * @param {object} [opts]   `auto: true` when the watchdog chose it, not a person
 */
function applyQuality(choice, { auto = false } = {}) {
  const resolved = resolveTier(choice);
  qualityChoice = choice;
  tierName = resolved.name;
  Q = resolved.config;

  // A watchdog step-down must not be written back as though the admin asked for it: the
  // choice stays "auto", so a better device later gets a fresh guess.
  if (!auto) saveQualityChoice(choice);

  // The pixel-ratio cap and the backdrop ramp both live in the canvas layout, so a tier
  // change has to re-run the fit. Trail samples beyond the new cap are dropped immediately
  // rather than lingering for a few frames.
  resize();
  while (trail.length > Q.trail) trail.shift();
  if (Q.shards === 0) {
    for (let i = fx.length - 1; i >= 0; i--) if (fx[i].kind === "shard") fx.splice(i, 1);
  }

  broadcastQuality();
}

/** Tell the controllers what the screen is running, so the master can show it selected. */
function broadcastQuality() {
  safeCall(() => freeconsole.broadcast({
    type: "quality",
    choice: qualityChoice,
    tier: tierName,
    tiers: QUALITY_CHOICES.map((name) => ({
      value: name,
      label: name === "auto" ? "Auto" : TIERS[name].label,
      note: name === "auto" ? "Match the device" : TIERS[name].note,
    })),
  }));
}

/**
 * Live view of what the renderer is actually doing, exposed outside test mode — the only way
 * to confirm from a TV that a tier switch took effect and what a frame really costs.
 */
window.__gfxProbe = () => ({
  choice: qualityChoice,
  tier: tierName,
  glow: Q.glow,
  gradients: Q.gradients,
  trail: Q.trail,
  trailLen: trail.length,
  shards: Q.shards,
  effects: fx.length,
  pixelRatio: Math.min(devicePixelRatio || 1, Q.maxPixelRatio),
  fpsCap: Q.targetFps || 0,
  sides: match.sides,
});

/**
 * Steps the tier down once when the frame rate is persistently bad.
 * Only armed on "auto" — an explicit choice is an instruction, not a suggestion.
 */
let watchdog = null;

function armWatchdog() {
  watchdog?.stop();
  watchdog = qualityChoice === "auto" && tierName !== "low"
    ? makeFpsWatchdog({
        onDrop: (fps) => {
          const next = tierName === "high" ? "medium" : "low";
          console.info(`[neonpong] ${Math.round(fps)}fps sustained; dropping ${tierName} -> ${next}`);
          applyQuality(next, { auto: true });
        },
      })
    : null;
}

/** Timestamp the last drawn frame was presented, for the Low tier's frame cap. */
let lastDrawn = 0;

function frame(ts) {
  requestAnimationFrame(frame);
  if (!last) { last = ts; resize(); }

  // Clamp dt so a backgrounded tab does not teleport the ball through a paddle on return.
  const dt = Math.min(0.05, (ts - last) / 1000);
  last = ts;

  watchdog?.tick(ts);

  // Refit whenever the arena's shape changes — a join, a departure, or a destroyed wall all
  // reach here by different paths, and one check covers every one of them.
  if (match.sides !== fittedSides || match.wide !== fittedWide) resize();

  // The sim always steps at the real frame rate; only *drawing* is capped below. It is fully
  // dt-driven with a clamp, so a 30Hz display plays the identical match to a 60Hz one — and
  // skipping the sim instead would make the ball's behaviour depend on the tier.
  step(match, dt);
  drainEvents();

  if (match.phase === "rally" && Q.trail > 0) {
    trail.push({ x: match.ball.x, y: match.ball.y });
    while (trail.length > Q.trail) trail.shift();
  }

  for (const f of fx) {
    f.life -= dt * (f.kind === "shard" ? 1.1 : 2.2);
    if (f.kind === "shard") { f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 220 * dt; }
  }
  for (let i = fx.length - 1; i >= 0; i--) if (fx[i].life <= 0) fx.splice(i, 1);
  for (const k in sideFlash) if (sideFlash[k] > 0) sideFlash[k] = Math.max(0, sideFlash[k] - dt * 1.8);

  // Frame cap. On Low the display is repainted at 30fps rather than as fast as the browser
  // asks, which halves the fill and blur cost on exactly the hardware that cannot afford it.
  // A TV locked to 30Hz is already there and loses nothing; a struggling one gets a steady
  // 30 instead of an erratic 40-ish, and steady reads as far smoother than fast-but-uneven.
  if (Q.targetFps > 0) {
    const minGap = 1000 / Q.targetFps - 1;   // -1ms so a 33.3ms budget is not missed by rounding
    if (ts - lastDrawn < minGap) { broadcastState(); return; }
  }
  lastDrawn = ts;

  draw();
  broadcastState();
}

resize();
buildArenaFill();
armWatchdog();
broadcastQuality();
requestAnimationFrame(frame);
renderHud();

/* --------------------------------------------------------------- test mode */

if (TEST) {
  // N local paddles, ?test=N (default 4, max 8). Each player gets an adjacent key pair on the
  // keyboard's home row and the row above, in seat order.
  for (let i = 1; i <= TEST_N; i++) addPlayer(match, i);
  renderHud();
  restart(match);
  showOverlay(null);

  // Expose the live match so a driver script can assert on it. Test mode only, so the shipped
  // game keeps nothing on the global.
  window.__match = match;

  // Seat i gets keys[i]: one pair per player, in the order seats are assigned.
  const pairs = [
    ["KeyA", "KeyD"], ["KeyJ", "KeyL"], ["KeyW", "KeyS"], ["KeyI", "KeyK"],
    ["KeyF", "KeyH"], ["KeyN", "KeyM"], ["KeyT", "KeyY"], ["KeyO", "KeyP"],
  ];
  const keys = {};
  for (let i = 1; i <= TEST_N; i++) {
    const [neg, pos] = pairs[i - 1];
    keys[neg] = [i, -1];
    keys[pos] = [i, 1];
  }
  const down = new Set();

  function applyKeys() {
    const sum = {};
    for (const code of down) {
      const k = keys[code];
      if (k) sum[k[0]] = (sum[k[0]] || 0) + k[1];
    }
    for (let id = 1; id <= TEST_N; id++) {
      setInput(match, id, Math.max(-1, Math.min(1, sum[id] || 0)));
    }
  }

  addEventListener("keydown", (e) => {
    if (e.code === "Enter") { restart(match); showOverlay(null); return; }
    if (!keys[e.code]) return;
    e.preventDefault();
    down.add(e.code);
    applyKeys();
  });
  addEventListener("keyup", (e) => {
    if (!keys[e.code]) return;
    down.delete(e.code);
    applyKeys();
  });
}
</script>
</body>
</html>
