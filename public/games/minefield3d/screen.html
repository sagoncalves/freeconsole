<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Minefield Escape 3D — Screen</title>
<link rel="stylesheet" href="/console.css" />
<style>
  html, body { height: 100%; overflow: hidden; }
  body { display: flex; flex-direction: column; background: #03040a; }

  #hud {
    display: flex; align-items: center; gap: 16px;
    padding: 9px 20px; border-bottom: 1px solid var(--line);
    background: rgba(3,4,10,.9); flex-shrink: 0;
  }
  #levelName { font-family: var(--font-display); font-weight: 700; font-size: clamp(12px,1.4vw,18px); white-space: nowrap; }
  #levelName .tag {
    display: block; font-family: var(--font-mono); font-size: 9px;
    letter-spacing: .16em; text-transform: uppercase; color: var(--text-faint);
  }

  #gate { display: flex; align-items: center; gap: 8px; }
  #gate .label {
    font-family: var(--font-mono); font-size: 9px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--text-faint);
  }
  #slots { display: flex; gap: 4px; }
  .slot {
    width: clamp(14px,1.6vw,20px); height: clamp(14px,1.6vw,20px);
    border-radius: 4px; border: 1px solid var(--line);
    background: rgba(26,32,56,.6); transition: background .2s, box-shadow .2s;
  }
  .slot.used { background: var(--lime); border-color: var(--lime); box-shadow: 0 0 14px var(--lime); }
  #gate.closed .slot { border-color: var(--hot); box-shadow: none; }

  /* Survival's readout, in place of the gate slots. */
  #survivalHud { display: none; align-items: center; gap: 8px; }
  #survivalHud.show { display: flex; }
  #survivalHud .label {
    font-family: var(--font-mono); font-size: 9px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--text-faint);
  }
  #survivalHud .val {
    font-family: var(--font-mono); font-weight: 700;
    font-size: clamp(11px,1.3vw,16px); color: var(--glow);
  }
  /* The clock is the score, so it gets the width to change without shifting everything else. */
  #clock { min-width: 5.5ch; }
  #survivalHud.hot .val { color: var(--hot); }

  /* Sniper: who is in the nest, whether the rifle is loaded, and how many are still running. */
  #sniperHud { display: none; align-items: center; gap: 8px; }
  #sniperHud.show { display: flex; }
  #sniperHud .label {
    font-family: var(--font-mono); font-size: 9px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--text-faint);
  }
  #sniperHud .val {
    font-family: var(--font-mono); font-weight: 700;
    font-size: clamp(11px,1.3vw,16px); color: var(--glow);
  }
  #rifleState { min-width: 7ch; }
  /* Red while the bolt is out — the same tell the laser carries, for anyone watching the HUD. */
  #sniperHud.reloading #rifleState { color: var(--hot); }

  /* Calls: the round counter, the called symbol, and the countdown. */
  #callsHud { display: none; align-items: center; gap: 8px; }
  #callsHud.show { display: flex; }
  #callsHud .label {
    font-family: var(--font-mono); font-size: 9px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--text-faint);
  }
  #callsHud .val {
    font-family: var(--font-mono); font-weight: 700;
    font-size: clamp(11px,1.3vw,16px); color: var(--glow);
  }
  /* The symbol carries the colour it has on the tiles and the wall — cyan X, pink O — so the
     three places it appears never have to be mentally reconciled. */
  #callsHud .sym { font-size: clamp(14px,1.7vw,21px); min-width: 1.6ch; text-align: center; }
  #callsHud .sym.o { color: var(--hot); }
  #callClock { min-width: 4ch; }
  #callsHud.hot #callClock { color: var(--hot); }

  #roster { flex: 1; display: flex; gap: 7px; flex-wrap: wrap; justify-content: flex-end; }
  .chip {
    display: flex; align-items: center; gap: 6px;
    padding: 3px 9px; border-radius: 999px;
    border: 1px solid var(--line); background: rgba(10,12,24,.7);
    font-size: clamp(10px,1.05vw,13px); font-weight: 700;
    max-width: 15vw; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    transition: opacity .3s, filter .3s;
  }
  .chip .legs { font-family: var(--font-mono); font-size: 10px; letter-spacing: .08em; }
  .chip.hurt .legs { color: var(--amber); }
  .chip.crawl .legs { color: var(--hot); }
  .chip.dead { opacity: .3; filter: grayscale(1); }
  .chip.out { border-color: var(--lime); box-shadow: 0 0 12px rgba(157,255,79,.25); }
  /* Seated but sitting this round out — joined or reloaded after it started. */
  .chip.waiting { opacity: .5; }
  .chip.waiting .legs { color: var(--text-faint); }

  #stage { flex: 1; position: relative; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  #overlay {
    position: absolute; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; text-align: center; padding: 24px;
    background: radial-gradient(ellipse at center, rgba(3,4,10,.82), rgba(3,4,10,.97));
  }
  #overlay.hidden { display: none; }
  #overlay .big {
    font-size: clamp(28px,5.5vw,68px); font-weight: 700; line-height: 1.05;
    color: var(--glow); text-shadow: var(--bloom-glow);
  }
  #overlay .big.bad { color: var(--hot); text-shadow: var(--bloom-hot); }
  #overlay .sub { color: var(--text-dim); font-size: clamp(13px,1.5vw,19px); max-width: 56ch; line-height: 1.6; }
  #overlay .roll { font-family: var(--font-mono); font-size: clamp(11px,1.2vw,15px); color: var(--text-dim); line-height: 2; }
  #overlay .roll b { color: var(--lime); }
  #overlay .ring {
    width: 38px; height: 38px; border-radius: 50%;
    border: 2px solid rgba(53,240,224,.18); border-top-color: var(--glow);
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* A red wash that closes in from the edges as a threat does.

     Fixed gradient, animated opacity only. Opacity is a compositor-only property, so a TV
     fades this on the GPU without re-rasterising the stage; rewriting the colour or the
     blur radius every frame instead — an inset box-shadow, say — repaints full-screen each
     time and is what actually costs a weak GPU its frame budget. `will-change` takes the
     one-off layer promotion up front rather than on the frame the killer arrives. */
  #dread {
    position: absolute; inset: 0; pointer-events: none; z-index: 4;
    opacity: 0;
    will-change: opacity;
    /* Two declarations on purpose. The explicit `ellipse <w> <h>` size is CSS Images 3, and
       old TV WebKits (some webOS/Tizen builds) drop the whole declaration when they cannot
       parse it — which would silently delete the warning rather than degrade it. The keyword
       form parses everywhere; the second wins wherever it is understood. */
    background:
      radial-gradient(ellipse farthest-corner at 50% 50%,
        rgba(255,46,136,0) 40%,
        rgba(255,46,136,.28) 78%,
        rgba(255,30,110,.62) 100%);
    background:
      radial-gradient(ellipse 75% 65% at 50% 50%,
        rgba(255,46,136,0) 40%,
        rgba(255,46,136,.28) 78%,
        rgba(255,30,110,.62) 100%);
    transition: opacity .5s ease-out;
  }
  /* Survival runs the wash tighter and thinner — see updateDread for why. Swapping a class
     changes the gradient once per mode rather than per frame, so it stays off the hot path. */
  #dread.survival {
    background:
      radial-gradient(ellipse farthest-corner at 50% 50%,
        rgba(255,46,136,0) 55%,
        rgba(255,46,136,.18) 84%,
        rgba(255,30,110,.4) 100%);
    background:
      radial-gradient(ellipse 88% 82% at 50% 50%,
        rgba(255,46,136,0) 55%,
        rgba(255,46,136,.18) 84%,
        rgba(255,30,110,.4) 100%);
  }

  /* The scope overlay, drawn over the right-hand viewport only. */
  #scope {
    position: absolute; top: 0; right: 0; bottom: 0; width: 50%;
    z-index: 5; pointer-events: none; opacity: 0;
    transition: opacity .18s ease-out;
  }
  #scope.show { opacity: 1; }
  /* The eyepiece.
     A vignette, NOT a blackout. Blacking the surround out entirely is the photographic
     truth of looking through a scope, but on a shared TV it throws away half the screen:
     the sniper loses every runner not already centred, and the people watching lose the
     shot entirely. This darkens toward the edge and stops well short of opaque, so the
     circle still reads as an eyepiece while the aisle around it stays legible. */
  #scope .ring {
    position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 50%,
      rgba(0,0,0,0) 30%, rgba(0,0,0,.18) 44%, rgba(0,0,0,.45) 62%, rgba(0,0,0,.62) 100%);
  }
  /* The eyepiece edge, which is what actually reads as "scope" once the blackout is gone. */
  #scope .ring::after {
    content: ""; position: absolute; left: 50%; top: 50%;
    width: 60%; aspect-ratio: 1; transform: translate(-50%,-50%);
    border-radius: 50%; border: 2px solid rgba(0,0,0,.55);
    box-shadow: 0 0 0 1px rgba(53,240,224,.22) inset;
  }
  #scope .cross {
    position: absolute; background: rgba(255,46,136,.85);
    left: 50%; top: 50%;
  }
  /* Deliberately broken at the centre: an unbroken cross hides the thing being aimed at. */
  #scope .cross.v { width: 1px; height: 22%; transform: translate(-50%,-50%); }
  #scope .cross.h { width: 22%; height: 1px; transform: translate(-50%,-50%); }
  #scope .mil {
    position: absolute; left: 50%; width: 9px; height: 1px;
    background: rgba(255,46,136,.6); transform: translateX(-50%);
  }
  #scope .mil.m1 { top: calc(50% + 26px); }
  #scope .mil.m2 { top: calc(50% + 46px); width: 7px; }
  #scope .mil.m3 { top: calc(50% + 66px); width: 5px; }

  /* A hairline between the two views, so the split reads as two windows rather than as one
     confusing panorama. */
  #splitLine {
    position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; z-index: 5;
    background: linear-gradient(to bottom, transparent, rgba(53,240,224,.35), transparent);
    pointer-events: none; display: none;
  }
  #splitLine.show { display: block; }

  #quality {
    position: absolute; right: 10px; bottom: 8px; z-index: 6;
    font-family: var(--font-mono); font-size: 10px; letter-spacing: .1em;
    color: var(--text-faint); text-transform: uppercase; pointer-events: none;
  }
</style>
</head>
<body>

<div id="hud">
  <div id="levelName"><span class="tag">Level 1</span><span id="levelTitle">—</span></div>
  <div id="gate">
    <span class="label">Gate</span>
    <div id="slots"></div>
  </div>
  <div id="survivalHud">
    <span class="label">Survived</span>
    <span id="clock" class="val">0.0s</span>
    <span class="label">Wave</span>
    <span id="waveVal" class="val">0</span>
    <span class="label">Saws</span>
    <span id="sawVal" class="val">0</span>
  </div>
  <div id="sniperHud">
    <span class="label">Nest</span>
    <span id="nestName" class="val">—</span>
    <span class="label">Rifle</span>
    <span id="rifleState" class="val">ready</span>
    <span class="label">Runners</span>
    <span id="runnersLeft" class="val">0</span>
  </div>
  <div id="callsHud">
    <span class="label">Round</span>
    <span id="callRound" class="val">0</span>
    <span class="label">Call</span>
    <span id="callSym" class="val sym">—</span>
    <span id="callClock" class="val">—</span>
  </div>
  <div id="roster"></div>
</div>

<div id="stage">
  <canvas id="c"></canvas>
  <div id="dread"></div>
  <div id="quality"></div>
  <!-- The scope. A CSS overlay on the right half rather than geometry in the scene, because
       a reticle has to stay pin-sharp and screen-aligned — modelled in 3D it would swim with
       the camera and blur at the exact moment the sniper is trying to place a shot. -->
  <div id="scope">
    <div class="ring"></div>
    <div class="cross v"></div>
    <div class="cross h"></div>
    <div class="mil m1"></div>
    <div class="mil m2"></div>
    <div class="mil m3"></div>
  </div>
  <div id="splitLine"></div>
  <div id="overlay">
    <div class="ring"></div>
    <div class="sub">Waiting for players…</div>
  </div>
</div>

<script src="/sdk.js"></script>
<script type="module">
import * as THREE from "/vendor/three.js?v=5";
import * as sim from "/games/minefield3d/sim.js?v=19";
import { LEVELS, getLevel, ARENAS, getArena, STAGES, getStage, RANGES, getRange } from "/games/minefield3d/levels.js?v=9";
import {
  createScene, updateCamera, updateArenaCamera, updateCallCamera, updateFloor, setGateOpen, resize,
  updateCallTiles, updateCallBoard,
  buildCover, updateSniper, updateSniperCamera, updateRangeCamera, renderSplit,
  buildMineField, updateMineField,
  createPlayerMesh, posePlayer, createKillerMesh, loadAvatar, setAvatar, createBloodSplat,
  setAvatarHeight, createRoombaMesh, updateRoombaMesh,
  createPingRing, updatePingRing, createBlast, stepBlast, createPrintMesh,
} from "/games/minefield3d/scene.js?v=35";
import {
  TIERS, QUALITY_CHOICES, DEFAULT_QUALITY, resolveTier, makeFpsWatchdog,
} from "/games/minefield3d/quality.js?v=5";

const freeconsole = new FreeConsole();

/* ------------------------------------------------------------ test harness */

// ?test=1 runs the aisle with keyboard players and no shell behind it, so the sim and the
// scene can be reloaded on every edit without re-joining a room. ?bots=N adds N extra
// players that walk on their own, which is the only way to see per-player sonar overlap
// without six phones.
const params = new URLSearchParams(location.search);
const TEST = params.has("test");
const BOTS = Math.max(0, Math.min(7, parseInt(params.get("bots") || "0", 10) || 0));

// ?sizes=1 lines up ten ninjas at the spawn line, each a different height, with its number
// and height labelled. It exists to settle by eye what the avatar scale should be — the
// right answer depends on the camera, and no amount of measuring substitutes for looking.
const SIZES = params.has("sizes");

function safeCall(fn, fallback) {
  try { return fn(); } catch (err) { return fallback; }
}
function nameOf(id) {
  return safeCall(() => freeconsole.getNickname(id), "Player " + id) || ("Player " + id);
}
function colorOf(id) {
  return safeCall(() => freeconsole.getPlayerColor(id), "#35f0e0") || "#35f0e0";
}
function colorHexOf(id) {
  const v = safeCall(() => freeconsole.getPlayerColorHex(id), null);
  if (typeof v === "number") return v;
  return parseInt(colorOf(id).replace("#", ""), 16) || 0x35f0e0;
}

/* ----------------------------------------------------------------- quality */

const QUALITY_KEY = "minefield3d.quality";

function loadQualityChoice() {
  try {
    const stored = localStorage.getItem(QUALITY_KEY);
    // A stored "auto" is ignored on purpose. It was this game's original default, so every
    // browser that ever opened it has one saved without anybody having chosen it — honouring
    // that would mean the new default never reaches the machines it exists for. An explicit
    // tier is a real decision and is always kept.
    if (stored && stored !== "auto" && QUALITY_CHOICES.includes(stored)) return stored;
  } catch (err) { /* private mode — fall through */ }
  return DEFAULT_QUALITY;
}
function saveQualityChoice(choice) {
  try { localStorage.setItem(QUALITY_KEY, choice); } catch (err) { /* not fatal */ }
}

let qualityChoice = loadQualityChoice();
let { name: tierName, config: Q } = resolveTier(qualityChoice);
document.getElementById("quality").textContent = tierName;

/* -------------------------------------------------------------------- setup */

/**
 * Which game this is. Escape crosses an aisle to a gate; survival outlasts saw roombas in a
 * closed room. The mode owns which table of levels is in play, so every "how many levels are
 * there" question has to go through modeLevels() rather than reading LEVELS directly.
 */
let mode = sim.MODES.includes(params.get("mode")) ? params.get("mode") : sim.MODE_ESCAPE;

function isSurvival() { return mode === sim.MODE_SURVIVAL; }
function isCalls() { return mode === sim.MODE_CALLS; }
function isSniper() { return mode === sim.MODE_SNIPER; }

/** The level table, the getter and the HUD noun for each mode, in one place. */
const MODE_TABLE = {
  [sim.MODE_ESCAPE]: { list: () => LEVELS, get: getLevel, noun: "Level " },
  [sim.MODE_SURVIVAL]: { list: () => ARENAS, get: getArena, noun: "Arena " },
  [sim.MODE_CALLS]: { list: () => STAGES, get: getStage, noun: "Stage " },
  [sim.MODE_SNIPER]: { list: () => RANGES, get: getRange, noun: "Range " },
};

function modeInfo() { return MODE_TABLE[mode] || MODE_TABLE[sim.MODE_ESCAPE]; }
function modeLevels() { return modeInfo().list(); }
function modeLevel(i) { return modeInfo().get(i); }

let levelIndex = 0;
let round = sim.createRound(levelIndex, (Math.random() * 0xffffffff) >>> 0, mode);

const canvas = document.getElementById("c");
const overlay = document.getElementById("overlay");
const dread = document.getElementById("dread");
const rosterEl = document.getElementById("roster");
const slotsEl = document.getElementById("slots");
const gateEl = document.getElementById("gate");
const survivalHud = document.getElementById("survivalHud");
const callsHud = document.getElementById("callsHud");
const sniperHud = document.getElementById("sniperHud");
const scopeEl = document.getElementById("scope");
const splitLineEl = document.getElementById("splitLine");
const nestNameEl = document.getElementById("nestName");
const rifleStateEl = document.getElementById("rifleState");
const runnersLeftEl = document.getElementById("runnersLeft");
const callRoundEl = document.getElementById("callRound");
const callSymEl = document.getElementById("callSym");
const callClockEl = document.getElementById("callClock");
const clockEl = document.getElementById("clock");
const waveEl = document.getElementById("waveVal");
const sawEl = document.getElementById("sawVal");

let ctx = createScene(canvas, round.level, Q, mode);
resize(ctx, canvas);
addEventListener("resize", () => resize(ctx, canvas));

/** Per-device visuals, keyed by device id — never by array position. */
const bodies = new Map();     // id -> { group, body, mat, lamp, glow }
const rings = new Map();      // id -> { mesh, mat }
const printMeshes = [];       // { mesh, mat, print }
const blasts = [];
const splats = [];            // permanent blood decals, oldest first

/**
 * Survival's machines, keyed by the sim's roomba id.
 *
 * Keyed rather than indexed for the same reason players are: the sim's array is spliced when
 * a round restarts and appended to on every wave, so a positional mapping would silently
 * repaint one machine as another.
 */
const roombaMeshes = new Map();

// The crusher spans the aisle, so its geometry depends on the level's width and it is
// rebuilt whenever the scene is.
let killer = createKillerMesh(Q, round.level);
ctx.world.add(killer.group);
killer.group.visible = false;

// Every mine as one instanced draw call. Rebuilt with the scene, since its capacity is the
// aisle's tile count.
let cover = null;
let mineField = buildMineField(round, sim, Q);
ctx.world.add(mineField.mesh);

/** Rebuild every scene object that depends on the quality tier. */
/**
 * How tall a player stands, per mode.
 *
 * The 2.5 default was chosen by eye against a 30-tile aisle viewed down its length, where a
 * figure has to be enormous to read at all. A 6×4 board framed head-on is the opposite problem:
 * at that height a ninja is taller than two tiles, hides the symbol it is standing on, and
 * makes it impossible to tell which square anyone is actually occupying — which is the only
 * thing that matters in this mode.
 */
const AVATAR_HEIGHTS = {
  [sim.MODE_ESCAPE]: 2.5,
  [sim.MODE_SURVIVAL]: 2.5,
  [sim.MODE_CALLS]: 0.95,
  // The range is long and the runners are seen from a distance and through a scope. They need
  // to be big enough to pick out at forty tiles, but not so big they dwarf 1.6-tile cover.
  [sim.MODE_SNIPER]: 1.7,
};

function rebuildScene() {
  // Drop the old renderer's GPU resources before making another one, or switching tiers a
  // few times leaks a context per switch and the browser kills the canvas.
  const old = ctx;
  // Set before any body is built, since the scale is baked into each mesh at creation.
  setAvatarHeight(AVATAR_HEIGHTS[mode] || 2.5);
  ctx = createScene(canvas, round.level, Q, mode);
  resize(ctx, canvas);
  old.renderer.dispose();

  bodies.clear();
  rings.clear();
  printMeshes.length = 0;
  blasts.length = 0;
  splats.length = 0;   // the old scene owned their meshes; it is being disposed wholesale
  // The machines belong to the disposed scene. Cleared rather than re-parented so the frame
  // loop rebuilds them from the sim, which is the only thing that knows how many there are.
  roombaMeshes.clear();

  // Rebuilt rather than re-parented: its width is the aisle's width, so carrying the old one
  // across a level change would leave a crusher sized for the previous aisle.
  killer = createKillerMesh(Q, round.level);
  killer.group.visible = false;
  ctx.world.add(killer.group);

  mineField = buildMineField(round, sim, Q);
  // Nothing to show in an arena, and updateMineField never runs there to correct the count.
  mineField.mesh.visible = mode === sim.MODE_ESCAPE;
  ctx.world.add(mineField.mesh);

  // Cover is static for the whole round, so it is built once here rather than touched per
  // frame — the only per-frame sniper work is the rifle and the laser.
  cover = isSniper() ? buildCover(round, sim, Q) : null;
  if (cover) ctx.world.add(cover.group);

  for (const id of round.players.keys()) ensureBody(id);
  setGateOpen(ctx, round.exitOpen);
  document.getElementById("quality").textContent = tierName;

  // The wash quantises against the tier's step count, so a cached step from the old tier
  // means a different number — force the next frame to write rather than compare.
  dreadStep = -1;
}

function applyQuality(choice) {
  qualityChoice = choice;
  saveQualityChoice(choice);
  const resolved = resolveTier(choice);
  tierName = resolved.name;
  Q = resolved.config;
  rebuildScene();
  broadcastState(true);
}

const watchdog = makeFpsWatchdog({
  onDrop(fps) {
    // Only ever steps down, and only on "auto" — an admin who chose High means it.
    if (qualityChoice !== "auto") return;
    const order = ["high", "medium", "low"];
    const next = order[Math.min(order.length - 1, order.indexOf(tierName) + 1)];
    if (next === tierName) return;
    tierName = next;
    Q = TIERS[next];
    rebuildScene();
  },
});

function ensureBody(id) {
  if (bodies.has(id)) return bodies.get(id);
  const hex = colorHexOf(id);
  const mesh = createPlayerMesh(hex, Q);
  // Which leg this player loses first, derived from the device id so it is stable across
  // rounds and never appears to swap sides.
  mesh.dropSide = id % 2;
  ctx.world.add(mesh.group);
  bodies.set(id, mesh);

  const ring = createPingRing(hex);
  ctx.world.add(ring.mesh);
  rings.set(id, ring);
  return mesh;
}

function dropBody(id) {
  const mesh = bodies.get(id);
  if (mesh) { ctx.world.remove(mesh.group); bodies.delete(id); }
  const ring = rings.get(id);
  if (ring) { ctx.world.remove(ring.mesh); rings.delete(id); }
}

/* ------------------------------------------------------------------- roster */

function joinPlayer(deviceId) {
  // Already seated — a reconnect after a phone reload, or a duplicate onConnect. Keep the
  // seat and everything in it (position, legs, state); only drop whatever the dead session
  // left held, since a stale key is what makes a player refuse to move on the way back.
  //
  // The one thing that must happen is a *forced* re-broadcast: the returning controller has
  // no state at all, and the change-keyed broadcast would otherwise stay silent until some
  // unrelated thing happened, leaving that phone showing "Connecting…" for the rest of the
  // round. This is the reload bug.
  if (round.players.has(deviceId)) {
    sim.clearInput(round, deviceId);
    ensureBody(deviceId);
    renderRoster();
    broadcastState(true);
    return;
  }

  const p = sim.addPlayer(round, deviceId);

  // Joining mid-round must not drop somebody into the middle of a live minefield at the
  // default spawn. They sit the round out and are seated properly by the next startRound.
  if (round.phase === "running") p.state = sim.WAITING;

  ensureBody(deviceId);
  renderRoster();
  renderSlots();
  if (round.phase === "briefing") maybeStart();
  broadcastState(true);
}

function leavePlayer(deviceId) {
  if (!round.players.has(deviceId)) return;
  sim.removePlayer(round, deviceId);
  dropBody(deviceId);
  renderRoster();
  if (round.players.size === 0 && round.phase === "running") {
    round.phase = "briefing";
    showWaiting();
  }
  broadcastState();
}

let countdown = 0;
let countdownTimer = null;

/** Set by the ?sizes=1 harness, which owns the scene and must not have rounds started under it. */
let roundsSuspended = false;

function maybeStart() {
  if (roundsSuspended) return;
  if (round.players.size === 0) { showWaiting(); return; }
  if (round.phase === "running" || countdownTimer) return;
  safeCall(() => freeconsole.setActivePlayers());
  countdown = 4;
  tickCountdown();
  countdownTimer = setInterval(tickCountdown, 1000);
}

function tickCountdown() {
  if (countdown > 0) {
    showOverlay(String(countdown), modeLevel(levelIndex).tagline, false);
    countdown--;
    return;
  }
  clearInterval(countdownTimer);
  countdownTimer = null;
  sim.startRound(round);
  showOverlay(null);
  renderRoster();
  renderSlots();
  broadcastState(true);
}

function loadLevel(index) {
  levelIndex = Math.max(0, Math.min(modeLevels().length - 1, index));
  const ids = [...round.players.keys()];
  round = sim.createRound(levelIndex, (Math.random() * 0xffffffff) >>> 0, mode);
  for (const id of ids) sim.addPlayer(round, id);

  document.getElementById("levelTitle").textContent = modeLevel(levelIndex).name;
  document.querySelector("#levelName .tag").textContent =
    modeInfo().noun + (levelIndex + 1);

  // The aisle's dimensions change between levels, so the whole scene is rebuilt.
  rebuildScene();
  renderSlots();
  renderRoster();
}

/**
 * Seconds since the last aim message, for integrating the rifle's swing.
 *
 * Aim arrives as a stream of stick positions, not as deltas, so the turn has to be integrated
 * against real elapsed time. Measured on the screen because it is the only clock both halves
 * of the game agree on — and because a phone that lies about dt would otherwise be able to
 * snap the rifle anywhere instantly.
 */
let lastAimAt = 0;
function aimDt() {
  const now = performance.now();
  const dt = lastAimAt ? (now - lastAimAt) / 1000 : 1 / 30;
  lastAimAt = now;
  return dt;
}

/**
 * Advance to the next round, from the end card.
 *
 * Escape advances on somebody getting out. Survival and calls advance on somebody being the
 * last one standing — in a room where everyone died to the opening pack, the next level would
 * just be a harder way to lose the same way, so a wipe replays the current one.
 *
 * Shared by the controller's "again" message and by the test harness, because a transition
 * that only one of the two exercises is a transition that only one of them is known to work.
 */
function playAgain() {
  if (round.phase !== "over") return false;
  const won = mode === sim.MODE_ESCAPE ? round.escapedOrder.length > 0 : round.winner !== null;
  const advance = won && levelIndex + 1 < modeLevels().length;

  // The nest is the prize. Whoever won this round takes it next round, which puts the best
  // player behind the rifle and everyone else in front of it — the mode self-balances instead
  // of needing a handicap. A round nobody won leaves the nest where it is.
  const nextSniper = isSniper()
    ? (round.escapedOrder.length ? round.escapedOrder[0] : round.sniperId)
    : null;

  loadLevel(advance ? levelIndex + 1 : levelIndex);
  if (isSniper() && nextSniper !== null) round.sniperId = nextSniper;
  maybeStart();
  return true;
}

/**
 * Switch modes, from the master controller.
 *
 * Always drops back to the first level of the new mode: the two tables are different lengths
 * and index 3 of LEVELS has no counterpart in ARENAS, so carrying the index across would
 * silently clamp and land somewhere nobody chose.
 */
function setMode(next) {
  if (!sim.MODES.includes(next)) return;
  if (next === mode) return;

  mode = next;
  if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }

  loadLevel(0);
  // A mode switch always returns to briefing, even from the middle of a live round — the sim
  // it was running no longer exists.
  round.phase = "briefing";
  showWaiting();
  broadcastState(true);
  maybeStart();
}

/* ---------------------------------------------------------------- shell wiring */

freeconsole.onReady = function () {
  safeCall(() => freeconsole.setActivePlayers());
  for (const id of safeCall(() => freeconsole.getControllerDeviceIds(), []) || []) joinPlayer(id);
  renderRoster();
};

freeconsole.onConnect = joinPlayer;
freeconsole.onDisconnect = leavePlayer;

freeconsole.onMessage = function (deviceId, data) {
  if (!data) return;

  if (data.t === "hold") { sim.setInput(round, deviceId, data.k, data.v); return; }
  if (data.t === "axis") { sim.setAxis(round, deviceId, data.x, data.z); return; }
  if (data.t === "release") { sim.clearInput(round, deviceId); return; }
  // Sniper controls. Each is gated inside the sim on whether this device is actually in the
  // nest, so a runner's phone sending "fire" does nothing.
  if (data.t === "aim") {
    // dt is taken from the screen's own clock rather than the phone's: a controller could
    // otherwise claim an enormous delta and slew the rifle across the aisle in one message.
    sim.aim(round, deviceId, data.x, data.z, Math.min(0.05, aimDt()));
    return;
  }
  if (data.t === "scope") { sim.setScoped(round, deviceId, !!data.on); return; }
  if (data.t === "fire") {
    if (sim.fire(round, deviceId)) shake = Math.min(1, shake + 0.25);
    return;
  }

  if (data.t === "push") {
    // The sim validates everything — reach, arc, cooldown, whether this device is even alive.
    // The phone only ever says "I tapped push"; it never asserts who it hit.
    sim.push(round, deviceId);
    return;
  }

  if (data.t === "quality" && QUALITY_CHOICES.includes(data.choice)) {
    // Only the master controller may change the tier, so six phones cannot fight over it.
    const master = safeCall(() => freeconsole.getMasterControllerDeviceId(), deviceId);
    if (master !== undefined && deviceId !== master) return;
    applyQuality(data.choice);
    return;
  }

  if (data.t === "mode" && sim.MODES.includes(data.mode)) {
    // Master only, exactly like the quality switch — a mode change restarts the round for
    // everybody, so it is not a thing six phones may fight over.
    const master = safeCall(() => freeconsole.getMasterControllerDeviceId(), deviceId);
    if (master !== undefined && deviceId !== master) return;
    setMode(data.mode);
    return;
  }

  if (data.t === "again" && round.phase === "over") {
    const master = safeCall(() => freeconsole.getMasterControllerDeviceId(), deviceId);
    if (master !== undefined && deviceId !== master) return;
    playAgain();
  }
};

/**
 * State goes out on change, never per frame. Controllers need to know whether they can move,
 * how fast they are, and when their own next ping lands — not where anything is.
 */
let lastStateKey = "";
function broadcastState(force) {
  const legs = {};
  const states = {};
  for (const [id, p] of round.players) { legs[id] = p.legs; states[id] = p.state; }

  const survival = isSurvival();
  const calls = isCalls();
  // Only escape has a gate; the other two send capacity 0 so the controller's slot row
  // renders empty rather than showing a door that does not exist.
  const gated = mode === sim.MODE_ESCAPE;

  const key = JSON.stringify([
    round.phase, legs, states, round.exitOpen, round.exitUsed, levelIndex, mode,
    round.level.exitCapacity, round.level.sonarPeriod, qualityChoice, tierName,
    survival ? round.wave : 0, survival ? round.roombas.length : 0,
    // The called symbol goes out on change, not the countdown that follows it — the phone
    // runs its own clock off `callSeconds`, exactly as it does for the sonar period.
    calls ? round.callRound : 0, calls ? round.called : null, calls ? round.callPhase : "",
    isSniper() ? round.sniperId : null, isSniper() ? round.reload > 0 : false,
    // The scope goes in the key so the phone's own toggle is echoed back and confirmed. It is
    // in the payload either way, and without it here a phone that reloaded mid-round is told
    // "scoped: false" once and never corrected.
    isSniper() ? round.scoped : false,
    round.escapedOrder.length,
  ]);
  if (!force && key === lastStateKey) return;
  lastStateKey = key;

  safeCall(() => freeconsole.broadcast({
    phase: round.phase,
    mode,
    legs,
    states,
    // Survival has no gate. Sent as capacity 0 so the controller's slot row renders empty
    // rather than showing a door that does not exist.
    exitOpen: gated ? round.exitOpen : false,
    exitLeft: gated ? Math.max(0, round.level.exitCapacity - round.exitUsed) : 0,
    exitCapacity: gated ? round.level.exitCapacity : 0,
    sonarPeriod: round.level.sonarPeriod,
    level: levelIndex + 1,
    levelName: modeLevel(levelIndex).name,
    wave: survival ? round.wave : 0,
    saws: survival ? round.roombas.length : 0,
    // Calls: which symbol is up, how long it was given, and where the cycle is. The phone
    // shows the letter so a player can glance down instead of up, which matters most in the
    // back row where the wall screen is furthest away.
    // Sniper: the phone needs to know whether it is holding a rifle or a pair of legs, since
    // that changes its entire control surface.
    // Whether anyone got through, so the sniper's phone can tell them if they held the aisle.
    escapedAny: round.escapedOrder.length > 0,
    sniper: isSniper() ? {
      id: round.sniperId,
      name: round.sniperId === null ? null : nameOf(round.sniperId),
      reload: round.reload > 0,
      scoped: round.scoped,
    } : null,
    call: calls ? {
      round: round.callRound,
      symbol: round.called === null ? null : (round.called === sim.SYM_O ? "O" : "X"),
      phase: round.callPhase,
      seconds: round.callTime,
    } : null,
    quality: { choice: qualityChoice, tier: tierName, choices: QUALITY_CHOICES },
    modes: { current: mode, choices: sim.MODES },
  }));
}

/* ---------------------------------------------------------------------- hud */

function renderRoster() {
  const ids = [...round.players.keys()].sort((a, b) => a - b);
  rosterEl.innerHTML = "";
  for (const id of ids) {
    const p = round.players.get(id);
    const chip = document.createElement("div");
    chip.className = "chip";
    if (p.state === sim.DEAD) chip.classList.add("dead");
    if (p.state === sim.ESCAPED) chip.classList.add("out");
    if (p.state === sim.WAITING) chip.classList.add("waiting");
    if (p.state === sim.ALIVE && p.legs === 1) chip.classList.add("hurt");
    if (p.state === sim.ALIVE && p.legs === 0) chip.classList.add("crawl");
    chip.style.color = colorOf(id);

    const label = p.state === sim.ESCAPED ? "OUT"
      : p.state === sim.DEAD ? "✕"
      : p.state === sim.WAITING ? "next"
      : p.legs === 2 ? "▮▮" : p.legs === 1 ? "▮" : "crawl";

    chip.innerHTML = "<span>" + escapeHtml(nameOf(id)) + '</span><span class="legs">' + label + "</span>";
    rosterEl.appendChild(chip);
  }
}

function renderSlots() {
  // The three modes own the same strip of HUD: escape shows the gate's remaining capacity,
  // survival the clock and the wave, calls the round and the countdown. Exactly one is visible.
  const survival = isSurvival();
  const calls = isCalls();
  const sniper = isSniper();
  // The range keeps the gate row — the runners are racing to it — alongside its own readout.
  gateEl.style.display = survival || calls ? "none" : "";
  survivalHud.classList.toggle("show", survival);
  callsHud.classList.toggle("show", calls);
  sniperHud.classList.toggle("show", sniper);
  splitLineEl.classList.toggle("show", sniper);
  if (!sniper) scopeEl.classList.remove("show");
  if (survival || calls) return;

  const cap = round.level.exitCapacity;
  slotsEl.innerHTML = "";
  for (let i = 0; i < cap; i++) {
    const s = document.createElement("div");
    s.className = "slot" + (i < round.exitUsed ? " used" : "");
    slotsEl.appendChild(s);
  }
  gateEl.classList.toggle("closed", !round.exitOpen);
}

/**
 * The survival clock, ticked from the frame loop rather than from broadcasts.
 *
 * It is the score, so it has to move continuously — driving it off the change-keyed broadcast
 * would step it once a second at best and make the one number the mode is about look frozen.
 */
/**
 * The calls readout, ticked from the frame loop for the same reason the survival clock is:
 * the countdown is the tension, and stepping it once per broadcast would look frozen.
 */
function renderCallsHud() {
  if (!isCalls()) return;
  callRoundEl.textContent = String(round.callRound);

  const showing = round.called !== null && round.callPhase === sim.CALL_SHOWING;
  if (showing) {
    const isO = round.called === sim.SYM_O;
    callSymEl.textContent = isO ? "O" : "X";
    callSymEl.classList.toggle("o", isO);
    callClockEl.textContent = Math.max(0, round.callLeft).toFixed(1);
    callsHud.classList.toggle("hot", round.callLeft < round.callTime * 0.28);
  } else {
    // Between calls there is deliberately nothing to read. A stale symbol left up during the
    // drop is worse than a dash — players glance at it and move toward an answer that has
    // already been resolved.
    callSymEl.textContent = "—";
    callSymEl.classList.remove("o");
    callClockEl.textContent = "—";
    callsHud.classList.remove("hot");
  }
}

/** The nest readout, ticked from the frame loop so the reload clock is continuous. */
function renderSniperHud() {
  if (!isSniper()) return;
  nestNameEl.textContent = round.sniperId === null ? "—" : nameOf(round.sniperId);

  const reloading = round.reload > 0;
  rifleStateEl.textContent = reloading ? round.reload.toFixed(1) + "s" : "ready";
  sniperHud.classList.toggle("reloading", reloading);

  let left = 0;
  for (const p of round.players.values()) {
    if (p.state === sim.ALIVE && sim.isRunner(round, p)) left++;
  }
  runnersLeftEl.textContent = String(left);

  scopeEl.classList.toggle("show", round.scoped);
}

function renderSurvivalHud() {
  if (!isSurvival()) return;
  clockEl.textContent = round.t.toFixed(1) + "s";
  waveEl.textContent = String(round.wave);
  sawEl.textContent = String(round.roombas.length);
  // Turns hot once the room is genuinely crowded, as an at-a-glance read on how bad it is.
  survivalHud.classList.toggle("hot", round.roombas.length >= round.level.maxRoombas * 0.7);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}

function showOverlay(big, sub, bad) {
  if (big === null) { overlay.classList.add("hidden"); return; }
  overlay.classList.remove("hidden");
  overlay.innerHTML =
    '<div class="big' + (bad ? " bad" : "") + '">' + escapeHtml(big) + "</div>" +
    '<div class="sub">' + escapeHtml(sub || "") + "</div>";
}

function showWaiting() {
  overlay.classList.remove("hidden");
  overlay.innerHTML = '<div class="ring"></div><div class="sub">Waiting for players…</div>';
}

function showResults() {
  if (isSurvival()) { showSurvivalResults(); return; }
  if (isCalls()) { showCallsResults(); return; }

  const escaped = round.escapedOrder;
  // Spectators — phones that joined or reloaded mid-round — are in neither column. They did
  // not get out and they were never in danger, so listing them either way is a lie.
  const lost = [...round.players.values()]
    .filter((p) => p.state !== sim.ESCAPED && p.state !== sim.WAITING);

  let rows = "";
  escaped.forEach((id, i) => {
    rows += "<div><b>" + (i + 1) + ". " + escapeHtml(nameOf(id)) + "</b> — through the gate</div>";
  });
  for (const p of lost) rows += "<div>" + escapeHtml(nameOf(p.id)) + " — left in the aisle</div>";

  const anyOut = escaped.length > 0;
  const more = levelIndex + 1 < LEVELS.length;

  overlay.classList.remove("hidden");
  overlay.innerHTML =
    '<div class="big' + (anyOut ? "" : " bad") + '">' +
      (anyOut ? "The gate closes" : "Nobody made it") + "</div>" +
    '<div class="roll">' + rows + "</div>" +
    '<div class="sub">' +
      (anyOut
        ? (more ? "Tap to walk into the next one." : "That was the last aisle. Tap to run it again.")
        : "Tap to try this aisle again.") +
    "</div>";
}

/**
 * Survival's end card: a leaderboard by time survived.
 *
 * Ranked rather than listed. Escape has a natural ordering built into the fiction — you got
 * out or you did not — but survival's only fact is how long each person lasted, so the board
 * has to say it explicitly or the round has no outcome at all.
 */
/**
 * Calls' end card: ranked by time survived, but headlined by rounds.
 *
 * The ranking still comes from survivalRanking — going down later is going down later, and the
 * two modes agree on that. What differs is the number a player actually cares about: "I lasted
 * nine calls" is the sentence people say out loud, where the seconds are just how the ordering
 * happens to be computed.
 */
function showCallsResults() {
  const ranked = sim.survivalRanking(round);
  const champ = ranked.length ? ranked[0] : null;
  const survived = !!champ && champ.alive;

  let rows = "";
  ranked.forEach((entry, i) => {
    const label = escapeHtml(nameOf(entry.id)) + " — " + entry.time.toFixed(1) + "s";
    rows += i === 0
      ? "<div><b>" + (i + 1) + ". " + label + "</b>" + (entry.alive ? " — still standing" : "") + "</div>"
      : "<div>" + (i + 1) + ". " + label + "</div>";
  });

  const more = levelIndex + 1 < modeLevels().length;

  overlay.classList.remove("hidden");
  overlay.innerHTML =
    '<div class="big' + (survived ? "" : " bad") + '">' +
      (survived ? "Last one standing" : "The floor wins") + "</div>" +
    '<div class="sub">' + round.callRound + " call" + (round.callRound === 1 ? "" : "s") +
      " survived</div>" +
    '<div class="roll">' + rows + "</div>" +
    '<div class="sub">' +
      (survived
        ? (more ? "Tap for a faster board." : "That was the last board. Tap to run it again.")
        : "Tap to step back on.") +
    "</div>";
}

function showSurvivalResults() {
  const ranked = sim.survivalRanking(round);
  const champ = ranked.length ? ranked[0] : null;
  const lasted = champ ? champ.time : round.t;

  let rows = "";
  ranked.forEach((entry, i) => {
    const label = escapeHtml(nameOf(entry.id)) + " — " + entry.time.toFixed(1) + "s";
    rows += i === 0
      ? "<div><b>" + (i + 1) + ". " + label + "</b>" + (entry.alive ? " — still standing" : "") + "</div>"
      : "<div>" + (i + 1) + ". " + label + "</div>";
  });

  const survived = !!champ && champ.alive;
  const more = levelIndex + 1 < modeLevels().length;

  overlay.classList.remove("hidden");
  overlay.innerHTML =
    '<div class="big' + (survived ? "" : " bad") + '">' +
      (survived ? "Last one standing" : "The floor wins") + "</div>" +
    '<div class="sub">' + lasted.toFixed(1) + "s · wave " + round.wave +
      " · " + round.roombas.length + " saws on the floor</div>" +
    '<div class="roll">' + rows + "</div>" +
    '<div class="sub">' +
      (survived
        ? (more ? "Tap for a worse room." : "That was the last room. Tap to run it again.")
        : "Tap to go back in.") +
    "</div>";
}

/* ------------------------------------------------------------------- effects */

function drainEvents() {
  for (const e of round.events) {
    if (e.type === "blast") {
      const fx = createBlast(Q);
      fx.group.position.set(e.x, 0, e.z);
      ctx.world.add(fx.group);
      blasts.push(fx);

      // Blood stays. The crater is where the mine was; the splatter is what it cost, and it
      // marks the tile as already spent for anyone reading the ground later.
      if (Q.craterDecals) {
        const splat = createBloodSplat();
        splat.group.position.set(e.x, 0, e.z);
        splat.group.rotation.y = Math.random() * Math.PI * 2;
        ctx.world.add(splat.group);
        splats.push(splat);
        // Cap the count so a long round cannot accumulate unbounded geometry.
        if (splats.length > 40) {
          const old = splats.shift();
          ctx.world.remove(old.group);
          old.group.traverse((o) => { if (o.geometry) o.geometry.dispose(); });
          old.mat.dispose();
        }
      }

      shake = Math.min(1, shake + 0.9);
      renderRoster();
      broadcastState();
    } else if (e.type === "saw") {
      // A saw hit gets a short kick and a splat, but deliberately less of both than a mine —
      // it happens far more often, and a full blast shake every time would be unwatchable.
      shake = Math.min(1, shake + 0.35);
      if (Q.craterDecals) {
        const splat = createBloodSplat();
        splat.group.position.set(e.x, 0, e.z);
        splat.group.rotation.y = Math.random() * Math.PI * 2;
        splat.group.scale.setScalar(0.6);
        ctx.world.add(splat.group);
        splats.push(splat);
        if (splats.length > 40) {
          const old = splats.shift();
          ctx.world.remove(old.group);
          old.group.traverse((o) => { if (o.geometry) o.geometry.dispose(); });
          old.mat.dispose();
        }
      }
      renderRoster();
      broadcastState();
    } else if (e.type === "clang") {
      // Nothing is drawn for a collision — the machines changing direction is the whole tell.
      // Only the real machine-on-machine hits kick the camera; a shake per wall bounce meant
      // the frame never sat still for a moment in a room with a dozen machines in it.
      if (e.hard) shake = Math.min(1, shake + 0.16);
    } else if (e.type === "wave") {
      shake = Math.min(1, shake + 0.4);
      broadcastState();
    } else if (e.type === "death") {
      renderRoster();
      broadcastState();
    } else if (e.type === "escape") {
      renderRoster();
      renderSlots();
      broadcastState();
    } else if (e.type === "gate-closed") {
      setGateOpen(ctx, false);
      renderSlots();
      shake = Math.min(1, shake + 0.5);
    } else if (e.type === "over") {
      showResults();
      safeCall(() => freeconsole.setActivePlayers(0));
      broadcastState();
    }
  }
  round.events.length = 0;
}

let shake = 0;

/** Footprints are created as they appear in the sim and aged out with it. */
function syncPrints(dt) {
  // New prints since last frame.
  while (printMeshes.length < round.prints.length) {
    const print = round.prints[printMeshes.length];
    const pm = createPrintMesh(colorHexOf(print.id), print.crawl);
    pm.mesh.position.set(print.x, 0.025, print.z);
    pm.print = print;
    ctx.world.add(pm.mesh);
    printMeshes.push(pm);
  }
  // The sim shifts expired prints off the front; drop the matching meshes.
  while (printMeshes.length && !round.prints.includes(printMeshes[0].print)) {
    ctx.world.remove(printMeshes[0].mesh);
    printMeshes.shift();
  }
  for (const pm of printMeshes) {
    pm.mat.opacity = Math.max(0, 0.45 * (1 - pm.print.age / sim.PRINT_LIFE));
  }
}

/**
 * Build, pose and retire the machines to match the sim.
 *
 * Reconciled against the sim's array every frame rather than driven by spawn events, so a
 * scene rebuild — a quality switch mid-round — restores every machine that is still on the
 * floor. Driving it purely from events would leave the room empty until the next wave.
 */
function syncRoombas(dt) {
  const live = new Set();

  for (const r of round.roombas) {
    live.add(r.id);
    let mesh = roombaMeshes.get(r.id);
    if (!mesh) {
      mesh = createRoombaMesh(Q);
      ctx.world.add(mesh.group);
      roombaMeshes.set(r.id, mesh);
    }
    updateRoombaMesh(mesh, r, dt);
  }

  for (const [id, mesh] of roombaMeshes) {
    if (live.has(id)) continue;
    ctx.world.remove(mesh.group);
    roombaMeshes.delete(id);
  }
}

/* --------------------------------------------------------------------- loop */

let last = 0;
let frameBudget = 0;

function frame(ts) {
  requestAnimationFrame(frame);
  if (!last) { last = ts; }

  const dt = Math.min(0.05, (ts - last) / 1000);
  last = ts;

  // Low tier caps the render rate; the sim still steps every rAF so physics never depends
  // on frame rate.
  sim.step(round, dt);
  drainEvents();

  if (Q.targetFps > 0) {
    frameBudget += dt;
    if (frameBudget < 1 / Q.targetFps) return;
    frameBudget = 0;
  }

  watchdog.tick(ts);

  // Bodies and their personal rings.
  for (const [id, p] of round.players) {
    const mesh = bodies.get(id) || ensureBody(id);
    mesh.group.visible = p.state !== sim.ESCAPED && p.state !== sim.WAITING;
    posePlayer(mesh, p, sim, dt, round);

    const ring = rings.get(id);
    if (ring) updatePingRing(ring, p.ping, round.level);
  }

  if (isSurvival()) {
    // The crusher does not exist in this mode.
    killer.group.visible = false;
    syncRoombas(dt);
    renderSurvivalHud();
  } else if (isSniper()) {
    // No crusher in the range — the sniper is the threat.
    killer.group.visible = false;
    updateSniper(ctx.nest, ctx.laser, round, sim, dt);
    renderSniperHud();
  } else if (isCalls()) {
    // The aisle crusher is not the one under this stage; that one is scenery built into the
    // scene and needs no per-frame work.
    killer.group.visible = false;
    if (ctx.tiles) updateCallTiles(ctx.tiles, round, sim, dt);
    if (ctx.board) updateCallBoard(ctx.board, round, sim);
    renderCallsHud();
  } else {
    // The crusher, once it is actually in the aisle. It is always centred on the aisle's width
    // — it spans the whole thing, so there is no lateral position to track.
    killer.group.visible = round.killerZ <= round.rows + 1;
    killer.group.position.set(round.cols / 2, 0, round.killerZ);
  }

  syncPrints(dt);

  for (let i = blasts.length - 1; i >= 0; i--) {
    if (!stepBlast(blasts[i], dt)) {
      ctx.world.remove(blasts[i].group);
      blasts.splice(i, 1);
    }
  }


  // Calls has no shared floor mesh at all — its ground is 24 independent tiles.
  if (!isCalls()) updateFloor(ctx, round, sim, ts);
  // Survival lays no mines, so there is nothing for the instanced field to draw. Skipped
  // rather than left to find zero mines every frame — it is a full sweep of the tile grid.
  if (mode === sim.MODE_ESCAPE) updateMineField(mineField, round, sim, Q, ts);

  if (isCalls()) {
    // A fixed shot framing the grid and the wall screen together — both have to be readable at
    // once, since the whole mode is matching one to the other.
    updateCallCamera(ctx, dt);
  } else if (isSniper()) {
    // Two cameras: the aisle behind the runners, and the sniper's own over-the-shoulder view.
    let lead = Infinity;
    let tail = -Infinity;
    for (const p of round.players.values()) {
      if (p.state !== sim.ALIVE || !sim.isRunner(round, p)) continue;
      if (p.z < lead) lead = p.z;
      if (p.z > tail) tail = p.z;
    }
    if (!isFinite(lead)) { lead = round.rows - 2; tail = round.rows - 2; }
    updateRangeCamera(ctx, lead, tail, dt);
    if (ctx.sniperCam) updateSniperCamera(ctx.sniperCam, round, sim, dt);
  } else if (isSurvival()) {
    // A fixed shot of the whole room. There is no pack to follow and no direction that counts
    // as progress, so the camera's job is to hold every machine on screen at once.
    updateArenaCamera(ctx, dt);
  } else {
    // The camera frames the whole surviving pack — from whoever is closest to the gate back to
    // whoever is furthest behind. A camera that tracks only the leader loses every slower
    // player off the bottom of the screen, which is precisely the people worth watching.
    let lead = Infinity;
    let tail = -Infinity;
    for (const p of round.players.values()) {
      if (p.state !== sim.ALIVE) continue;
      if (p.z < lead) lead = p.z;
      if (p.z > tail) tail = p.z;
    }
    if (!isFinite(lead)) { lead = round.rows - 2; tail = round.rows - 2; }
    updateCamera(ctx, lead, tail, dt, round.killerZ);
  }

  if (shake > 0) {
    shake = Math.max(0, shake - dt * 2.6);
    ctx.camera.position.x += (Math.random() - 0.5) * shake * 0.35;
    ctx.camera.position.y += (Math.random() - 0.5) * shake * 0.25;
  }

  updateDread();
  // Sniper draws two viewports; every other mode is a single full-frame render. renderSplit
  // handles both and always hands the renderer back unscissored.
  renderSplit(ctx, canvas);
}

function updateDread() {
  const clear = () => setDread(0);
  if (round.phase !== "running") { clear(); return; }

  let nearest = Infinity;

  if (isCalls()) {
    // The threat here is a deadline, not a distance, so the wash is driven by the clock. It
    // rises through the last third of the call and snaps off the moment the drop resolves —
    // which makes it read as "time is nearly up" rather than as "something is near you".
    const showing = round.called !== null && round.callPhase === sim.CALL_SHOWING;
    if (!showing) { clear(); return; }
    const frac = Math.max(0, Math.min(1, round.callLeft / Math.max(0.001, round.callTime)));
    setDread(Math.max(0, 1 - frac / 0.35) * 0.55);
    return;
  }

  if (isSurvival()) {
    // Distance from any living player to the nearest blade. The vignette is the one cue that
    // works when a player is looking at the far side of the room rather than at themselves.
    for (const p of round.players.values()) {
      if (p.state !== sim.ALIVE) continue;
      for (const r of round.roombas) {
        nearest = Math.min(nearest, Math.hypot(p.x - r.x, p.z - r.z));
      }
    }
    if (!isFinite(nearest)) { clear(); return; }
  } else {
    if (round.killerZ > round.rows) { clear(); return; }
    for (const p of round.players.values()) {
      if (p.state !== sim.ALIVE) continue;
      nearest = Math.min(nearest, Math.abs(p.z - round.killerZ));
    }
    if (!isFinite(nearest)) nearest = 99;
  }

  // Survival's reach is deliberately tight. A saw is only ever a couple of tiles from
  // *somebody* in a room this size, so a generous radius pins the vignette at full strength
  // for the whole round and stops it meaning anything — it has to fire on a blade genuinely
  // being on top of you, not on one being in the room.
  const reach = isSurvival() ? 2.2 : round.rows * 0.35;
  const close = Math.max(0, 1 - nearest / reach);

  // Survival keeps the wash tight and thin. The escape curve assumes one approaching threat
  // and ramps to a half-opaque flood; here there are up to a dozen machines and somebody is
  // nearly always near one, so the same curve pins the screen pink for the whole round and
  // buries the thing it is supposed to be warning about. The tighter gradient shape comes
  // from the .survival class; this only holds the ceiling down.
  setDread(close * (isSurvival() ? 0.6 : 1));
}

/**
 * Writes the wash's strength, quantised to the tier's step count.
 *
 * Two savings on top of the compositor-friendly gradient itself. Skipping the write when
 * nothing changed means a still moment costs zero style recalcs; quantising means a player
 * drifting slowly toward a blade produces a handful of writes rather than one per frame.
 * Neither is visible — the .5s ease on opacity smooths the steps back into a fade.
 */
let dreadStep = -1;
let dreadSurvival = null;
function setDread(level) {
  // Low turns the wash off outright. `display:none` rather than opacity 0 so the layer is
  // not composited at all — an invisible full-screen element still costs a TV fill rate.
  if (!Q.dread) {
    if (dreadStep !== 0) {
      dreadStep = 0;
      dread.style.display = "none";
    }
    return;
  }
  if (dread.style.display === "none") dread.style.display = "";

  // The gradient shape is a class, not a per-frame style, so it is only touched when the
  // mode actually changes — which is at most once per round.
  const survival = isSurvival();
  if (survival !== dreadSurvival) {
    dreadSurvival = survival;
    dread.classList.toggle("survival", survival);
  }

  const steps = Q.dreadSteps || 16;
  const step = Math.round(Math.max(0, Math.min(1, level)) * steps);
  if (step === dreadStep) return;
  dreadStep = step;
  dread.style.opacity = (step / steps).toFixed(3);
}

/* --------------------------------------------------------------------- boot */

loadLevel(0);
showWaiting();
requestAnimationFrame(frame);

// The avatar loads in the background. Until it lands every player is a capsule, which is
// fully playable — so nothing waits on the network and a failed fetch costs only the model.
loadAvatar().then((gltf) => {
  if (!gltf) return;
  // The size harness builds its own line-up at its own scales; rebuilding bodies underneath
  // it would drop them all back to the default height.
  if (SIZES) return;
  setAvatar(gltf);
  // Re-make any bodies that were built before it arrived, at the current mode's scale — the
  // model can land after rebuildScene has already set it, and rebuilding at the default would
  // silently put aisle-sized figures on a 6×4 board.
  setAvatarHeight(AVATAR_HEIGHTS[mode] || 2.5);
  for (const id of [...bodies.keys()]) {
    dropBody(id);
    ensureBody(id);
  }
});

/* --------------------------------------------------------------- test mode */

if (TEST) {
  // ?level=N jumps straight to a level or arena, which is the only practical way to eyeball
  // the later ones — otherwise they are reachable only by actually winning the earlier rounds.
  const want = parseInt(params.get("level") || "0", 10);
  if (want > 0) loadLevel(want - 1);

  sim.addPlayer(round, 1);
  ensureBody(1);
  for (let i = 0; i < BOTS; i++) { const id = 2 + i; sim.addPlayer(round, id); ensureBody(id); }
  renderRoster();
  renderSlots();
  sim.startRound(round);
  showOverlay(null);

  // Expose the live round so a driver script can assert on it. Test mode only.
  //
  // `__round` is re-assigned on every loadLevel, so the plain reference below goes stale the
  // moment a round advances. `__live()` reads the current binding instead — without it a
  // driver testing the turn transition asserts against the round that just ended and sees
  // nothing happen.
  window.__round = round;
  window.__sim = sim;
  window.__ctx = () => ctx;
  window.__live = () => round;
  window.__mode = () => mode;
  /** The exact path the master controller's "tap to continue" takes. */
  window.__again = playAgain;

  const keys = {
    ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
    KeyW: "up", KeyS: "down", KeyA: "left", KeyD: "right",
  };
  addEventListener("keydown", (e) => {
    if (keys[e.code]) { sim.setInput(round, 1, keys[e.code], true); e.preventDefault(); }
    if (e.code === "Enter") {
      loadLevel(levelIndex);
      sim.addPlayer(round, 1);
      ensureBody(1);
      for (let i = 0; i < BOTS; i++) { const id = 2 + i; sim.addPlayer(round, id); ensureBody(id); }
      sim.startRound(round);
      showOverlay(null);
      window.__round = round;
    }
    // Toggle modes from the keyboard, so both games can be driven without a phone.
    if (e.code === "KeyM") {
      setMode(sim.MODES[(sim.MODES.indexOf(mode) + 1) % sim.MODES.length]);
      sim.addPlayer(round, 1);
      ensureBody(1);
      for (let i = 0; i < BOTS; i++) { const id = 2 + i; sim.addPlayer(round, id); ensureBody(id); }
      renderRoster();
      sim.startRound(round);
      showOverlay(null);
      window.__round = round;
    }
    // Cycle quality from the keyboard, so the tiers can be eyeballed without a phone.
    if (e.code === "KeyQ") {
      const i = QUALITY_CHOICES.indexOf(qualityChoice);
      applyQuality(QUALITY_CHOICES[(i + 1) % QUALITY_CHOICES.length]);
    }
  });
  addEventListener("keyup", (e) => {
    if (keys[e.code]) sim.setInput(round, 1, keys[e.code], false);
  });

  // Bots walk toward the gate and sidestep whatever their OWN light has shown them, so the
  // aisle is populated with independent lamps to test overlap against.
  if (BOTS > 0) {
    const memory = new Map();
    setInterval(() => {
      if (round.phase !== "running") return;
      for (let i = 0; i < BOTS; i++) {
        const id = 2 + i;
        const p = round.players.get(id);
        if (!p || p.state !== sim.ALIVE) continue;
        // Calls bots head for the nearest tile bearing the called symbol, which is exactly
        // what a player does — so a bot round exercises the real failure mode: several of
        // them converging on the same safe tile from opposite sides.
        if (isCalls()) {
          if (round.called === null) { sim.setAxis(round, id, 0, 0); continue; }
          let best = null;
          let bestD = Infinity;
          for (let z = 0; z < round.rows; z++) {
            for (let x = 0; x < round.cols; x++) {
              if (sim.tileSymbolAt(round, x, z) !== round.called) continue;
              if (sim.tileStateAt(round, x, z) !== sim.TILE_SOLID) continue;
              const d = Math.hypot(x + 0.5 - p.x, z + 0.5 - p.z);
              if (d < bestD) { bestD = d; best = { x: x + 0.5, z: z + 0.5 }; }
            }
          }
          if (!best || bestD < 0.12) { sim.setAxis(round, id, 0, 0); continue; }
          sim.setAxis(round, id, (best.x - p.x) / bestD, (best.z - p.z) / bestD);
          continue;
        }

        if (!memory.has(id)) memory.set(id, new Set());
        const known = memory.get(id);
        for (let z = 0; z < round.rows; z++) {
          for (let x = 0; x < round.cols; x++) {
            if (sim.mineAt(round, x, z) && sim.tileRevealFor(round, p, x, z) > 0.05) {
              known.add(z * round.cols + x);
            }
          }
        }
        const tx = Math.floor(p.x), tz = Math.floor(p.z);

        // In survival there is nowhere to head for, so the bots run from the nearest blades
        // and from the walls instead of walking the aisle. Same purpose as the escape bots:
        // populate the room with independent lamps and moving targets to watch.
        if (isSurvival()) {
          let fx = 0, fz = 0;
          for (const r of round.roombas) {
            const dx = p.x - r.x, dz = p.z - r.z;
            const d = Math.hypot(dx, dz) || 1;
            if (d > 8) continue;
            const w = 1 / (d * d);
            fx += (dx / d) * w * 9;
            fz += (dz / d) * w * 9;
          }
          const m = 3.5;
          if (p.x < m) fx += (m - p.x) * 0.55;
          if (p.x > round.cols - m) fx -= (p.x - (round.cols - m)) * 0.55;
          if (p.z < m) fz += (m - p.z) * 0.55;
          if (p.z > round.rows - m) fz -= (p.z - (round.rows - m)) * 0.55;
          for (let z = tz - 2; z <= tz + 2; z++) {
            for (let x = tx - 2; x <= tx + 2; x++) {
              if (!known.has(z * round.cols + x)) continue;
              const dx = p.x - (x + 0.5), dz = p.z - (z + 0.5);
              const d = Math.hypot(dx, dz) || 1;
              if (d > 2.2) continue;
              fx += (dx / d) * (1 / (d * d)) * 2.2;
              fz += (dz / d) * (1 / (d * d)) * 2.2;
            }
          }
          const len = Math.hypot(fx, fz);
          if (len < 1e-3) sim.setAxis(round, id, 0, 0);
          else sim.setAxis(round, id, fx / len, fz / len);
          continue;
        }

        const blocked = (x, z) => x < 0 || z < 0 || x >= round.cols || z >= round.rows ||
          known.has(z * round.cols + x);
        for (const d of ["up", "down", "left", "right"]) sim.setInput(round, id, d, false);
        if (!blocked(tx, tz - 1)) sim.setInput(round, id, "up", true);
        else if (!blocked(tx - 1, tz - 1)) { sim.setInput(round, id, "up", true); sim.setInput(round, id, "left", true); }
        else if (!blocked(tx + 1, tz - 1)) { sim.setInput(round, id, "up", true); sim.setInput(round, id, "right", true); }
        else if (!blocked(tx - 1, tz)) sim.setInput(round, id, "left", true);
        else if (!blocked(tx + 1, tz)) sim.setInput(round, id, "right", true);
        else sim.setInput(round, id, "up", true);
      }
    }, 90);
  }
}

/* ------------------------------------------------------- avatar size harness */

/**
 * ?test=1&sizes=1 — ten ninjas across the spawn line, each at a different height.
 *
 * Getting avatar scale right by measurement kept failing: a size that reads well down the
 * aisle is enormous when the camera is right behind that player, and vice versa. This puts
 * every candidate on screen at once, at the position the camera actually starts from, so it
 * can be settled by looking. Each is labelled with its index and its height in tiles.
 */
// Deliberately NOT gated behind ?test=1. This is a look-at-it-and-decide tool, and the
// natural thing to do is append &sizes=1 to the real game running in a real room — which
// silently did nothing while it required test mode as well.
if (SIZES) {
  // Largest first, so the biggest candidates sit nearest the camera. Ordered the other way
  // the tall ones end up at the far end where the aisle runs out and they are clipped off
  // the top of the frame — which is exactly the sizes worth judging.
  const HEIGHTS = [2.5, 2.0, 1.6, 1.35, 1.1, 0.95, 0.8, 0.65, 0.5, 0.35];
  const sizeRigs = [];

  loadAvatar().then((gltf) => {
    if (!gltf) { console.warn("[sizes] avatar failed to load"); return; }
    setAvatar(gltf);

    // Clear the real players so nothing else is on screen.
    for (const id of [...round.players.keys()]) { sim.removePlayer(round, id); dropBody(id); }
    renderRoster();

    // Freeze the round: no crusher, no mines, nothing moving.
    round.phase = "briefing";
    round.killerZ = round.rows + 40;
    round.mines.fill(0);
    killer.group.visible = false;
    showOverlay(null);

    // In a real room the shell keeps connecting phones and the countdown keeps trying to
    // start a round, either of which would seat players on top of the line-up and start the
    // crusher. Neutralise both for as long as the harness is up.
    roundsSuspended = true;
    if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
    freeconsole.onConnect = () => {};
    freeconsole.onDisconnect = () => {};

    // Spread them along the AISLE rather than across it. The aisle is only 11 tiles wide but
    // 30 deep, and a 2.5-unit ninja is over 2.5 tiles across at the arms — packed into eleven
    // lanes the big ones simply overlap and hide the small ones. Marching down the length
    // gives every figure clear air, and seeing them recede is itself useful: it shows how
    // each size holds up at the distances the game actually renders them at.
    const zNear = round.rows - 2.5;
    const zStep = 1.9;
    const x = round.cols / 2;

    HEIGHTS.forEach((h, i) => {
      setAvatarHeight(h);
      const hex = colorHexOf(i + 1);
      const mesh = createPlayerMesh(hex, Q);
      const z = zNear - i * zStep;
      // Stagger left/right of the centre line so consecutive figures never occlude.
      mesh.group.position.set(x + (i % 2 === 0 ? -1.9 : 1.9), 0, z);
      mesh.group.rotation.y = 0;
      ctx.world.add(mesh.group);

      // Run them, so the facing and the animation are judged too — a static T-pose says
      // nothing about either.
      if (mesh.actions && mesh.actions.running) {
        // These rigs are not in the sim, so nothing is blending them: force full run weight.
        mesh.actions.running.setEffectiveWeight(1);
        if (mesh.actions.idle) mesh.actions.idle.setEffectiveWeight(0);
        // Offset each one's phase so the line is not a chorus line.
        mesh.actions.running.time = (i * 0.13) % 0.67;
      }
      sizeRigs.push(mesh);

      // A floating label: index above, height below.
      const cv = document.createElement("canvas");
      cv.width = 256; cv.height = 128;
      const g = cv.getContext("2d");
      g.fillStyle = "#eaf2ff";
      g.font = "bold 74px monospace";
      g.textAlign = "center";
      // Number by size rank, smallest = 1, so the labels read the same regardless of the
      // order they happen to be laid out in.
      g.fillText(String(HEIGHTS.length - i), 128, 62);
      g.font = "38px monospace";
      g.fillStyle = "#8492b8";
      g.fillText(h.toFixed(2), 128, 110);
      const tex = new THREE.CanvasTexture(cv);
      const label = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));
      label.scale.set(1.4, 0.7, 1);
      label.position.set(x + (i % 2 === 0 ? -1.9 : 1.9), h + 0.7, z);
      ctx.world.add(label);
    });

    // Put the height back so nothing else in the page is affected.
    setAvatarHeight(1.35);

    // Park the camera behind and above the line, looking down the aisle at it. Roughly the
    // angle the game itself uses, so the sizes are judged in the framing they will be seen in.
    let prev = performance.now();
    const hold = (now) => {
      requestAnimationFrame(hold);
      const step = Math.min(0.05, ((now || prev) - prev) / 1000);
      prev = now || prev;

      // The main loop only advances a mixer for a player that is moving, and these rigs are
      // not in the sim at all, so their run cycles have to be driven here.
      for (const rig of sizeRigs) if (rig.mixer) rig.mixer.update(step);

      // updateCamera runs every frame in the main loop, so the override has to be re-applied
      // after it — otherwise the follow-cam drags the shot off the line-up immediately.
      ctx.camera.position.set(x, 9.5, zNear + 8.5);
      ctx.camera.lookAt(x, 0.4, zNear - HEIGHTS.length * zStep * 0.62);
    };
    requestAnimationFrame(hold);

    console.log("[sizes] heights:", HEIGHTS.join(", "));
  });
}
</script>
</body>
</html>
