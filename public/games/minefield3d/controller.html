<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Minefield Escape 3D — Controller</title>
<link rel="stylesheet" href="/console.css" />
<style>
  * { -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { height: 100%; overflow: hidden; }
  body {
    display: flex; flex-direction: column;
    touch-action: none; overscroll-behavior: none;
    padding: max(8px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom));
    gap: 10px; background: #03040a;
  }

  .status { text-align: center; min-height: 40px; }
  #condition {
    font-family: var(--font-display); font-weight: 700;
    font-size: clamp(15px,5vw,22px); transition: color .3s;
  }
  #condition.ok { color: var(--glow); }
  #condition.hurt { color: var(--amber); }
  #condition.crawl { color: var(--hot); }
  #condition.gone { color: var(--text-faint); }
  #sub {
    font-family: var(--font-mono); font-size: 10px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--text-faint); margin-top: 3px;
  }

  #gate { display: flex; justify-content: center; gap: 5px; min-height: 10px; }
  .slot {
    width: 20px; height: 6px; border-radius: 3px;
    border: 1px solid var(--line); background: rgba(26,32,56,.6);
    transition: background .25s, box-shadow .25s, border-color .25s;
  }
  .slot.used { background: var(--hot); border-color: var(--hot); box-shadow: 0 0 10px var(--hot); }
  .slot.free { background: var(--lime); border-color: var(--lime); box-shadow: 0 0 10px var(--lime); }

  #pad {
    flex: 1; min-height: 0;
    display: grid; gap: 8px;
    grid-template-columns: 1fr 1fr 1fr;
    grid-template-rows: 1fr 1fr 1fr;
    grid-template-areas: ".    up    ." "left mid   right" ".    down  .";
  }
  #pad.locked { opacity: .3; pointer-events: none; }

  .dir {
    border-radius: 18px; border: 1px solid var(--line);
    background: rgba(26,32,56,.5);
    display: grid; place-items: center;
    font-size: clamp(20px,8vw,34px); color: var(--text-dim);
    transition: background .06s, transform .06s, box-shadow .06s, color .06s;
  }
  .dir.up { grid-area: up; border-color: rgba(157,255,79,.35); color: var(--lime); }
  .dir.down { grid-area: down; border-style: dashed; }
  .dir.left { grid-area: left; }
  .dir.right { grid-area: right; }

  .dir.down-active {
    background: rgba(53,240,224,.22);
    box-shadow: inset 0 0 26px rgba(53,240,224,.28);
    color: var(--text); transform: scale(.975);
  }
  .dir.up.down-active {
    background: rgba(157,255,79,.22);
    box-shadow: inset 0 0 26px rgba(157,255,79,.3);
  }

  /* The centre cell is YOUR ping clock. With per-player sonar this is no longer a shared
     rhythm — it is your own lamp, and knowing when it fires is the difference between
     stepping into the dark and waiting half a second for the light. */
  #mid { grid-area: mid; display: grid; place-items: center; position: relative; }
  #pulsering {
    width: 78%; aspect-ratio: 1; border-radius: 50%;
    border: 2px solid rgba(53,240,224,.14);
    display: grid; place-items: center; gap: 1px;
    font-family: var(--font-mono); font-size: 9px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--text-faint);
    transition: border-color .12s, box-shadow .12s, color .12s;
  }
  #pulsering .lbl { font-size: 7px; opacity: .65; }
  #pulsering.hot {
    border-color: var(--me, var(--glow)); color: var(--me, var(--glow));
    box-shadow: 0 0 22px rgba(53,240,224,.4), inset 0 0 22px rgba(53,240,224,.16);
  }

  #banner {
    position: fixed; inset: 0; z-index: 20;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; background: rgba(3,4,10,.95); text-align: center; padding: 26px;
  }
  #banner.show { display: flex; }
  #banner .big {
    font-size: clamp(26px,9vw,46px); font-weight: 700; line-height: 1.05;
    color: var(--glow); text-shadow: var(--bloom-glow);
  }
  #banner .big.bad { color: var(--hot); text-shadow: var(--bloom-hot); }
  #banner .sub { color: var(--text-dim); font-size: 14px; max-width: 30ch; line-height: 1.55; }

  /* Quality control, master controller only — matches how the other 3D games expose it. */
  #admin { display: none; flex-direction: column; gap: 6px; align-items: center; }
  #admin.show { display: flex; }
  #admin .lbl {
    font-family: var(--font-mono); font-size: 9px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--text-faint);
  }
  #qbtns { display: flex; gap: 6px; }
  .q {
    padding: 4px 10px; border-radius: 999px;
    border: 1px solid var(--line); background: rgba(10,12,24,.7);
    font-family: var(--font-mono); font-size: 10px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--text-dim);
  }
  .q.on { border-color: var(--glow); color: var(--glow); box-shadow: 0 0 12px rgba(53,240,224,.25); }
</style>
</head>
<body>

<div class="status">
  <div id="condition" class="ok">Connecting…</div>
  <div id="sub">your light is your own</div>
</div>
<div id="gate"></div>

<div id="pad" class="locked">
  <div class="dir up" data-hold="up">▲</div>
  <div class="dir left" data-hold="left">◀</div>
  <div id="mid"><div id="pulsering"><span class="lbl">your ping</span><span id="pulsetext">—</span></div></div>
  <div class="dir right" data-hold="right">▶</div>
  <div class="dir down" data-hold="down">▼</div>
</div>

<div id="admin">
  <span class="lbl">Graphics</span>
  <div id="qbtns"></div>
</div>

<div id="banner">
  <div class="big" id="bannerBig">—</div>
  <div class="sub" id="bannerSub"></div>
</div>

<script src="/sdk.js"></script>
<script>
(function () {
  "use strict";

  var freeconsole = new FreeConsole();
  freeconsole.setOrientation("portrait");

  var pad = document.getElementById("pad");
  var conditionEl = document.getElementById("condition");
  var subEl = document.getElementById("sub");
  var gateEl = document.getElementById("gate");
  var banner = document.getElementById("banner");
  var pulsering = document.getElementById("pulsering");
  var pulsetext = document.getElementById("pulsetext");
  var admin = document.getElementById("admin");
  var qbtns = document.getElementById("qbtns");

  var over = false;
  var myState = "alive";

  // Paint the pad in this device's own colour, so a player's lamp on the TV and their phone
  // are unmistakably the same light.
  try {
    document.documentElement.style.setProperty("--me", freeconsole.getPlayerColor());
  } catch (err) { /* no shell yet; the default stands */ }

  var held = { up: false, down: false, left: false, right: false };

  function sendHold(key, value) {
    if (held[key] === value) return;
    held[key] = value;
    freeconsole.message(FreeConsole.SCREEN, { t: "hold", k: key, v: value });
  }

  /**
   * Pointer routing. Directions come from document-level events rather than per-element
   * listeners, so a thumb sliding from one arrow to another switches direction without
   * lifting — which is what walking a diagonal around a mine you just lit requires.
   *
   * A held arrow is never state in its own right: `held` and the `down-active` classes are
   * both *derived*, every time, from which pointers are currently down on which element.
   * That is the whole defence against a stuck button — there is no path that can turn a
   * hold on without a live pointer to justify it, so the worst a dropped `pointerup` can do
   * is survive until the next reconcile, and every exit route reconciles.
   */
  var active = new Map();

  function keyAt(x, y) {
    var el = document.elementFromPoint(x, y);
    while (el && el !== document.body) {
      if (el.dataset && el.dataset.hold) return el;
      el = el.parentElement;
    }
    return null;
  }

  /** Recompute holds + highlights from `active`. The single writer for both. */
  function reconcile() {
    var want = { up: false, down: false, left: false, right: false };
    active.forEach(function (el) {
      if (el && el.dataset && el.dataset.hold in want) want[el.dataset.hold] = true;
    });
    for (var k in want) sendHold(k, want[k]);

    var dirs = document.querySelectorAll(".dir[data-hold]");
    for (var i = 0; i < dirs.length; i++) {
      dirs[i].classList.toggle("down-active", !!want[dirs[i].dataset.hold]);
    }
  }

  function releaseAll() {
    active.clear();
    reconcile();
  }

  function engage(pointerId, el) {
    if (active.get(pointerId) === el) return;
    if (el) active.set(pointerId, el);
    else active.delete(pointerId);
    reconcile();
  }

  document.addEventListener("pointerdown", function (e) {
    if (over) { again(); return; }
    if (e.target && e.target.classList && e.target.classList.contains("q")) return;
    e.preventDefault();

    // Deliberately NO setPointerCapture. On iOS it retargets pointerup to the capturing
    // element, so a release handler bound to document may never fire and the arrow sticks
    // on forever. See the same note in roperaid/controller.html. Releases are covered by
    // the handlers below instead, which do not depend on where the finger came up.
    engage(e.pointerId, keyAt(e.clientX, e.clientY));
  }, { passive: false });

  document.addEventListener("pointermove", function (e) {
    if (!active.has(e.pointerId)) return;
    e.preventDefault();
    // Do NOT test e.buttons here. It is a mouse-button bitmask; for touch pointers browsers
    // report 0 on stationary/coalesced moves even while the finger is firmly down, so using
    // it as a "still pressed" probe kills long presses partway through. Releases come from
    // pointerup/pointercancel/touchend only.
    //
    // A miss (finger in the gutter between arrows, or the layout shifted under a stationary
    // thumb when the admin row appeared) keeps the arrow it already had. Only landing on a
    // *different* arrow switches. Lifting is what ends a hold, never a hit-test miss.
    var el = keyAt(e.clientX, e.clientY);
    if (el) engage(e.pointerId, el);
  }, { passive: false });

  /**
   * Release is keyed on the pointer id and nothing else — not the target, not the position.
   * Where the finger comes up is irrelevant: off the button, off the pad, past the edge of
   * the screen, over the banner. That is what makes "lift outside the button" safe.
   *
   * These are bound on window with capture:true so they still arrive if something inside
   * the page stops propagation, and so a lift over an element outside body's subtree (the
   * fixed banner, the scrollbar gutter) is still seen.
   */
  function release(e) { engage(e.pointerId, null); }
  window.addEventListener("pointerup", release, true);
  window.addEventListener("pointercancel", release, true);

  // iOS can end a touch without a usable pointerup when the finger leaves the element it
  // started on. touchend/touchcancel always fire, so use them as an independent net.
  // Touch identifiers and pointer ids are different number spaces, so a single ended touch
  // cannot be mapped back to one entry — but when the last finger leaves the glass nothing
  // can still legitimately be held, and that case alone is safe to act on.
  function touchRelease(e) {
    if (e.touches.length === 0) releaseAll();
  }
  window.addEventListener("touchend", touchRelease, true);
  window.addEventListener("touchcancel", touchRelease, true);

  // Belt and braces for the events that genuinely never arrive: an OS gesture that steals
  // the touch, a call coming in, the tab going away mid-press.
  window.addEventListener("blur", releaseAll);
  window.addEventListener("pagehide", releaseAll);
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) {
      releaseAll();
      freeconsole.message(FreeConsole.SCREEN, { t: "release" });
    }
  });

  /**
   * Last resort, and deliberately not a timer. There is no API that answers "is pointer N
   * still down", so a periodic sweep can only guess — and a wrong guess drops a finger that
   * is genuinely held, which is worse than the stuck arrow it would be trying to clear.
   * Instead: any fresh touch that finds no other pointer down proves the old ids are dead.
   */
  document.addEventListener("pointerdown", function (e) {
    if (e.isPrimary && active.size) {
      var dead = [];
      active.forEach(function (el, id) { if (id !== e.pointerId) dead.push(id); });
      for (var i = 0; i < dead.length; i++) active.delete(dead[i]);
      if (dead.length) reconcile();
    }
  }, true);

  function again() {
    over = false;
    banner.classList.remove("show");
    freeconsole.message(FreeConsole.SCREEN, { t: "again" });
  }

  /* ---------------------------------------------------------------- ping clock */

  /**
   * Your own emitter's countdown, run locally between broadcasts.
   *
   * The screen sends the period once; streaming a countdown at 60fps would be exactly the
   * per-frame traffic the platform asks games not to send, and a local timer is smoother.
   * The phase is deliberately not synced to anyone else's — the whole point of this version
   * is that every lamp is on its own clock.
   */
  var period = 2;
  var nextPingAt = 0;

  function tickPing() {
    requestAnimationFrame(tickPing);
    if (myState !== "alive" || over) { pulsering.classList.remove("hot"); return; }
    var t = freeconsole.getServerTime();
    if (!nextPingAt) { nextPingAt = t + period * 1000; return; }
    while (t > nextPingAt) nextPingAt += period * 1000;

    var left = (nextPingAt - t) / 1000;
    pulsering.classList.toggle("hot", left < 0.35);
    pulsetext.textContent = left < 0.35 ? "now" : left.toFixed(1);
  }
  requestAnimationFrame(tickPing);

  /* ------------------------------------------------------------------ display */

  function setCondition(legs, state) {
    conditionEl.className = "";
    if (state === "escaped") {
      conditionEl.classList.add("ok");
      conditionEl.textContent = "Through the gate";
      subEl.textContent = "you made it out";
      return;
    }
    if (state === "dead") {
      conditionEl.classList.add("gone");
      conditionEl.textContent = "Left in the aisle";
      subEl.textContent = "your light went out";
      return;
    }
    if (state === "waiting") {
      // Joined or reloaded mid-round. Say so plainly — the pad is locked and without this
      // the phone looks broken rather than early.
      conditionEl.classList.add("gone");
      conditionEl.textContent = "Next round";
      subEl.textContent = "you joined mid-crossing";
      return;
    }
    if (legs >= 2) {
      conditionEl.classList.add("ok");
      conditionEl.textContent = "Walking";
      subEl.textContent = "two legs";
    } else if (legs === 1) {
      conditionEl.classList.add("hurt");
      conditionEl.textContent = "Limping";
      subEl.textContent = "one leg — you are slow now";
      freeconsole.vibrate(60);
    } else {
      conditionEl.classList.add("crawl");
      conditionEl.textContent = "Crawling";
      subEl.textContent = "no legs — keep going";
      freeconsole.vibrate(120);
    }
  }

  function renderGate(left, capacity, open) {
    if (gateEl.childElementCount !== capacity) {
      gateEl.innerHTML = "";
      for (var i = 0; i < capacity; i++) {
        var s = document.createElement("div");
        s.className = "slot";
        gateEl.appendChild(s);
      }
    }
    var slots = gateEl.children;
    for (var j = 0; j < slots.length; j++) {
      slots[j].className = "slot " + (!open || j >= left ? "used" : "free");
    }
  }

  /** Quality buttons appear only on the master controller. */
  function renderQuality(q) {
    if (!q) return;
    var isMaster = false;
    try {
      isMaster = freeconsole.getMasterControllerDeviceId() === freeconsole.getDeviceId();
    } catch (err) { /* no shell — stay hidden */ }
    admin.classList.toggle("show", isMaster);
    if (!isMaster) return;

    if (qbtns.childElementCount !== q.choices.length) {
      qbtns.innerHTML = "";
      q.choices.forEach(function (choice) {
        var b = document.createElement("button");
        b.className = "q";
        b.dataset.choice = choice;
        b.textContent = choice;
        b.addEventListener("click", function () {
          freeconsole.message(FreeConsole.SCREEN, { t: "quality", choice: choice });
        });
        qbtns.appendChild(b);
      });
    }
    for (var i = 0; i < qbtns.children.length; i++) {
      var el = qbtns.children[i];
      var on = el.dataset.choice === q.choice;
      el.classList.toggle("on", on);
      el.textContent = el.dataset.choice === "auto" && q.choice === "auto"
        ? "auto·" + q.tier : el.dataset.choice;
    }
  }

  /* ------------------------------------------------------------------- shell */

  freeconsole.onReady = function () {
    conditionEl.textContent = "Waiting for the aisle…";
    subEl.textContent = "stand by";
    try {
      document.documentElement.style.setProperty("--me", freeconsole.getPlayerColor());
    } catch (err) { /* keep the default */ }
  };

  var lastLegs = 2;

  freeconsole.onMessage = function (deviceId, data) {
    if (deviceId !== FreeConsole.SCREEN || !data) return;
    var me = freeconsole.getDeviceId();

    if (typeof data.sonarPeriod === "number" && data.sonarPeriod !== period) {
      period = data.sonarPeriod;
      nextPingAt = 0;
    }
    if (typeof data.exitLeft === "number" && typeof data.exitCapacity === "number") {
      renderGate(data.exitLeft, data.exitCapacity, data.exitOpen);
    }
    renderQuality(data.quality);

    var state = data.states && data.states[me];
    var legs = data.legs && data.legs[me];
    if (state !== undefined) myState = state;

    if (data.phase === "running") {
      over = false;
      banner.classList.remove("show");
      // Only lock on a state we were actually told. A broadcast that omits this device
      // (partial payload, or one that lands between a reconnect and being re-seated) leaves
      // `state` undefined — treating that as "not alive" locks the pad to pointer-events:
      // none and nothing unlocks it until the next phase, so the pad is dead for the round.
      if (state !== undefined) pad.classList.toggle("locked", state !== "alive");
      if (typeof legs === "number") {
        if (legs !== lastLegs || state !== "alive") setCondition(legs, state);
        lastLegs = legs;
      }
    } else if (data.phase === "briefing") {
      lastLegs = 2;
      nextPingAt = 0;
      over = false;
      myState = "alive";
      banner.classList.remove("show");
      pad.classList.add("locked");
      releaseAll();
      conditionEl.className = "ok";
      conditionEl.textContent = data.levelName || "Level " + (data.level || 1);
      subEl.textContent = "get ready";
    } else if (data.phase === "over") {
      over = true;
      pad.classList.add("locked");
      releaseAll();

      var out = state === "escaped";
      document.getElementById("bannerBig").className = "big" + (out ? "" : " bad");
      document.getElementById("bannerBig").textContent = out ? "You got out" : "You did not";
      document.getElementById("bannerSub").textContent = out
        ? "The gate closed behind you. Tap for the next aisle."
        : "The aisle keeps you. Tap to go again.";
      banner.classList.add("show");
      freeconsole.vibrate(out ? 40 : 15);
    }
  };
})();
</script>
</body>
</html>
