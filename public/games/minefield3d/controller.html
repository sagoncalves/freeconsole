<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Minefield Escape 3D — Controller</title>
<link rel="stylesheet" href="/console.css" />
<style>
  * { -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { height: 100%; overflow: hidden; }
  body {
    display: flex; flex-direction: column;
    touch-action: none; overscroll-behavior: none;
    padding: max(8px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom));
    gap: 10px; background: #03040a;
  }

  .status { text-align: center; min-height: 40px; }
  #condition {
    font-family: var(--font-display); font-weight: 700;
    font-size: clamp(15px,5vw,22px); transition: color .3s;
  }
  #condition.ok { color: var(--glow); }
  #condition.hurt { color: var(--amber); }
  #condition.crawl { color: var(--hot); }
  #condition.gone { color: var(--text-faint); }
  #sub {
    font-family: var(--font-mono); font-size: 10px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--text-faint); margin-top: 3px;
  }

  #gate { display: flex; justify-content: center; gap: 5px; min-height: 10px; }
  .slot {
    width: 20px; height: 6px; border-radius: 3px;
    border: 1px solid var(--line); background: rgba(26,32,56,.6);
    transition: background .25s, box-shadow .25s, border-color .25s;
  }
  .slot.used { background: var(--hot); border-color: var(--hot); box-shadow: 0 0 10px var(--hot); }
  .slot.free { background: var(--lime); border-color: var(--lime); box-shadow: 0 0 10px var(--lime); }

  /* The whole lower half is the stick surface. It is one big touch target rather than a
     drawn circle you must hit, because in the dark nobody looks at their phone — the thumb
     lands wherever it lands and the stick forms there. */
  #pad {
    flex: 1; min-height: 0; position: relative;
    display: grid; place-items: center;
    border-radius: 22px; border: 1px solid var(--line);
    background:
      radial-gradient(circle at 50% 50%, rgba(53,240,224,.05), transparent 62%),
      rgba(10,12,24,.45);
    overflow: hidden;
  }
  #pad.locked { opacity: .3; pointer-events: none; }

  /* Base + knob are placed from JS, so they start hidden and centred by transform only. */
  #base, #knob {
    position: absolute; left: 0; top: 0;
    border-radius: 50%; pointer-events: none;
    opacity: 0; transition: opacity .16s;
  }
  #base {
    width: 148px; height: 148px; margin: -74px 0 0 -74px;
    border: 1px solid rgba(53,240,224,.22);
    background: radial-gradient(circle at 50% 50%, rgba(53,240,224,.07), transparent 70%);
  }
  #knob {
    width: 66px; height: 66px; margin: -33px 0 0 -33px;
    border: 2px solid var(--me, var(--glow));
    background: rgba(53,240,224,.16);
    box-shadow: 0 0 22px rgba(53,240,224,.35), inset 0 0 18px rgba(53,240,224,.2);
  }
  #pad.active #base, #pad.active #knob { opacity: 1; }

  /* The idle hint fades out the moment a thumb lands — it is instruction, not decoration. */
  #hint {
    position: absolute; bottom: 12px; left: 0; right: 0; text-align: center;
    font-family: var(--font-mono); font-size: 9px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--text-faint);
    transition: opacity .16s; pointer-events: none;
  }
  #pad.active #hint { opacity: 0; }

  /* YOUR ping clock. With per-player sonar this is no longer a shared rhythm — it is your
     own lamp, and knowing when it fires is the difference between stepping into the dark
     and waiting half a second for the light. It sits centred *behind* the stick, and fades
     back while you steer so it never competes with the knob for attention. */
  #mid {
    position: absolute; inset: 0; display: grid; place-items: center;
    pointer-events: none; transition: opacity .16s;
  }
  #pad.active #mid { opacity: .25; }
  #pulsering {
    width: 112px; height: 112px; border-radius: 50%;
    border: 2px solid rgba(53,240,224,.14);
    display: grid; place-items: center; gap: 1px;
    font-family: var(--font-mono); font-size: 9px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--text-faint);
    transition: border-color .12s, box-shadow .12s, color .12s;
  }
  #pulsering .lbl { font-size: 7px; opacity: .65; }
  #pulsering.hot {
    border-color: var(--me, var(--glow)); color: var(--me, var(--glow));
    box-shadow: 0 0 22px rgba(53,240,224,.4), inset 0 0 22px rgba(53,240,224,.16);
  }

  /* The called symbol, mirrored on the phone.
     Same slot as the ping ring — only one of the two is ever live, since the modes that use
     them are mutually exclusive. Much bigger type than the ping clock: this is a glance from
     a running player, not a number to read. */
  #callring {
    display: none;
    width: 132px; height: 132px; border-radius: 50%;
    border: 3px solid rgba(53,240,224,.2);
    place-items: center; gap: 2px;
    font-family: var(--font-mono); letter-spacing: .12em;
    text-transform: uppercase; color: var(--text-faint);
    transition: border-color .12s, box-shadow .12s, color .12s;
  }
  #callring.show { display: grid; }
  #callring .lbl { font-size: 8px; opacity: .7; }
  #calltext { font-size: 54px; font-weight: 700; line-height: 1; }
  /* X is cyan and O is pink, matching the tiles and the wall screen exactly. */
  #callring.x { border-color: var(--glow); color: var(--glow); box-shadow: 0 0 26px rgba(53,240,224,.35); }
  #callring.o { border-color: var(--hot); color: var(--hot); box-shadow: 0 0 26px rgba(255,46,136,.35); }

  /* The shove button.
     Bottom-right of the pad, sized for a thumb, and carrying the `q` class so the stick
     handler skips it — without that, every tap on it would also plant a joystick. It is
     deliberately NOT centred: the stick can form anywhere on the pad, and a centred button
     would sit exactly where people put their thumb to walk. */
  #shove {
    position: absolute; right: 14px; bottom: 14px; z-index: 3;
    width: 92px; height: 92px; border-radius: 50%;
    border: 2px solid var(--me, var(--glow));
    background: rgba(53,240,224,.1);
    font-family: var(--font-mono); font-size: 13px; font-weight: 700;
    letter-spacing: .1em; text-transform: uppercase;
    color: var(--me, var(--glow));
    transition: transform .08s, background .12s, opacity .2s;
  }
  #shove:active { transform: scale(.9); background: rgba(53,240,224,.26); }
  /* Greyed while it is on cooldown, so a tap that will do nothing looks like it. */
  #shove.cooling { opacity: .3; }
  #pad.locked #shove { display: none; }

  /* The sniper's controls, in place of the shove button.
     Fire is the big one under the right thumb; scope sits above it. Both carry `q` so the
     stick handler skips them — the pad still steers, it just aims a rifle instead of legs. */
  #fireBtn, #scopeBtn {
    position: absolute; right: 14px; z-index: 3;
    display: none;
    border-radius: 50%;
    font-family: var(--font-mono); font-weight: 700;
    letter-spacing: .1em; text-transform: uppercase;
    transition: transform .08s, background .12s, opacity .2s;
  }
  #fireBtn.show, #scopeBtn.show { display: block; }
  #fireBtn {
    bottom: 14px; width: 104px; height: 104px;
    border: 2px solid var(--hot); background: rgba(255,46,136,.14);
    color: var(--hot); font-size: 15px;
  }
  #fireBtn:active { transform: scale(.9); background: rgba(255,46,136,.32); }
  /* Greyed while the bolt is out, so a dead trigger looks dead. */
  #fireBtn.cooling { opacity: .28; }
  #scopeBtn {
    bottom: 132px; width: 76px; height: 76px;
    border: 2px solid var(--glow); background: rgba(53,240,224,.1);
    color: var(--glow); font-size: 12px;
  }
  #scopeBtn.on { background: rgba(53,240,224,.34); box-shadow: 0 0 18px rgba(53,240,224,.4); }

  #banner {
    position: fixed; inset: 0; z-index: 20;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; background: rgba(3,4,10,.95); text-align: center; padding: 26px;
  }
  #banner.show { display: flex; }
  #banner .big {
    font-size: clamp(26px,9vw,46px); font-weight: 700; line-height: 1.05;
    color: var(--glow); text-shadow: var(--bloom-glow);
  }
  #banner .big.bad { color: var(--hot); text-shadow: var(--bloom-hot); }
  #banner .sub { color: var(--text-dim); font-size: 14px; max-width: 30ch; line-height: 1.55; }

  /* Quality control, master controller only — matches how the other 3D games expose it. */
  #admin { display: none; flex-direction: column; gap: 6px; align-items: center; }
  #admin.show { display: flex; }
  #admin .lbl {
    font-family: var(--font-mono); font-size: 9px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--text-faint);
  }
  #qbtns, #mbtns { display: flex; gap: 6px; }
  .q {
    padding: 4px 10px; border-radius: 999px;
    border: 1px solid var(--line); background: rgba(10,12,24,.7);
    font-family: var(--font-mono); font-size: 10px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--text-dim);
  }
  .q.on { border-color: var(--glow); color: var(--glow); box-shadow: 0 0 12px rgba(53,240,224,.25); }
</style>
</head>
<body>

<div class="status">
  <div id="condition" class="ok">Connecting…</div>
  <div id="sub">your light is your own</div>
</div>
<div id="gate"></div>

<div id="pad" class="locked">
  <div id="mid">
    <div id="pulsering"><span class="lbl">your ping</span><span id="pulsetext">—</span></div>
    <div id="callring"><span class="lbl">stand on</span><span id="calltext">—</span></div>
  </div>
  <div id="base"></div>
  <div id="knob"></div>
  <button id="shove" class="q">push</button>
  <button id="scopeBtn" class="q">scope</button>
  <button id="fireBtn" class="q">fire</button>
  <div id="hint">drag to move · tap push to shove</div>
</div>

<div id="admin">
  <span class="lbl">Mode</span>
  <div id="mbtns"></div>
  <span class="lbl">Graphics</span>
  <div id="qbtns"></div>
</div>

<div id="banner">
  <div class="big" id="bannerBig">—</div>
  <div class="sub" id="bannerSub"></div>
</div>

<script src="/sdk.js"></script>
<script>
(function () {
  "use strict";

  var freeconsole = new FreeConsole();
  freeconsole.setOrientation("portrait");

  var pad = document.getElementById("pad");
  var conditionEl = document.getElementById("condition");
  var subEl = document.getElementById("sub");
  var gateEl = document.getElementById("gate");
  var banner = document.getElementById("banner");
  var pulsering = document.getElementById("pulsering");
  var pulsetext = document.getElementById("pulsetext");
  var callring = document.getElementById("callring");
  var calltext = document.getElementById("calltext");
  var shove = document.getElementById("shove");
  var fireBtn = document.getElementById("fireBtn");
  var scopeBtn = document.getElementById("scopeBtn");
  var admin = document.getElementById("admin");
  var qbtns = document.getElementById("qbtns");
  var mbtns = document.getElementById("mbtns");

  var over = false;
  var myState = "alive";
  /** Which mode the screen is running. Changes what the status lines and the end card say. */
  var survival = false;
  /** Calls mode: the phone mirrors the called symbol so the back row need not squint at the TV. */
  var calls = false;
  /** Sniper mode, and whether THIS phone is the one holding the rifle. */
  var sniperMode = false;
  var iAmSniper = false;
  var scopedOn = false;
  var rifleReloading = false;

  // Paint the pad in this device's own colour, so a player's lamp on the TV and their phone
  // are unmistakably the same light.
  try {
    document.documentElement.style.setProperty("--me", freeconsole.getPlayerColor());
  } catch (err) { /* no shell yet; the default stands */ }

  /**
   * Floating analog stick.
   *
   * The stick has no fixed home: wherever the thumb lands becomes the centre, and the vector
   * is measured from there. That is the right shape for this game specifically — the screen
   * is dark, the player is watching the TV and not the phone, and a fixed stick you have to
   * find by feel costs a life every time you miss it.
   *
   * `stickId` is the single source of truth for "is a stick engaged", and it holds a pointer
   * id rather than a boolean. Anything that ends must match the id that started, so a second
   * finger landing elsewhere on the pad cannot hijack a stick that is already being steered,
   * and its release cannot cancel one it never owned.
   */
  var DEAD_ZONE = 8;    // px of slack, so resting a thumb is not a step into a minefield
  var MAX_RADIUS = 62;  // px from centre for full speed; matches #base's visual radius

  var stickId = null;
  var originX = 0;
  var originY = 0;
  var sentX = 0;
  var sentZ = 0;
  /** The stick's current vector, held so the aim stream has something to resend. */
  var heldX = 0;
  var heldZ = 0;

  var baseEl = document.getElementById("base");
  var knobEl = document.getElementById("knob");

  /**
   * Push the vector to the screen, rate-limited by *change* rather than by a timer. A stick
   * sampled at pointermove rate would be per-frame traffic, which is exactly what the
   * platform asks games not to send; a small threshold cuts the stream to the moments the
   * direction actually differs while staying far below anything a thumb can perceive.
   */
  /**
   * Send the stick.
   *
   * Same stick, two meanings: legs for a runner, rifle bearing for the sniper. Switching the
   * message here rather than on the screen keeps the wire honest — a phone that is not the
   * sniper never sends an aim at all, so there is nothing for the screen to have to reject.
   *
   * The aim stream is NOT change-gated the way axis is. A held stick means "keep turning",
   * so the screen has to keep hearing it; suppressing unchanged values would stop the rifle
   * dead whenever the thumb was steady, which is exactly when it is tracking someone.
   */
  function sendAim(x, z) {
    freeconsole.message(FreeConsole.SCREEN, { t: "aim", x: x, z: z });
  }

  function sendAxis(x, z) {
    heldX = x;
    heldZ = z;
    // The sniper's stick aims rather than walks, and must be resent continuously.
    if (iAmSniper) { sendAim(x, z); return; }
    if (Math.abs(x - sentX) < 0.04 && Math.abs(z - sentZ) < 0.04) return;
    sentX = x;
    sentZ = z;
    freeconsole.message(FreeConsole.SCREEN, { t: "axis", x: x, z: z });
  }

  /**
   * Keep the rifle turning while the stick is held.
   *
   * A runner's stick is edge-triggered — the screen remembers the last vector and keeps
   * walking — but a bearing has to be integrated, so a held stick has to keep arriving. This
   * resends the current stick at a fixed rate for as long as the sniper is holding it, and
   * sends nothing at all otherwise.
   */
  var AIM_HZ = 30;
  setInterval(function () {
    if (!iAmSniper || over || stickId === null) return;
    sendAim(heldX, heldZ);
  }, 1000 / AIM_HZ);

  function placeStick(cx, cy, kx, ky) {
    var r = pad.getBoundingClientRect();
    baseEl.style.transform = "translate(" + (cx - r.left) + "px," + (cy - r.top) + "px)";
    knobEl.style.transform = "translate(" + (kx - r.left) + "px," + (ky - r.top) + "px)";
  }

  /** Turn a raw touch position into a clamped vector, and move the knob to match. */
  function updateStick(px, py) {
    var dx = px - originX;
    var dy = py - originY;
    var dist = Math.hypot(dx, dy);

    if (dist < DEAD_ZONE) {
      placeStick(originX, originY, originX, originY);
      sendAxis(0, 0);
      return;
    }

    // Re-map so the vector ramps from 0 at the dead-zone edge instead of jumping to a
    // sizeable value the instant it is crossed.
    var mag = Math.min(1, (dist - DEAD_ZONE) / (MAX_RADIUS - DEAD_ZONE));
    var ux = dx / dist;
    var uy = dy / dist;

    var draw = Math.min(dist, MAX_RADIUS);
    placeStick(originX, originY, originX + ux * draw, originY + uy * draw);

    // Screen y grows downward and the world's +z runs away from the gate, which is the same
    // direction — so dy maps to z with no flip. "Up" on the pad is toward lower z, and that
    // falls out of the sign automatically.
    sendAxis(ux * mag, uy * mag);
  }

  /**
   * Forget what the screen was last told.
   *
   * sendAxis dedupes against sentX/sentZ, which is only correct while those still describe
   * what the screen actually has. Anything that resets the screen's side — a reconnect, a
   * rejoin, clearInput on the far end — makes them a lie, and the next push that happens to
   * match the stale value gets suppressed as "no change" and never sent. Clearing them to
   * NaN rather than 0 means the very next sendAxis always differs (NaN compares false), so
   * even a re-push of dead centre gets through.
   */
  function forgetSent() {
    sentX = NaN;
    sentZ = NaN;
  }

  function endStick() {
    stickId = null;
    pad.classList.remove("active");
    sendAxis(0, 0);
    // Send the neutral vector unconditionally, even if sendAxis just suppressed it as
    // too-small a change: a release must never be the message that gets rate-limited away,
    // or the player keeps walking after lifting off.
    sentX = 0;
    sentZ = 0;
    freeconsole.message(FreeConsole.SCREEN, { t: "release" });
  }

  /** Every exit route funnels here, so there is one definition of "not steering". */
  function releaseAll() {
    // Note the ordering: forget *unconditionally*, end the stick only if one is live. The
    // early return used to skip both, which is exactly how locking the phone with no finger
    // on the glass left a stale sent-vector behind and killed the first move after unlock.
    forgetSent();
    if (stickId === null) return;
    endStick();
  }

  document.addEventListener("pointerdown", function (e) {
    if (over) { again(); return; }
    if (e.target && e.target.classList && e.target.classList.contains("q")) return;
    // The stick lives on the pad only, so the status text and the admin row stay tappable.
    if (!pad.contains(e.target)) return;
    e.preventDefault();

    // A stick is already being steered by another finger; ignore this one entirely rather
    // than snatching the origin out from under a thumb that is mid-move.
    if (stickId !== null) return;

    // Deliberately NO setPointerCapture. On iOS it retargets pointerup to the capturing
    // element, so a release handler bound to document may never fire and the player walks
    // on forever. See the same note in roperaid/controller.html. Releases are covered by
    // the handlers below instead, which do not depend on where the finger came up.
    stickId = e.pointerId;
    originX = e.clientX;
    originY = e.clientY;
    pad.classList.add("active");
    placeStick(originX, originY, originX, originY);
    updateStick(e.clientX, e.clientY);
  }, { passive: false });

  document.addEventListener("pointermove", function (e) {
    if (stickId !== e.pointerId) return;
    e.preventDefault();
    // Do NOT test e.buttons here. It is a mouse-button bitmask; for touch pointers browsers
    // report 0 on stationary/coalesced moves even while the finger is firmly down, so using
    // it as a "still pressed" probe kills long presses partway through. Releases come from
    // pointerup/pointercancel/touchend only.
    //
    // The finger is free to travel outside the pad — the vector just clamps at full tilt.
    // Dragging past the edge is how you hold a run, not how you let go.
    updateStick(e.clientX, e.clientY);
  }, { passive: false });

  /**
   * Release is keyed on the pointer id and nothing else — not the target, not the position.
   * Where the finger comes up is irrelevant: off the button, off the pad, past the edge of
   * the screen, over the banner. That is what makes "lift outside the button" safe.
   *
   * These are bound on window with capture:true so they still arrive if something inside
   * the page stops propagation, and so a lift over an element outside body's subtree (the
   * fixed banner, the scrollbar gutter) is still seen.
   */
  function release(e) { if (stickId === e.pointerId) endStick(); }
  window.addEventListener("pointerup", release, true);
  window.addEventListener("pointercancel", release, true);

  // iOS can end a touch without a usable pointerup when the finger leaves the element it
  // started on. touchend/touchcancel always fire, so use them as an independent net.
  // Touch identifiers and pointer ids are different number spaces, so a single ended touch
  // cannot be mapped back to one entry — but when the last finger leaves the glass nothing
  // can still legitimately be held, and that case alone is safe to act on.
  function touchRelease(e) {
    if (e.touches.length === 0) releaseAll();
  }
  window.addEventListener("touchend", touchRelease, true);
  window.addEventListener("touchcancel", touchRelease, true);

  // Belt and braces for the events that genuinely never arrive: an OS gesture that steals
  // the touch, a call coming in, the tab going away mid-press.
  window.addEventListener("blur", releaseAll);
  window.addEventListener("pagehide", releaseAll);
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) {
      releaseAll();
      freeconsole.message(FreeConsole.SCREEN, { t: "release" });
      return;
    }

    // Coming BACK matters as much as leaving. While the phone was locked the screen may have
    // re-seated this device (onConnect calls clearInput on a rejoin), so its idea of our axis
    // is now zero regardless of what we last sent. Anything we still believe we sent is
    // stale, and the next push that matched it would be deduped into silence — which is the
    // "controller is dead after unlocking" bug. Forgetting costs one redundant message and
    // removes the whole class of desync.
    forgetSent();
  });

  /**
   * Last resort, and deliberately not a timer. There is no API that answers "is pointer N
   * still down", so a periodic sweep can only guess — and a wrong guess drops a finger that
   * is genuinely held, which is worse than the stuck stick it would be trying to clear.
   * Instead: a fresh *primary* touch proves no other finger is on the glass, so a stick
   * still held by some earlier id can only be a leak. Runs in the capture phase, ahead of
   * the handler that claims the new pointer, so the clear cannot wipe the stick just made.
   */
  document.addEventListener("pointerdown", function (e) {
    if (e.isPrimary && stickId !== null && stickId !== e.pointerId) endStick();
  }, true);

  function again() {
    over = false;
    banner.classList.remove("show");
    freeconsole.message(FreeConsole.SCREEN, { t: "again" });
  }

  /* -------------------------------------------------------------------- push */

  /**
   * The shove button.
   *
   * The screen is the authority on whether a shove connects — this only sends the intent. The
   * cooldown is mirrored locally purely so the button can grey out: a control that looks live
   * while being ignored is worse than one that visibly says "not yet", and waiting for a
   * round-trip to find that out would make it feel broken on a slow room.
   *
   * PUSH_COOLDOWN in sim.js is the real value; this is its twin and must be kept at or above
   * it, so the button is never enabled while the sim would still refuse.
   */
  var PUSH_COOLDOWN_MS = 1100;
  var lastPush = 0;

  function doPush() {
    if (myState !== "alive" || over) return;
    var now = Date.now();
    if (now - lastPush < PUSH_COOLDOWN_MS) return;
    lastPush = now;
    freeconsole.message(FreeConsole.SCREEN, { t: "push" });
    freeconsole.vibrate(18);
    shove.classList.add("cooling");
    setTimeout(function () { shove.classList.remove("cooling"); }, PUSH_COOLDOWN_MS);
  }

  // pointerdown rather than click: a shove is a reflex, and click waits for the release.
  shove.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    e.stopPropagation();
    doPush();
  });

  /* ------------------------------------------------------------------ rifle */

  /**
   * Trigger and scope.
   *
   * Both are fire-and-forget: the screen owns the reload clock and whether a shot connects,
   * and this only reflects what it is told. The local greying is the same idea as the shove
   * button's — a trigger that will be ignored has to look like one.
   */
  function doFire() {
    if (!iAmSniper || over || rifleReloading) return;
    freeconsole.message(FreeConsole.SCREEN, { t: "fire" });
    freeconsole.vibrate(35);
  }

  function toggleScope() {
    if (!iAmSniper || over) return;
    scopedOn = !scopedOn;
    scopeBtn.classList.toggle("on", scopedOn);
    freeconsole.message(FreeConsole.SCREEN, { t: "scope", on: scopedOn });
    freeconsole.vibrate(12);
  }

  fireBtn.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    e.stopPropagation();
    doFire();
  });
  scopeBtn.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    e.stopPropagation();
    toggleScope();
  });

  /**
   * Swap the phone between a runner's controls and the sniper's.
   *
   * The pad stays in both — it is the stick either way — but everything around it changes,
   * and the shove button is hidden for the sniper because there is nobody in the nest to push.
   */
  function renderSniper(sn) {
    sniperMode = !!sn;
    var was = iAmSniper;
    iAmSniper = false;
    if (sn) {
      try { iAmSniper = sn.id === freeconsole.getDeviceId(); } catch (err) { iAmSniper = false; }
      rifleReloading = !!sn.reload;
    }

    fireBtn.classList.toggle("show", iAmSniper);
    scopeBtn.classList.toggle("show", iAmSniper);
    fireBtn.classList.toggle("cooling", rifleReloading);
    // A runner in sniper mode still has legs but nothing to shove — the nest is out of reach.
    shove.style.display = sniperMode ? "none" : "";

    // Losing the rifle between rounds has to reset the scope, or the next sniper inherits a
    // zoomed view they never asked for and cannot see the aisle through.
    if (was && !iAmSniper) {
      scopedOn = false;
      scopeBtn.classList.remove("on");
    }

    /*
     * Picking up or losing the rifle has to redraw the status line.
     *
     * setCondition is otherwise only called when `legs` or `state` change, and taking the
     * nest changes neither — you keep two legs and stay alive. So the phone that had just
     * become the sniper went on reading "Walking / two legs" with no indication it was
     * holding a rifle at all, which is exactly the "it doesn't tell me I'm the sniper"
     * report. Redrawn only on the transition, so this cannot fight the normal path.
     */
    if (was !== iAmSniper) setCondition(lastLegs, lastState);
  }

  /* ---------------------------------------------------------------- ping clock */

  /**
   * Your own emitter's countdown, run locally between broadcasts.
   *
   * The screen sends the period once; streaming a countdown at 60fps would be exactly the
   * per-frame traffic the platform asks games not to send, and a local timer is smoother.
   * The phase is deliberately not synced to anyone else's — the whole point of this version
   * is that every lamp is on its own clock.
   */
  var period = 2;
  var nextPingAt = 0;

  function tickPing() {
    requestAnimationFrame(tickPing);

    // Survival has no echolocation, so there is no countdown to show. The ring is hidden
    // outright rather than left frozen: a dial that sits at a stale number reads as a broken
    // phone, and the pad is the only thing that should be drawing the eye in that mode.
    if (survival || calls) {
      pulsering.style.display = "none";
      pulsering.classList.remove("hot");
      return;
    }
    pulsering.style.display = "";

    if (myState !== "alive" || over) { pulsering.classList.remove("hot"); return; }
    var t = freeconsole.getServerTime();
    if (!nextPingAt) { nextPingAt = t + period * 1000; return; }
    while (t > nextPingAt) nextPingAt += period * 1000;

    var left = (nextPingAt - t) / 1000;
    pulsering.classList.toggle("hot", left < 0.35);
    pulsetext.textContent = left < 0.35 ? "now" : left.toFixed(1);
  }
  requestAnimationFrame(tickPing);

  /* ------------------------------------------------------------------ display */

  function setCondition(legs, state) {
    conditionEl.className = "";
    if (state === "escaped") {
      conditionEl.classList.add("ok");
      conditionEl.textContent = "Through the gate";
      subEl.textContent = "you made it out";
      return;
    }
    if (state === "dead") {
      conditionEl.classList.add("gone");
      conditionEl.textContent = calls ? "Dropped" : survival ? "Cut down" : "Left in the aisle";
      subEl.textContent = calls ? "the floor went out from under you"
        : survival ? "the saws got you" : "your light went out";
      return;
    }
    if (state === "waiting") {
      // Joined or reloaded mid-round. Say so plainly — the pad is locked and without this
      // the phone looks broken rather than early.
      conditionEl.classList.add("gone");
      conditionEl.textContent = "Next round";
      subEl.textContent = "you joined mid-crossing";
      return;
    }
    if (legs >= 2) {
      conditionEl.classList.add("ok");
      if (iAmSniper) {
        conditionEl.textContent = "In the nest";
        subEl.textContent = rifleReloading ? "working the bolt" : "rifle ready";
      } else {
        conditionEl.textContent = calls ? "On the board"
          : survival ? "Running" : sniperMode ? "Running" : "Walking";
        subEl.textContent = calls ? "read the wall"
          : survival ? "keep moving" : sniperMode ? "watch the laser" : "two legs";
      }
    } else if (legs === 1) {
      conditionEl.classList.add("hurt");
      conditionEl.textContent = "Limping";
      subEl.textContent = "one leg — you are slow now";
      freeconsole.vibrate(60);
    } else {
      conditionEl.classList.add("crawl");
      conditionEl.textContent = "Crawling";
      subEl.textContent = "no legs — keep going";
      freeconsole.vibrate(120);
    }
  }

  function renderGate(left, capacity, open) {
    if (gateEl.childElementCount !== capacity) {
      gateEl.innerHTML = "";
      for (var i = 0; i < capacity; i++) {
        var s = document.createElement("div");
        s.className = "slot";
        gateEl.appendChild(s);
      }
    }
    var slots = gateEl.children;
    for (var j = 0; j < slots.length; j++) {
      slots[j].className = "slot " + (!open || j >= left ? "used" : "free");
    }
  }

  /**
   * Mirror the called symbol on the phone.
   *
   * Driven purely by broadcasts, with no local clock. The countdown deliberately is NOT shown
   * here: the wall screen already runs a draining bar, and a second timer on the phone invites
   * players to watch their hand instead of the board — which is where their feet need to be
   * taking them. All this has to say is which letter, in the colour it appears in everywhere
   * else, big enough to read at a glance mid-run.
   */
  function renderCall(call) {
    if (!calls || !call || !call.symbol) {
      callring.classList.remove("show", "x", "o");
      calltext.textContent = "—";
      return;
    }
    var isO = call.symbol === "O";
    callring.classList.add("show");
    callring.classList.toggle("o", isO);
    callring.classList.toggle("x", !isO);
    calltext.textContent = call.symbol;
  }

  var MODE_LABELS = { escape: "escape", survival: "saws", calls: "X or O", sniper: "sniper" };

  /**
   * Mode buttons, master controller only — the same shape as the quality row.
   *
   * They carry the `q` class as well as `m` on purpose: the pad's pointerdown handler skips
   * anything with class `q`, and without it a tap on a mode button also plants a joystick.
   */
  /** Light exactly one button in the mode row. */
  function markMode(current) {
    for (var i = 0; i < mbtns.children.length; i++) {
      var el = mbtns.children[i];
      el.classList.toggle("on", el.dataset.mode === current);
    }
  }

  function renderModes(m) {
    if (!m || !isMasterController()) return;

    if (mbtns.childElementCount !== m.choices.length) {
      mbtns.innerHTML = "";
      m.choices.forEach(function (choice) {
        var b = document.createElement("button");
        b.className = "q m";
        b.dataset.mode = choice;
        b.textContent = MODE_LABELS[choice] || choice;
        b.addEventListener("click", function () {
          /*
           * Move the highlight on the tap, not on the reply.
           *
           * A mode change tears down the round and rebuilds the level on the screen, so the
           * confirming broadcast is a long way off — and until it lands the row still lights
           * whatever was running before, which reads as "it ignored me and stayed on escape".
           * The screen remains the authority: its next broadcast re-marks the row, so a
           * change it refuses (a non-master phone, an unknown mode) is corrected rather than
           * left showing a lie.
           */
          markMode(choice);
          freeconsole.message(FreeConsole.SCREEN, { t: "mode", mode: choice });
        });
        mbtns.appendChild(b);
      });
    }
    markMode(m.current);
  }

  function isMasterController() {
    try {
      return freeconsole.getMasterControllerDeviceId() === freeconsole.getDeviceId();
    } catch (err) {
      return false;   // no shell — stay hidden
    }
  }

  /** Quality buttons appear only on the master controller. */
  function renderQuality(q) {
    if (!q) return;
    var isMaster = isMasterController();
    admin.classList.toggle("show", isMaster);
    if (!isMaster) return;

    if (qbtns.childElementCount !== q.choices.length) {
      qbtns.innerHTML = "";
      q.choices.forEach(function (choice) {
        var b = document.createElement("button");
        b.className = "q";
        b.dataset.choice = choice;
        b.textContent = choice;
        b.addEventListener("click", function () {
          freeconsole.message(FreeConsole.SCREEN, { t: "quality", choice: choice });
        });
        qbtns.appendChild(b);
      });
    }
    for (var i = 0; i < qbtns.children.length; i++) {
      var el = qbtns.children[i];
      var on = el.dataset.choice === q.choice;
      el.classList.toggle("on", on);
      el.textContent = el.dataset.choice === "auto" && q.choice === "auto"
        ? "auto·" + q.tier : el.dataset.choice;
    }
  }

  /* ------------------------------------------------------------------- shell */

  freeconsole.onReady = function () {
    conditionEl.textContent = "Waiting for the aisle…";
    subEl.textContent = "stand by";
    try {
      document.documentElement.style.setProperty("--me", freeconsole.getPlayerColor());
    } catch (err) { /* keep the default */ }

    // A fresh session is the strongest possible proof that the screen holds nothing for us:
    // it re-seats this device and clears its input. Drop any stick still believed held and
    // any memory of what was sent, so the first push after reconnecting always lands. This
    // covers the reconnects that arrive with no visibilitychange at all — a dropped socket
    // that comes back while the phone was never locked.
    releaseAll();
  };

  var lastLegs = 2;
  var lastState = null;

  freeconsole.onMessage = function (deviceId, data) {
    if (deviceId !== FreeConsole.SCREEN || !data) return;
    var me = freeconsole.getDeviceId();

    if (typeof data.sonarPeriod === "number" && data.sonarPeriod !== period) {
      period = data.sonarPeriod;
      nextPingAt = 0;
    }
    if (typeof data.mode === "string") {
      survival = data.mode === "survival";
      calls = data.mode === "calls";
    }
    renderCall(data.call);
    renderSniper(data.sniper);
    if (typeof data.exitLeft === "number" && typeof data.exitCapacity === "number") {
      // Capacity 0 is how survival says "there is no gate" — renderGate then empties the row.
      renderGate(data.exitLeft, data.exitCapacity, data.exitOpen);
    }
    renderQuality(data.quality);
    renderModes(data.modes);

    var state = data.states && data.states[me];
    var legs = data.legs && data.legs[me];
    if (state !== undefined) myState = state;

    if (data.phase === "running") {
      over = false;
      banner.classList.remove("show");
      // Only lock on a state we were actually told. A broadcast that omits this device
      // (partial payload, or one that lands between a reconnect and being re-seated) leaves
      // `state` undefined — treating that as "not alive" locks the pad to pointer-events:
      // none and nothing unlocks it until the next phase, so the pad is dead for the round.
      if (state !== undefined) pad.classList.toggle("locked", state !== "alive");
      if (typeof legs === "number") {
        // `lastState` is checked alongside the legs because calls never takes a leg — you are
        // on the board or you are gone. Keyed on legs alone, a calls player keeps the
        // "Waiting for the aisle…" connect text for the entire round.
        if (legs !== lastLegs || state !== lastState || state !== "alive") {
          setCondition(legs, state);
        }
        lastLegs = legs;
        lastState = state;
      }
    } else if (data.phase === "briefing") {
      lastLegs = 2;
      lastState = null;
      nextPingAt = 0;
      over = false;
      myState = "alive";
      banner.classList.remove("show");
      pad.classList.add("locked");
      releaseAll();
      conditionEl.className = "ok";
      conditionEl.textContent = data.levelName || "Level " + (data.level || 1);
      subEl.textContent = "get ready";
    } else if (data.phase === "over") {
      over = true;
      pad.classList.add("locked");
      releaseAll();

      // In survival there is no gate to get through, so "made it" means still being alive
      // when the round ended — the last one standing.
      // Escape is won by getting out; the other two by still being alive at the end.
      // The sniper's win condition is inverted: they win when NOBODY got out.
      var out = iAmSniper ? !(data.escapedAny)
        : survival || calls ? state === "alive" : state === "escaped";
      var big, sub;
      if (iAmSniper) {
        big = out ? "Aisle cleared" : "They got past you";
        sub = out ? "Nobody reached the gate. Tap to go again."
                  : "Someone made it through. Tap to go again.";
      } else if (sniperMode) {
        big = out ? "You got out" : "Down";
        sub = out ? "Past the nest and through the gate. Tap to go again."
                  : "The rifle found you. Tap to go again.";
      } else if (calls) {
        big = out ? "Last one standing" : "Dropped";
        sub = out ? "You read every call. Tap for a faster board."
                  : "The floor went out from under you. Tap to step back on.";
      } else if (survival) {
        big = out ? "Last one standing" : "Cut down";
        sub = out ? "You outlasted the floor. Tap for a worse room."
                  : "The saws got you. Tap to go back in.";
      } else {
        big = out ? "You got out" : "You did not";
        sub = out ? "The gate closed behind you. Tap for the next aisle."
                  : "The aisle keeps you. Tap to go again.";
      }
      document.getElementById("bannerBig").className = "big" + (out ? "" : " bad");
      document.getElementById("bannerBig").textContent = big;
      document.getElementById("bannerSub").textContent = sub;
      banner.classList.add("show");
      freeconsole.vibrate(out ? 40 : 15);
    }
  };
})();
</script>
</body>
</html>
