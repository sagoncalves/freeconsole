<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Minefield Escape — Screen</title>
<link rel="stylesheet" href="/console.css" />
<style>
  html, body { height: 100%; overflow: hidden; }
  body { display: flex; flex-direction: column; background: #03040a; }

  /* A thin band of state above the field. Everything else is canvas — the darkness is the
     game, so the chrome stays out of it. */
  #hud {
    display: flex; align-items: center; gap: 16px;
    padding: 9px 20px; border-bottom: 1px solid var(--line);
    background: rgba(3,4,10,.9); flex-shrink: 0;
  }
  #levelName {
    font-family: var(--font-display); font-weight: 700;
    font-size: clamp(12px, 1.4vw, 18px); white-space: nowrap;
  }
  #levelName .tag {
    display: block; font-family: var(--font-mono); font-size: 9px;
    letter-spacing: .16em; text-transform: uppercase; color: var(--text-faint);
  }

  /* Gate capacity, as physical slots. Watching them fill is the pressure. */
  #gate { display: flex; align-items: center; gap: 8px; }
  #gate .label {
    font-family: var(--font-mono); font-size: 9px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--text-faint);
  }
  #slots { display: flex; gap: 4px; }
  .slot {
    width: clamp(14px, 1.6vw, 20px); height: clamp(14px, 1.6vw, 20px);
    border-radius: 4px; border: 1px solid var(--line);
    background: rgba(26,32,56,.6); transition: background .2s, box-shadow .2s;
  }
  .slot.used { background: var(--lime); border-color: var(--lime); box-shadow: 0 0 14px var(--lime); }
  #gate.closed .slot { border-color: var(--hot); box-shadow: none; }

  /* The roster: one chip per player, showing legs left. It is the only place a player's
     condition is written down rather than inferred from how they move. */
  #roster { flex: 1; display: flex; gap: 7px; flex-wrap: wrap; justify-content: flex-end; }
  .chip {
    display: flex; align-items: center; gap: 6px;
    padding: 3px 9px; border-radius: 999px;
    border: 1px solid var(--line); background: rgba(10,12,24,.7);
    font-size: clamp(10px, 1.05vw, 13px); font-weight: 700;
    max-width: 15vw; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    transition: opacity .3s, filter .3s;
  }
  .chip .legs { font-family: var(--font-mono); font-size: 10px; letter-spacing: .08em; }
  .chip.hurt .legs { color: var(--amber); }
  .chip.crawl .legs { color: var(--hot); }
  .chip.dead { opacity: .3; filter: grayscale(1); }
  .chip.out { border-color: var(--lime); box-shadow: 0 0 12px rgba(157,255,79,.25); }

  /* Pulse timer: a hairline that drains between sonar sweeps. It is the only clock the
     players get, and watching it empty in the dark is most of the dread. */
  #pulsebar { height: 2px; background: rgba(53,240,224,.1); flex-shrink: 0; }
  #pulsefill { height: 100%; width: 0%; background: var(--glow); box-shadow: 0 0 10px var(--glow); }

  #stage { flex: 1; position: relative; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  #overlay {
    position: absolute; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; text-align: center; padding: 24px;
    background: radial-gradient(ellipse at center, rgba(3,4,10,.82), rgba(3,4,10,.97));
  }
  #overlay.hidden { display: none; }
  #overlay .big {
    font-size: clamp(28px, 5.5vw, 68px); font-weight: 700; line-height: 1.05;
    color: var(--glow); text-shadow: var(--bloom-glow);
  }
  #overlay .big.bad { color: var(--hot); text-shadow: var(--bloom-hot); }
  #overlay .sub { color: var(--text-dim); font-size: clamp(13px, 1.5vw, 19px); max-width: 56ch; line-height: 1.6; }
  #overlay .roll {
    font-family: var(--font-mono); font-size: clamp(11px, 1.2vw, 15px);
    color: var(--text-dim); line-height: 2;
  }
  #overlay .roll b { color: var(--lime); }
  #overlay .ring {
    width: 38px; height: 38px; border-radius: 50%;
    border: 2px solid rgba(53,240,224,.18); border-top-color: var(--glow);
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* A vignette that tightens as the killer closes. Pure atmosphere, driven by the sim. */
  #dread {
    position: absolute; inset: 0; pointer-events: none; z-index: 4;
    box-shadow: inset 0 0 18vw 6vw rgba(255,46,136,0);
    transition: box-shadow .5s ease-out;
  }
</style>
</head>
<body>

<div id="hud">
  <div id="levelName"><span class="tag">Level 1</span><span id="levelTitle">—</span></div>
  <div id="gate">
    <span class="label">Gate</span>
    <div id="slots"></div>
  </div>
  <div id="roster"></div>
</div>
<div id="pulsebar"><div id="pulsefill"></div></div>

<div id="stage">
  <canvas id="c"></canvas>
  <div id="dread"></div>
  <div id="overlay">
    <div class="ring"></div>
    <div class="sub">Waiting for players…</div>
  </div>
</div>

<script src="/sdk.js"></script>
<script type="module">
import {
  createRound, addPlayer, removePlayer, setInput, clearInput, startRound, step,
  tileReveal, mineAt, craterAt, speedOf,
  ALIVE, DEAD, ESCAPED, PRINT_LIFE,
} from "/games/minefield/sim.js?v=1";
import { LEVELS, getLevel } from "/games/minefield/levels.js?v=1";

const freeconsole = new FreeConsole();

/* ------------------------------------------------------------ test harness */

// ?test=1 runs the field with one keyboard player and no shell behind it, so the sim can be
// reloaded on every edit without re-joining a room. Anything touching the shell goes through
// safeCall, so a missing one is a no-op rather than a crash.
const TEST = new URLSearchParams(location.search).has("test");

function safeCall(fn, fallback) {
  try { return fn(); } catch (err) { return fallback; }
}
function nameOf(id) {
  return safeCall(() => freeconsole.getNickname(id), "Player " + id) || ("Player " + id);
}
function colorOf(id) {
  return safeCall(() => freeconsole.getPlayerColor(id), "#35f0e0") || "#35f0e0";
}
/** Room-wide clock. Never Date.now() — phones and the TV disagree by seconds. */
function now() {
  return safeCall(() => freeconsole.getServerTime(), Date.now());
}

/* -------------------------------------------------------------------- setup */

let levelIndex = 0;
let round = createRound(levelIndex, (Math.random() * 0xffffffff) >>> 0);

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const overlay = document.getElementById("overlay");
const dread = document.getElementById("dread");
const rosterEl = document.getElementById("roster");
const slotsEl = document.getElementById("slots");
const gateEl = document.getElementById("gate");
const pulsefill = document.getElementById("pulsefill");

let cssW = 0, cssH = 0, scale = 1, offX = 0, offY = 0;

function resize() {
  const rect = canvas.getBoundingClientRect();
  const dpr = Math.min(devicePixelRatio || 1, 2);
  cssW = rect.width;
  cssH = rect.height;
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // The whole field is always on screen. There is no camera: a minefield you cannot see all
  // of is a different, worse game, because the tension comes from knowing exactly how far
  // the gate is and exactly how little of the ground between you and it you understand.
  scale = Math.min(cssW / round.cols, cssH / round.rows);
  offX = (cssW - round.cols * scale) / 2;
  offY = (cssH - round.rows * scale) / 2;
}
addEventListener("resize", resize);

/* ---------------------------------------------------------------- transforms */

function tx(x) { return offX + x * scale; }
function ty(y) { return offY + y * scale; }

/* ------------------------------------------------------------------- roster */

function joinPlayer(deviceId) {
  // Already seated: a reconnect or a duplicate onConnect. Keep the seat, but drop anything
  // the old session left held — a stale key is what makes a player refuse to move.
  if (round.players.has(deviceId)) {
    clearInput(round, deviceId);
    return;
  }
  addPlayer(round, deviceId);
  renderRoster();
  renderSlots();

  if (round.phase === "briefing") maybeStart();
  broadcastState();
}

function leavePlayer(deviceId) {
  if (!round.players.has(deviceId)) return;
  removePlayer(round, deviceId);
  renderRoster();
  if (round.players.size === 0 && round.phase === "running") {
    round.phase = "briefing";
    showWaiting();
  }
  broadcastState();
}

/**
 * Rounds start on a countdown once anyone is in, rather than waiting for a quorum. One
 * player alone in a minefield is a perfectly good horror game; more is just worse for them.
 */
let countdown = 0;
let countdownTimer = null;

function maybeStart() {
  if (round.players.size === 0) { showWaiting(); return; }
  if (round.phase === "running" || countdownTimer) return;

  safeCall(() => freeconsole.setActivePlayers());
  countdown = 4;
  tickCountdown();
  countdownTimer = setInterval(tickCountdown, 1000);
}

function tickCountdown() {
  if (countdown > 0) {
    showOverlay(String(countdown), getLevel(levelIndex).tagline, false);
    countdown--;
    return;
  }
  clearInterval(countdownTimer);
  countdownTimer = null;
  startRound(round);
  showOverlay(null);
  renderRoster();
  renderSlots();
  broadcastState();
}

/** Rebuild the field for the next level (or a retry of this one) and re-seat everyone. */
function loadLevel(index) {
  levelIndex = Math.max(0, Math.min(LEVELS.length - 1, index));
  const ids = [...round.players.keys()];
  round = createRound(levelIndex, (Math.random() * 0xffffffff) >>> 0);
  for (const id of ids) addPlayer(round, id);

  document.getElementById("levelTitle").textContent = getLevel(levelIndex).name;
  document.querySelector("#levelName .tag").textContent = "Level " + (levelIndex + 1);
  resize();
  renderSlots();
  renderRoster();
}

/* ---------------------------------------------------------------- shell wiring */

freeconsole.onReady = function () {
  safeCall(() => freeconsole.setActivePlayers());
  for (const id of safeCall(() => freeconsole.getControllerDeviceIds(), []) || []) joinPlayer(id);
  renderRoster();
};

freeconsole.onConnect = joinPlayer;
freeconsole.onDisconnect = leavePlayer;

/**
 * Controllers send held directions and nothing else. No phone asserts a position, a step, or
 * a death — the field only exists here.
 */
freeconsole.onMessage = function (deviceId, data) {
  if (!data) return;

  if (data.t === "hold") {
    setInput(round, deviceId, data.k, data.v);
    return;
  }
  if (data.t === "release") {
    clearInput(round, deviceId);
    return;
  }
  if (data.t === "again" && round.phase === "over") {
    // Survivors move on; a wipe repeats the level. Either way the master controller decides,
    // so six phones tapping at once cannot start six rounds.
    const master = safeCall(() => freeconsole.getMasterControllerDeviceId(), deviceId);
    if (master !== undefined && deviceId !== master) return;
    const advance = round.escapedOrder.length > 0 && levelIndex + 1 < LEVELS.length;
    loadLevel(advance ? levelIndex + 1 : levelIndex);
    maybeStart();
  }
};

/**
 * State goes out on change, never per frame. Controllers need to know whether they can move,
 * how fast they are, and whether the gate is still open — not where anything is.
 */
let lastStateKey = "";
function broadcastState() {
  const legs = {};
  const states = {};
  for (const [id, p] of round.players) { legs[id] = p.legs; states[id] = p.state; }

  const key = JSON.stringify([
    round.phase, legs, states, round.exitOpen, round.exitUsed, levelIndex,
    round.level.exitCapacity, round.level.sonarPeriod,
  ]);
  if (key === lastStateKey) return;
  lastStateKey = key;

  safeCall(() => freeconsole.broadcast({
    phase: round.phase,
    legs,
    states,
    exitOpen: round.exitOpen,
    exitLeft: Math.max(0, round.level.exitCapacity - round.exitUsed),
    exitCapacity: round.level.exitCapacity,
    sonarPeriod: round.level.sonarPeriod,
    level: levelIndex + 1,
    levelName: getLevel(levelIndex).name,
  }));
}

/* ---------------------------------------------------------------------- hud */

function renderRoster() {
  const ids = [...round.players.keys()].sort((a, b) => a - b);
  rosterEl.innerHTML = "";
  for (const id of ids) {
    const p = round.players.get(id);
    const chip = document.createElement("div");
    chip.className = "chip";
    if (p.state === DEAD) chip.classList.add("dead");
    if (p.state === ESCAPED) chip.classList.add("out");
    if (p.legs === 1) chip.classList.add("hurt");
    if (p.legs === 0) chip.classList.add("crawl");
    chip.style.color = colorOf(id);

    const label = p.state === ESCAPED ? "OUT"
      : p.state === DEAD ? "✕"
      : p.legs === 2 ? "▮▮"
      : p.legs === 1 ? "▮"
      : "crawl";

    chip.innerHTML = '<span>' + escapeHtml(nameOf(id)) + '</span><span class="legs">' + label + "</span>";
    rosterEl.appendChild(chip);
  }
}

function renderSlots() {
  const cap = round.level.exitCapacity;
  slotsEl.innerHTML = "";
  for (let i = 0; i < cap; i++) {
    const s = document.createElement("div");
    s.className = "slot" + (i < round.exitUsed ? " used" : "");
    slotsEl.appendChild(s);
  }
  gateEl.classList.toggle("closed", !round.exitOpen);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}

function showOverlay(big, sub, bad) {
  if (big === null) { overlay.classList.add("hidden"); return; }
  overlay.classList.remove("hidden");
  overlay.innerHTML =
    '<div class="big' + (bad ? " bad" : "") + '">' + escapeHtml(big) + "</div>" +
    '<div class="sub">' + escapeHtml(sub || "") + "</div>";
}

function showWaiting() {
  overlay.classList.remove("hidden");
  overlay.innerHTML = '<div class="ring"></div><div class="sub">Waiting for players…</div>';
}

/** The end card: who got out, in order, and who is still in the field. */
function showResults() {
  const escaped = round.escapedOrder;
  const lost = [...round.players.values()].filter((p) => p.state !== ESCAPED);

  let rows = "";
  escaped.forEach((id, i) => {
    rows += "<div><b>" + (i + 1) + ". " + escapeHtml(nameOf(id)) + "</b> — through the gate</div>";
  });
  for (const p of lost) {
    rows += "<div>" + escapeHtml(nameOf(p.id)) + " — left in the field</div>";
  }

  const anyOut = escaped.length > 0;
  const more = levelIndex + 1 < LEVELS.length;

  overlay.classList.remove("hidden");
  overlay.innerHTML =
    '<div class="big' + (anyOut ? "" : " bad") + '">' +
      (anyOut ? "The gate closes" : "Nobody made it") + "</div>" +
    '<div class="roll">' + rows + "</div>" +
    '<div class="sub">' +
      (anyOut
        ? (more ? "Tap to walk into the next one." : "That was the last field. Tap to run it again.")
        : "Tap to try this field again.") +
    "</div>";
}

/* ------------------------------------------------------------------- effects */

// Short-lived blasts and rings, aged out by the frame loop. Cosmetic only — the sim never
// reads them back.
const fx = [];
let shake = 0;
let flash = 0;

function drainEvents() {
  for (const e of round.events) {
    if (e.type === "blast") {
      fx.push({ type: "blast", x: e.x, y: e.y, life: 1 });
      shake = Math.min(1, shake + 0.9);
      flash = Math.max(flash, 0.75);
      renderRoster();
      broadcastState();
    } else if (e.type === "death") {
      fx.push({ type: "death", x: e.x, y: e.y, life: 1, color: colorOf(e.id) });
      renderRoster();
      broadcastState();
    } else if (e.type === "escape") {
      fx.push({ type: "escape", x: e.x || round.cols / 2, y: 0, life: 1 });
      renderRoster();
      renderSlots();
      broadcastState();
    } else if (e.type === "gate-closed") {
      renderSlots();
      shake = Math.min(1, shake + 0.5);
    } else if (e.type === "pulse") {
      fx.push({ type: "ping", x: e.x, y: e.y, life: 1 });
    } else if (e.type === "over") {
      showResults();
      safeCall(() => freeconsole.setActivePlayers(0));
      broadcastState();
    }
  }
  round.events.length = 0;
}

/* ------------------------------------------------------------------- drawing */

function draw(dt) {
  ctx.save();

  // Screen shake, in canvas space so nothing in world coordinates has to know about it.
  if (shake > 0) {
    const k = shake * 7;
    ctx.translate((Math.random() - 0.5) * k, (Math.random() - 0.5) * k);
  }

  ctx.fillStyle = "#03040a";
  ctx.fillRect(-20, -20, cssW + 40, cssH + 40);

  drawField();
  drawCraters();
  drawMines();
  drawGate();
  drawPrints();
  drawSonarRing();
  drawKiller();
  for (const p of round.players.values()) drawPlayer(p);
  drawFx();

  ctx.restore();

  // A white wash on the frame a mine goes off, outside the shake so it covers everything.
  if (flash > 0) {
    ctx.fillStyle = "rgba(255,214,170," + (flash * 0.5).toFixed(3) + ")";
    ctx.fillRect(0, 0, cssW, cssH);
  }
}

/** The ground: a faint grid, so the field reads as tilled and measurable even in the dark. */
function drawField() {
  ctx.fillStyle = "#070912";
  ctx.fillRect(tx(0), ty(0), round.cols * scale, round.rows * scale);

  ctx.strokeStyle = "rgba(120,160,220,.05)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 0; x <= round.cols; x++) {
    ctx.moveTo(tx(x), ty(0));
    ctx.lineTo(tx(x), ty(round.rows));
  }
  for (let y = 0; y <= round.rows; y++) {
    ctx.moveTo(tx(0), ty(y));
    ctx.lineTo(tx(round.cols), ty(y));
  }
  ctx.stroke();

  // The spawn strip is the one piece of ground you are told is safe.
  const safeTop = round.rows - round.level.safeRows;
  ctx.fillStyle = "rgba(53,240,224,.035)";
  ctx.fillRect(tx(0), ty(safeTop), round.cols * scale, round.level.safeRows * scale);
}

/** Craters are permanent. A blown mine is the safest tile on the field, and it shows. */
function drawCraters() {
  for (let y = 0; y < round.rows; y++) {
    for (let x = 0; x < round.cols; x++) {
      if (!craterAt(round, x, y)) continue;
      const cx = tx(x + 0.5);
      const cy = ty(y + 0.5);
      const r = scale * 0.42;
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
      g.addColorStop(0, "rgba(28,16,12,.95)");
      g.addColorStop(1, "rgba(28,16,12,0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

/**
 * Mines are drawn only where the sonar currently reaches, at whatever brightness the ring
 * left them. This is the entire game: for a fraction of a second you can see the truth, and
 * then you are walking on memory.
 */
function drawMines() {
  for (let y = 0; y < round.rows; y++) {
    for (let x = 0; x < round.cols; x++) {
      if (!mineAt(round, x, y)) continue;
      const lit = tileReveal(round, x, y);
      if (lit <= 0.01) continue;

      const cx = tx(x + 0.5);
      const cy = ty(y + 0.5);
      const r = scale * 0.22;

      ctx.save();
      ctx.globalAlpha = lit;
      ctx.fillStyle = "#ff2e88";
      ctx.shadowColor = "#ff2e88";
      ctx.shadowBlur = 18 * lit;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();

      // A hard ring around the trigger radius, so the edge you can safely skirt is legible.
      ctx.globalAlpha = lit * 0.45;
      ctx.strokeStyle = "#ff2e88";
      ctx.lineWidth = Math.max(1, scale * 0.03);
      ctx.beginPath();
      ctx.arc(cx, cy, scale * 0.4, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
  }
}

/** The expanding sonar wavefront itself — a thin bright arc sweeping down the field. */
function drawSonarRing() {
  const s = round.sonar;
  if (!s) return;
  ctx.save();
  ctx.globalAlpha = 0.32;
  ctx.strokeStyle = "#35f0e0";
  ctx.lineWidth = Math.max(1.5, scale * 0.09);
  ctx.shadowColor = "#35f0e0";
  ctx.shadowBlur = 22;
  ctx.beginPath();
  ctx.arc(tx(s.x), ty(s.y), s.r * scale, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
}

/** The gate: open is a way out, closed is the worst news on the field. */
function drawGate() {
  const x0 = tx(round.exitFrom);
  const w = (round.exitTo - round.exitFrom + 1) * scale;
  const h = Math.max(3, scale * 0.22);

  if (round.exitOpen) {
    ctx.save();

    // A shaft of light spilling down into the field, so the way out is visible from the far
    // end even between pulses. Drawn additively: over near-black ground a plain alpha fill
    // reads as a muddy brown box rather than as light.
    ctx.globalCompositeOperation = "lighter";
    const g = ctx.createLinearGradient(0, ty(0), 0, ty(4));
    g.addColorStop(0, "rgba(120,190,60,.34)");
    g.addColorStop(0.5, "rgba(90,150,45,.12)");
    g.addColorStop(1, "rgba(60,110,30,0)");
    ctx.fillStyle = g;
    ctx.fillRect(x0, ty(0), w, 4 * scale);
    ctx.globalCompositeOperation = "source-over";

    // The threshold itself, bright and hard-edged so it reads as a way out and not as glow.
    ctx.fillStyle = "#c8ff8a";
    ctx.shadowColor = "#9dff4f";
    ctx.shadowBlur = 30;
    ctx.fillRect(x0, ty(0) - h, w, h);
    ctx.shadowBlur = 0;

    // Posts on either side, so the mouth has width and you can aim at it.
    ctx.fillStyle = "#9dff4f";
    const post = Math.max(2, scale * 0.14);
    ctx.fillRect(x0 - post, ty(0) - h, post, h + scale * 0.7);
    ctx.fillRect(x0 + w, ty(0) - h, post, h + scale * 0.7);
    ctx.restore();
  } else {
    ctx.save();
    ctx.fillStyle = "#b81f61";
    ctx.fillRect(x0, ty(0) - h, w, h);
    // Bars across the mouth.
    ctx.strokeStyle = "rgba(255,46,136,.65)";
    ctx.lineWidth = Math.max(1.5, scale * 0.06);
    ctx.beginPath();
    for (let i = 0; i <= (round.exitTo - round.exitFrom + 1) * 2; i++) {
      const x = x0 + (i * w) / ((round.exitTo - round.exitFrom + 1) * 2);
      ctx.moveTo(x, ty(0) - h);
      ctx.lineTo(x, ty(0.55));
    }
    ctx.stroke();
    ctx.restore();
  }
}

/**
 * Footprints, in the colour of whoever left them. They fade with age and never say whether
 * the ground was safe — that is the player's inference to make, and the one the game most
 * wants them to get wrong.
 */
function drawPrints() {
  for (const print of round.prints) {
    const a = 1 - print.age / PRINT_LIFE;
    if (a <= 0) continue;
    ctx.save();
    ctx.globalAlpha = a * 0.5;
    ctx.fillStyle = colorOf(print.id);
    const r = scale * (print.crawl ? 0.13 : 0.08);
    ctx.beginPath();
    if (print.crawl) {
      // A drag mark rather than a step, so a crawler's trail reads differently at a glance.
      ctx.ellipse(tx(print.x), ty(print.y), r * 1.9, r * 0.7, 0, 0, Math.PI * 2);
    } else {
      ctx.arc(tx(print.x), ty(print.y), r, 0, Math.PI * 2);
    }
    ctx.fill();
    ctx.restore();
  }
}

/**
 * The killer. Never fully drawn — a smear of darkness with a suggestion of shape, brightest
 * on the pulse that it emits. Showing it plainly would make it a sprite; keeping it barely
 * resolved keeps it a threat.
 */
function drawKiller() {
  // Nothing to see until it actually steps onto the field. Drawing its glow while it is
  // still behind the spawn line washes the bottom of the screen for the whole opening.
  if (round.killerY > round.rows) return;
  const cx = tx(round.killerX);
  const cy = ty(round.killerY);
  const r = scale * 1.6;

  ctx.save();
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
  g.addColorStop(0, "rgba(255,46,136,.28)");
  g.addColorStop(0.45, "rgba(90,10,40,.5)");
  g.addColorStop(1, "rgba(3,4,10,0)");
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fill();

  // The body: tall, thin, and unlit.
  ctx.fillStyle = "#05060d";
  ctx.beginPath();
  ctx.ellipse(cx, cy, scale * 0.34, scale * 0.62, 0, 0, Math.PI * 2);
  ctx.fill();

  // Two points of light where eyes would be. The only feature it ever gets.
  ctx.fillStyle = "rgba(255,46,136,.9)";
  ctx.shadowColor = "#ff2e88";
  ctx.shadowBlur = 14;
  ctx.beginPath();
  ctx.arc(cx - scale * 0.13, cy - scale * 0.16, Math.max(1, scale * 0.055), 0, Math.PI * 2);
  ctx.arc(cx + scale * 0.13, cy - scale * 0.16, Math.max(1, scale * 0.055), 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawPlayer(p) {
  if (p.state === ESCAPED) return;

  const cx = tx(p.x);
  const cy = ty(p.y);
  const color = colorOf(p.id);

  if (p.state === DEAD) {
    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.ellipse(cx, cy, scale * 0.34, scale * 0.16, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    return;
  }

  ctx.save();
  ctx.fillStyle = color;
  ctx.shadowColor = color;
  ctx.shadowBlur = 14;

  // Body shape carries the injury: upright, leaning, or flat on the ground. Legs are the
  // most important thing about a player and must be readable across a room.
  if (p.legs === 0) {
    ctx.beginPath();
    ctx.ellipse(cx, cy, scale * 0.3, scale * 0.15, 0, 0, Math.PI * 2);
    ctx.fill();
  } else {
    const h = scale * (p.legs === 1 ? 0.42 : 0.52);
    const w = scale * 0.22;
    ctx.beginPath();
    ctx.ellipse(cx, cy, w, h, p.legs === 1 ? 0.3 : 0, 0, Math.PI * 2);
    ctx.fill();
    // Head.
    ctx.beginPath();
    ctx.arc(cx, cy - h * 0.85, scale * 0.13, 0, Math.PI * 2);
    ctx.fill();
  }

  // A stunned player pulses, because "why am I not moving" needs an answer on screen.
  if (p.stun > 0) {
    ctx.globalAlpha = 0.4 + 0.4 * Math.sin(round.t * 22);
    ctx.strokeStyle = "#ffc247";
    ctx.lineWidth = Math.max(1, scale * 0.05);
    ctx.beginPath();
    ctx.arc(cx, cy, scale * 0.5, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.restore();
}

function drawFx() {
  for (const f of fx) {
    const a = f.life;
    ctx.save();
    if (f.type === "blast") {
      const r = scale * (1 - a) * 2.6;
      const g = ctx.createRadialGradient(tx(f.x), ty(f.y), 0, tx(f.x), ty(f.y), Math.max(1, r));
      g.addColorStop(0, "rgba(255,240,200," + (a * 0.9).toFixed(3) + ")");
      g.addColorStop(0.4, "rgba(255,120,40," + (a * 0.7).toFixed(3) + ")");
      g.addColorStop(1, "rgba(255,46,136,0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(tx(f.x), ty(f.y), Math.max(1, r), 0, Math.PI * 2);
      ctx.fill();
    } else if (f.type === "death") {
      ctx.globalAlpha = a * 0.6;
      ctx.fillStyle = f.color || "#ff2e88";
      ctx.beginPath();
      ctx.arc(tx(f.x), ty(f.y), scale * (1 - a) * 1.4, 0, Math.PI * 2);
      ctx.fill();
    } else if (f.type === "escape") {
      ctx.globalAlpha = a * 0.8;
      ctx.strokeStyle = "#9dff4f";
      ctx.lineWidth = Math.max(1, scale * 0.08);
      ctx.beginPath();
      ctx.arc(tx(f.x), ty(f.y), scale * (1 - a) * 2.2, 0, Math.PI * 2);
      ctx.stroke();
    } else if (f.type === "ping") {
      ctx.globalAlpha = a * 0.18;
      ctx.strokeStyle = "#35f0e0";
      ctx.lineWidth = Math.max(1, scale * 0.05);
      ctx.beginPath();
      ctx.arc(tx(f.x), ty(f.y), scale * (1 - a) * 3, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
  }
}

/* --------------------------------------------------------------------- loop */

let last = 0;

function frame(ts) {
  requestAnimationFrame(frame);
  if (!last) { last = ts; resize(); }

  // Clamp dt so a backgrounded tab does not advance the killer across the whole field on
  // return, or step a player through a mine they never saw.
  const dt = Math.min(0.05, (ts - last) / 1000);
  last = ts;

  step(round, dt);
  drainEvents();

  for (const f of fx) f.life -= dt * (f.type === "ping" ? 0.9 : 1.9);
  for (let i = fx.length - 1; i >= 0; i--) if (fx[i].life <= 0) fx.splice(i, 1);
  if (shake > 0) shake = Math.max(0, shake - dt * 2.6);
  if (flash > 0) flash = Math.max(0, flash - dt * 3.2);

  updateDread();
  updatePulseBar();
  draw(dt);
}

/**
 * The vignette tightens with the distance from the killer to the nearest living player, so
 * the screen itself gets more claustrophobic as it closes.
 */
function updateDread() {
  // Nothing while the killer is still off the field: the vignette means "it is close", and
  // showing it during the opening seconds spends the effect before there is anything to fear.
  if (round.phase !== "running" || round.killerY > round.rows) {
    dread.style.boxShadow = "inset 0 0 18vw 6vw rgba(255,46,136,0)";
    return;
  }
  let nearest = Infinity;
  for (const p of round.players.values()) {
    if (p.state !== ALIVE) continue;
    nearest = Math.min(nearest, Math.abs(p.y - round.killerY));
  }
  if (!isFinite(nearest)) nearest = 99;
  // Scaled to the field's depth rather than a fixed row count, so a shallow field does not
  // sit permanently pinned at full dread.
  const close = Math.max(0, 1 - nearest / (round.rows * 0.4));
  dread.style.boxShadow = "inset 0 0 " + (18 + close * 10).toFixed(1) + "vw " +
    (6 + close * 5).toFixed(1) + "vw rgba(255,46,136," + (close * 0.5).toFixed(3) + ")";
}

function updatePulseBar() {
  if (round.phase !== "running") { pulsefill.style.width = "0%"; return; }
  const period = round.level.sonarPeriod;
  const left = Math.max(0, round.nextSonarAt - round.t);
  pulsefill.style.width = ((1 - left / period) * 100).toFixed(1) + "%";
}

/* --------------------------------------------------------------------- boot */

loadLevel(0);
showWaiting();
requestAnimationFrame(frame);

/* --------------------------------------------------------------- test mode */

if (TEST) {
  // One local walker on the arrow keys / WASD, so the field can be reloaded on every edit.
  addPlayer(round, 1);
  renderRoster();
  startRound(round);
  showOverlay(null);

  // Expose the live round so a driver script can assert on it. Test mode only, so the
  // shipped game keeps nothing on the global.
  window.__round = round;

  const keys = {
    ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
    KeyW: "up", KeyS: "down", KeyA: "left", KeyD: "right",
  };
  addEventListener("keydown", (e) => {
    if (keys[e.code]) { setInput(round, 1, keys[e.code], true); e.preventDefault(); }
    if (e.code === "Enter") { loadLevel(levelIndex); addPlayer(round, 1); startRound(round); showOverlay(null); window.__round = round; }
  });
  addEventListener("keyup", (e) => {
    if (keys[e.code]) setInput(round, 1, keys[e.code], false);
  });
}
</script>
</body>
</html>
