<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FreeConsole TV check</title>
<style>
  body { margin:0; padding:20px; background:#05060d; color:#eaf2ff;
         font:16px/1.5 monospace; }
  h1 { font-size:20px; margin:0 0 12px; }
  .row { padding:7px 0; border-bottom:1px solid #223; word-wrap:break-word; }
  .ok { color:#9dff4f; } .bad { color:#ff2e88; } .warn { color:#ffc247; }
  pre { white-space:pre-wrap; word-break:break-all; color:#8492b8;
        font-size:13px; margin:3px 0 0; }
</style>
</head>
<body>
<h1>FreeConsole TV check</h1>
<div id="out"></div>

<!-- Deliberately a CLASSIC script, not a module: no import, no await, no arrow
     functions, no let/const, no template literals. This page must run on the
     oldest browser we care about, because its entire job is to report why the
     real pages do not. Anything modern here makes it fail the same silent way. -->
<script>
var out = document.getElementById("out");

function line(state, label, detail) {
  var div = document.createElement("div");
  div.className = "row";
  var tag = document.createElement("span");
  tag.className = state;
  tag.appendChild(document.createTextNode(
    state === "ok" ? "OK   " : state === "bad" ? "BAD  " : "WARN "));
  div.appendChild(tag);
  div.appendChild(document.createTextNode(label));
  if (detail) {
    var pre = document.createElement("pre");
    pre.appendChild(document.createTextNode(String(detail)));
    div.appendChild(pre);
  }
  out.appendChild(div);
}

// Catch anything the page itself throws, including parse errors in the modules
// we load below. This is the whole point of the page.
window.onerror = function (msg, src, ln, col) {
  line("bad", "JS ERROR", msg + "\n" + (src || "") + " line " + ln + ":" + col);
  return false;
};

line("ok", "this page runs (classic script parsed)");
line("ok", "user agent", navigator.userAgent);

// --- syntax support probes -------------------------------------------------
// eval() so an unsupported construct is a caught runtime error here rather than
// a parse error that would kill this whole file.
function probe(label, src) {
  try { eval(src); line("ok", "supports " + label); }
  catch (e) { line("bad", "NO " + label + " -- " + e.message); }
}
probe("arrow functions", "(function(){ var f = function(){return 1}; return f(); })()");
probe("optional chaining ?.", "var o={a:{b:1}}; o?.a?.b");
probe("nullish ??", "var x = null; x ?? 1");
probe("async/await", "(async function(){ return 1 })()");
probe("template literals", "var a=1; `x${a}`");
probe("class", "class Foo {}");
probe("Promise.finally", "Promise.resolve().finally(function(){})");
probe("Object.entries", "Object.entries({a:1})");
probe("Array.includes", "[1].includes(1)");
probe("dynamic import()", "import('/player-colors.js')");

// --- can this browser load an ES module at all? ----------------------------
var modScript = document.createElement("script");
modScript.type = "module";
modScript.textContent =
  "window.__modOK = true;";
document.head.appendChild(modScript);

// --- fetch the real modules and see if they PARSE --------------------------
// Loading each as a module script surfaces a parse error via window.onerror
// above, naming the exact file and line that breaks the room.
var mods = ["/player-colors.js", "/firebase-config.js", "/qr.js", "/chrome.js",
            "/relay.js", "/room.js", "/session.js", "/peer.js", "/account.js"];

function checkModule(i) {
  if (i >= mods.length) { finish(); return; }
  var url = mods[i];
  var s = document.createElement("script");
  s.type = "module";
  // A module that fails to PARSE fires onerror on window (handled above);
  // one that fails to LOAD fires this.
  s.onerror = function () {
    line("bad", "failed to load " + url);
    checkModule(i + 1);
  };
  s.textContent = "import '" + url + "?tvcheck=1'; " +
                  "window.__loaded = (window.__loaded||[]); " +
                  "window.__loaded.push('" + url + "');";
  document.head.appendChild(s);
  // Modules load async; give each a moment before judging.
  setTimeout(function () {
    var got = window.__loaded || [];
    var found = false;
    for (var j = 0; j < got.length; j++) if (got[j] === url) found = true;
    line(found ? "ok" : "bad", (found ? "parsed+linked " : "DID NOT LOAD ") + url);
    checkModule(i + 1);
  }, 900);
}

function finish() {
  line(window.__modOK ? "ok" : "bad",
       window.__modOK ? "ES modules supported" : "ES MODULES NOT SUPPORTED");
  line("warn", "done - photograph this screen");
}

setTimeout(function () { checkModule(0); }, 600);
</script>
</body>
</html>
